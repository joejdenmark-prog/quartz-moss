<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfdae0">
<title>Snowy Forest — Foliage Card Prototype</title>
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#cfdae0;
    font-family:system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #canvas{
    display:block; width:100%; height:100%;
    touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  /* Cool, light edge darkening rather than a dark dramatic vignette -- the
     brief is "bright and calm, not dim or moody", so this only needs to
     softly draw the eye inward, not shade the scene down. */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse 100% 90% at 50% 45%,
      transparent 55%, rgba(170,190,200,0.22) 82%, rgba(150,172,185,0.38) 100%);
  }
  #fps{
    position:fixed; top:8px; left:8px; z-index:9999;
    font:12px/1.4 monospace; color:#eaf2f6;
    background:rgba(20,30,36,0.55); padding:4px 8px; border-radius:4px;
    pointer-events:none; white-space:pre;
  }
  #proto-badge{
    position:fixed; top:8px; right:8px; z-index:9999;
    font:12px/1.4 monospace; color:#eaf2f6;
    background:rgba(90,40,20,0.65); padding:4px 8px; border-radius:4px;
    pointer-events:none; white-space:pre;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>
<div id="fps">-- fps</div>
<div id="proto-badge">foliage-card prototype</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Seeded RNG ───────────────────────────────────────────────────────────────
// Same mulberry32 helper as the other scenes — deterministic across reloads,
// which makes the forest layout reproducible while tuning.
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng   = mulberry32(0x5f10001);
const range = (a,b) => a + rng() * (b - a);

// ── Renderer / scene / camera ────────────────────────────────────────────────
// visualViewport (not window.innerWidth/Height) avoids the iOS Safari
// address-bar-collapse mismatch — same reasoning as the other scenes.
function getViewportSize(){
  if (window.visualViewport) {
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}

let { w: W, h: H } = getViewportSize();
const canvas = document.getElementById('canvas');
const isMobile = window.matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
// No shadow maps at all, deliberately: overcast daylight scatters through a
// full cloud layer, so real shadows are extremely soft to the point of
// being nearly invisible anyway. Skipping shadow maps entirely both matches
// the "shadowless-feeling light" brief exactly and keeps this stage cheap —
// nothing here needs to pay for shadow-map render passes.
renderer.shadowMap.enabled = false;

// Sky/fog share one color so the horizon has no visible seam where the fog
// stops and open background starts — distant trees just fade smoothly away.
const SKY_COLOR = 0xcfdbe1;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);
// Light and airy per the brief, not a heavy near-in fog: starts well past
// the midground so close/mid trees stay crisp, and only softly dissolves
// the far edge of the forest into the sky color.
scene.fog = new THREE.Fog(SKY_COLOR, 45, 125);

// Perspective, not orthographic — "viewed from a fixed camera angle" reads
// as standing at the edge of a clearing looking in, which needs a real
// vanishing point (matches rain.html's reasoning for the same choice).
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 260);
camera.position.set(0, 1.7, 9);
camera.lookAt(0, 1.3, -30);

let resizeTimer;
function handleViewportResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const size = getViewportSize();
    W = size.w; H = size.h;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }, 250);
}
window.addEventListener('resize', handleViewportResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewportResize);
}

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xdce8ee, 0xb7bfae, 1.15));
const sky = new THREE.DirectionalLight(0xf3f8fb, 0.35);
sky.position.set(-8, 20, 6);
scene.add(sky);

// ── Ground: snowy plane with gentle undulation ───────────────────────────────
const GROUND_W = 400, GROUND_D = 220, GROUND_SEGS_X = 80, GROUND_SEGS_Z = 50;
const groundGeo = new THREE.PlaneGeometry(GROUND_W, GROUND_D, GROUND_SEGS_X, GROUND_SEGS_Z);
groundGeo.rotateX(-Math.PI / 2);
groundGeo.translate(0, 0, -80);

const SNOW_BASE  = new THREE.Color(0xeef4f7);
const SNOW_SHADE = new THREE.Color(0xc7d6dc);
{
  const pos = groundGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = Math.sin(x * 0.035 + 1.0) * 0.35
            + Math.sin(z * 0.045 + 2.4) * 0.40
            + Math.sin((x + z) * 0.021 + 0.7) * 0.50
            + Math.sin((x - z) * 0.013 + 3.1) * 0.30;
    pos.setY(i, h);
    const t = THREE.MathUtils.clamp((h + 0.9) / 1.8, 0, 1);
    c.copy(SNOW_SHADE).lerp(SNOW_BASE, t);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();
}

function clampByte(v){ return Math.max(0, Math.min(255, v | 0)); }

function makeSnowGrainTexture(size){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - 0.5) * 30;
    d[i]   = clampByte(255 + n);
    d[i+1] = clampByte(255 + n);
    d[i+2] = clampByte(255 + n * 0.92);
    d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const grainTex = makeSnowGrainTexture(256);
grainTex.repeat.set(50, 28);

const groundMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.92,
  metalness: 0.0,
  map: grainTex,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

// ── Trees ─────────────────────────────────────────────────────────────────────
// PROTOTYPE (Option B from the tree-detail exploration): the canopy is no
// longer smooth cones. Instead each tree gets a small cluster of flat,
// alpha-cutout "needle clump" cards arranged in a rough conical taper
// (wide/low near the trunk, narrow/high at the tip) approximating the same
// silhouette the two-tier cones used to. All cards across the whole forest
// share ONE geometry + ONE material + ONE InstancedMesh (same discipline as
// the rest of this file), so draw-call count for the canopy actually DROPS
// from 2 (tier1+tier2) to 1. Cards are NOT true per-frame camera-facing
// billboards -- the scene's camera never moves, so each card's orientation
// is just baked in once (radially outward from the trunk axis) with
// DoubleSide rendering as a cheap substitute, rather than paying for
// billboard matrix math in the vertex shader for no real benefit here.
const TREE_COUNT = 360;

const TRUNK_H = 1.6, TRUNK_R_TOP = 0.09, TRUNK_R_BOTTOM = 0.14;
const trunkGeo = new THREE.CylinderGeometry(TRUNK_R_TOP, TRUNK_R_BOTTOM, TRUNK_H, 6, 1);
trunkGeo.translate(0, TRUNK_H / 2, 0);

const CANOPY_GREEN = new THREE.Color(0x44543f);
const CANOPY_SNOW  = new THREE.Color(0xeef3f2);

// Same overall canopy envelope the old two-tier cones used, kept only as
// reference dimensions for scattering card slots through -- there's no
// cone geometry being built from these any more.
const TIER1_R = 0.85, TIER1_H = 1.7, TIER1_BASE_Y = TRUNK_H * 0.5;
const TIER2_R = 0.55, TIER2_H = 1.5, TIER2_BASE_Y = TIER1_BASE_Y + TIER1_H * 0.55;
const CANOPY_Y_BOTTOM = TIER1_BASE_Y;
const CANOPY_Y_TOP = TIER2_BASE_Y + TIER2_H;
const CANOPY_Y_SPAN = CANOPY_Y_TOP - CANOPY_Y_BOTTOM;

// Card "slots": one shared layout reused by every tree (like the old cone
// geometry was identical for every tree) -- randomized once at load via the
// same seeded rng as everything else, not per-tree, so this stays a single
// small array rather than 360 separate layouts.
const CARD_BANDS = [
  { yFrac: 0.06, radius: TIER1_R * 0.95, count: 7 },
  { yFrac: 0.24, radius: TIER1_R * 0.78, count: 6 },
  { yFrac: 0.42, radius: TIER1_R * 0.55, count: 5 },
  { yFrac: 0.60, radius: TIER2_R * 0.85, count: 5 },
  { yFrac: 0.77, radius: TIER2_R * 0.55, count: 4 },
  { yFrac: 0.92, radius: TIER2_R * 0.22, count: 3 },
];
const CARD_SLOTS = [];
for (const band of CARD_BANDS) {
  for (let k = 0; k < band.count; k++) {
    const angle = (k / band.count) * Math.PI * 2 + range(-0.3, 0.3);
    const y = CANOPY_Y_BOTTOM + band.yFrac * CANOPY_Y_SPAN + range(-0.05, 0.05);
    const r = band.radius * range(0.85, 1.15);
    // Sized against the ~0.49-unit vertical gap between bands (not against
    // the whole canopy radius, which is what produced a handful of oversized
    // dominant blades instead of many small overlapping clumps the first
    // time around) -- modest, roughly clump-sized absolute dimensions.
    const w = range(0.32, 0.5);
    const h = range(0.28, 0.46);
    CARD_SLOTS.push({ y, angle, r, w, h, heightT: band.yFrac });
  }
}
const CARDS_PER_TREE = CARD_SLOTS.length; // 30

// Local (tree-space) transform for each slot, shared across every tree --
// composed with each tree's own placement matrix at instance-build time.
const slotDummy = new THREE.Object3D();
const CARD_SLOT_MATRICES = CARD_SLOTS.map(s => {
  slotDummy.position.set(Math.cos(s.angle) * s.r, s.y, Math.sin(s.angle) * s.r);
  slotDummy.rotation.set(0, s.angle, 0); // faces roughly radially outward from the trunk axis
  slotDummy.scale.set(s.w, s.h, 1);
  slotDummy.updateMatrix();
  return slotDummy.matrix.clone();
});

// Needle-clump silhouette: a soft filled "puff" body (overlapping blurred-
// edge blobs) so the card reads as a solid clump rather than a hollow
// shape, plus sharper needle strokes layered on top for edge texture. The
// first version of this texture was ONLY thin radiating lines, which at
// actual on-screen card size read as sparse scratchy arrows rather than
// foliage -- no fillRect background either way (unlike the old sparkle
// texture), so the canvas stays transparent everywhere nothing is drawn,
// and that alpha channel becomes the cutout shape via alphaTest.
function makeNeedleClusterTexture(size){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const baseX = size * 0.5, baseY = size * 0.95;

  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 11; i++) {
    const bx = baseX + range(-size * 0.3, size * 0.3);
    const by = baseY - range(size * 0.12, size * 0.6);
    const r = range(size * 0.14, size * 0.26);
    ctx.globalAlpha = range(0.4, 0.65);
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = '#ffffff';
  ctx.lineCap = 'round';
  const bladeCount = 30;
  for (let i = 0; i < bladeCount; i++) {
    const angle = range(-1.15, 1.15) - Math.PI / 2; // fans upward, ~130 degrees wide around straight-up
    const len = range(size * 0.3, size * 0.75);
    const tipX = baseX + Math.cos(angle) * len;
    const tipY = baseY + Math.sin(angle) * len;
    const midX = (baseX + tipX) / 2 + range(-size * 0.05, size * 0.05);
    const midY = (baseY + tipY) / 2;
    ctx.globalAlpha = range(0.6, 1.0);
    ctx.lineWidth = range(size * 0.02, size * 0.045);
    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    ctx.quadraticCurveTo(midX, midY, tipX, tipY);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(cnv);
  return tex;
}
const needleTex = makeNeedleClusterTexture(128);

// Card base geometry: a unit plane with its pivot moved to the bottom edge
// (translate +0.5 in Y) so it "grows up" from its slot anchor point, the
// same way the old cone geometries were translated to sit correctly.
const cardGeo = new THREE.PlaneGeometry(1, 1);
cardGeo.translate(0, 0.5, 0);

// aHeightT: fixed per card slot (which height band it's in), not per-vertex
// like the old cone gradient -- a single flat card only needs one coverage
// level, not a continuous gradient across its own small area.
const cardHeightTArr = new Float32Array(TREE_COUNT * CARDS_PER_TREE);
// aResetTime: per-CARD mirror of the per-TREE resetTimeAttr below (every
// card belonging to tree i always holds the same value as resetTimeAttr[i]
// -- see writeTreeResetTime()). Needed because InstancedBufferAttribute is
// indexed per-instance (per-card here), not per-tree.
const cardResetTimeArr = new Float32Array(TREE_COUNT * CARDS_PER_TREE);
const cardHeightTAttr = new THREE.InstancedBufferAttribute(cardHeightTArr, 1);
const cardResetTimeAttr = new THREE.InstancedBufferAttribute(cardResetTimeArr, 1);
cardResetTimeAttr.setUsage(THREE.DynamicDrawUsage);
cardGeo.setAttribute('aHeightT', cardHeightTAttr);
cardGeo.setAttribute('aResetTime', cardResetTimeAttr);

// Snow buildup constants -- identical values/formula to the current
// deployed scene, so the coverage/tap-dusting behavior being compared is
// otherwise apples-to-apples with only the canopy representation changed.
const SNOW_BUILDUP_MAX   = 0.92;
const SNOW_BUILDUP_SPAN  = 15;

// Per-tree "last dusted" timestamp -- same role as in the deployed scene,
// still the single source of truth for coverage bookkeeping (coverageNow/
// applyTap read this directly); cardResetTimeAttr is just its GPU-facing
// mirror, kept in sync via writeTreeResetTime() below.
const resetTimeAttr = new Float32Array(TREE_COUNT);

const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3b2e26, roughness: 0.95 });

// alphaTest (not `transparent:true`) is the deliberate choice here: it
// keeps cards on the cheap opaque render path (normal depth-write, no
// blend sorting) while still cutting out the fully-transparent parts of
// the needle texture -- correct overlap/occlusion between many overlapping
// cards without paying for real transparency sorting.
const cardMat = new THREE.MeshStandardMaterial({
  map: needleTex,
  alphaTest: 0.4,
  roughness: 0.85,
  side: THREE.DoubleSide, // cards aren't true billboards, so both faces need to shade correctly from any angle
});
// Same onBeforeCompile patch idiom as the deployed scene's canopy shader --
// only the two attributes it reads are now per-instance (per-card) rather
// than per-vertex/per-tree-instance, since a card is a single flat clump
// rather than a smooth height-gradient surface.
cardMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uCanopyGreen = { value: CANOPY_GREEN };
  shader.uniforms.uCanopySnow = { value: CANOPY_SNOW };
  shader.uniforms.uBuildupMax = { value: SNOW_BUILDUP_MAX };
  shader.uniforms.uBuildupSpan = { value: SNOW_BUILDUP_SPAN };

  shader.vertexShader = `
    attribute float aHeightT;
    attribute float aResetTime;
    uniform float uTime, uBuildupMax, uBuildupSpan;
    uniform vec3 uCanopyGreen, uCanopySnow;
    varying vec3 vSnowColor;
  ` + shader.vertexShader.replace('#include <color_vertex>', `
    #include <color_vertex>
    {
      float elapsed = max(uTime - aResetTime, 0.0);
      float elapsedNorm = min(1.0, elapsed / uBuildupSpan);
      float coverage = uBuildupMax * elapsedNorm;
      float exponent = mix(1.6, 0.15, coverage);
      float blend = pow(aHeightT, exponent) * elapsedNorm;
      vec3 snowColor = mix(uCanopyGreen, uCanopySnow, blend);
      #ifdef USE_INSTANCING_COLOR
        snowColor *= instanceColor.rgb;
      #endif
      vSnowColor = snowColor;
    }
  `);
  shader.fragmentShader = `varying vec3 vSnowColor;\n` +
    shader.fragmentShader.replace('#include <color_fragment>', `
    #include <color_fragment>
    diffuseColor.rgb = vSnowColor;
  `);
  cardMat.userData.shader = shader;
};

const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
const CARD_TOTAL = TREE_COUNT * CARDS_PER_TREE;
const cardMesh = new THREE.InstancedMesh(cardGeo, cardMat, CARD_TOTAL);
trunkMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
// Card instance matrices DO get rewritten (the shake effect below rewrites
// them for whichever trees are actively shaking), so DynamicDrawUsage here
// -- unlike the deployed scene's fully-static tree instanceMatrix.
cardMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const FIELD_HALF_X = 90;
const FIELD_Z_NEAR = 6;
const FIELD_Z_FAR  = -100;
const MIN_SPACING  = 2.6;
function scatterTrees(count){
  const placements = [];
  let attempts = 0;
  const maxAttempts = count * 60;
  while (placements.length < count && attempts < maxAttempts) {
    attempts++;
    const x = range(-FIELD_HALF_X, FIELD_HALF_X);
    const z = range(FIELD_Z_FAR, FIELD_Z_NEAR);
    if (Math.abs(x) < 1.6 && z > FIELD_Z_NEAR - 3.5) continue;
    let ok = true;
    for (let i = 0; i < placements.length; i++) {
      const dx = placements[i].x - x, dz = placements[i].z - z;
      if (dx*dx + dz*dz < MIN_SPACING*MIN_SPACING) { ok = false; break; }
    }
    if (ok) placements.push({ x, z });
  }
  return placements;
}
const treePlacements = scatterTrees(TREE_COUNT);

const HEIGHT_MULT = 1.65;

// Per-tree transform WITHOUT rotationY, used only for card instancing --
// cards ignore the trunk's own random yaw (their local slot angles are
// already randomized in CARD_SLOTS, and un-rotating them here avoids
// needing to account for tree rotation in the billboard-substitute facing
// math). Trunk keeps its own randomized rotation via `dummy` below, since
// that doesn't affect a plain cylinder's silhouette anyway.
const cardTreeMatrices = new Array(treePlacements.length);

const dummy = new THREE.Object3D();
const tint = new THREE.Color();
const _finalMat = new THREE.Matrix4();
for (let i = 0; i < treePlacements.length; i++) {
  const { x, z } = treePlacements[i];
  const scale = range(0.8, 1.35);
  const rotY = range(0, Math.PI * 2);

  dummy.position.set(x, 0, z);
  dummy.rotation.set(0, rotY, 0);
  dummy.scale.set(scale, scale * HEIGHT_MULT, scale);
  dummy.updateMatrix();
  trunkMesh.setMatrixAt(i, dummy.matrix);

  dummy.rotation.set(0, 0, 0);
  dummy.updateMatrix();
  cardTreeMatrices[i] = dummy.matrix.clone();

  tint.setHSL(0.32 + range(-0.03, 0.03), 0.18 + range(-0.06, 0.06), 0.92 + range(-0.06, 0.04));

  for (let j = 0; j < CARDS_PER_TREE; j++) {
    const instIdx = i * CARDS_PER_TREE + j;
    _finalMat.multiplyMatrices(cardTreeMatrices[i], CARD_SLOT_MATRICES[j]);
    cardMesh.setMatrixAt(instIdx, _finalMat);
    cardMesh.setColorAt(instIdx, tint);
    cardHeightTArr[instIdx] = CARD_SLOTS[j].heightT;
  }
}
trunkMesh.count = treePlacements.length;
cardMesh.count = treePlacements.length * CARDS_PER_TREE;
trunkMesh.instanceMatrix.needsUpdate = true;
cardMesh.instanceMatrix.needsUpdate = true;
cardMesh.instanceColor.needsUpdate = true;
cardHeightTAttr.needsUpdate = true;

scene.add(trunkMesh, cardMesh);

// ── Falling snow ──────────────────────────────────────────────────────────────
const SNOW_COUNT = 3000;
const SNOW_X_HALF = 70;
const SNOW_Z_NEAR = 8, SNOW_Z_FAR = -100;
const SNOW_Y_TOP = 34, SNOW_Y_BOTTOM = -2;

const snowGeo = new THREE.BufferGeometry();
const anchors  = new Float32Array(SNOW_COUNT * 3);
const fallInfo = new Float32Array(SNOW_COUNT * 2);
const drift    = new Float32Array(SNOW_COUNT * 4);
const sizes    = new Float32Array(SNOW_COUNT);

for (let i = 0; i < SNOW_COUNT; i++) {
  anchors[i*3+0] = range(-SNOW_X_HALF, SNOW_X_HALF);
  anchors[i*3+1] = 0;
  anchors[i*3+2] = range(SNOW_Z_FAR, SNOW_Z_NEAR);

  fallInfo[i*2+0] = range(2.2, 4.2);
  fallInfo[i*2+1] = range(0, 1000);

  drift[i*4+0] = range(0.3, 1.1);
  drift[i*4+1] = range(0.15, 0.45);
  drift[i*4+2] = range(0, Math.PI * 2);
  drift[i*4+3] = range(0.2, 0.7);

  sizes[i] = range(2.0, 5.0);
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(anchors, 3));
snowGeo.setAttribute('aFall', new THREE.BufferAttribute(fallInfo, 2));
snowGeo.setAttribute('aDrift', new THREE.BufferAttribute(drift, 4));
snowGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

const snowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uYTop: { value: SNOW_Y_TOP },
    uYBottom: { value: SNOW_Y_BOTTOM },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uFogColor: { value: new THREE.Color(SKY_COLOR) },
    uFogNear: { value: scene.fog.near },
    uFogFar: { value: scene.fog.far },
  },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec2 aFall;
    attribute vec4 aDrift;
    attribute float aSize;
    uniform float uTime, uYTop, uYBottom, uPixelRatio;
    varying float vFogDepth;
    varying float vAlpha;

    float groundHeight(vec2 xz){
      float x = xz.x, z = xz.y;
      return sin(x*0.035 + 1.0) * 0.35
           + sin(z*0.045 + 2.4) * 0.40
           + sin((x+z)*0.021 + 0.7) * 0.50
           + sin((x-z)*0.013 + 3.1) * 0.30;
    }

    void main(){
      float span = uYTop - uYBottom;
      float fallT = mod(uTime * aFall.x + aFall.y, span);
      float y = uYTop - fallT;

      float driftX = sin(uTime * aDrift.y + aDrift.z) * aDrift.x;
      float driftZ = cos(uTime * aDrift.y * 0.8 + aDrift.z * 1.3) * aDrift.w;
      float worldX = position.x + driftX, worldZ = position.z + driftZ;

      float groundY = groundHeight(vec2(worldX, worldZ));
      float aboveGround = y - groundY;
      float landFade = smoothstep(0.0, 0.6, aboveGround);
      y = max(y, groundY);

      vec3 pos = vec3(worldX, y, worldZ);
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;

      float dist = -mvPosition.z;
      gl_PointSize = clamp(aSize * uPixelRatio * (50.0 / max(dist, 3.0)), 1.0, 40.0);
      vFogDepth = dist;

      float fadeIn = smoothstep(0.0, span * 0.06, fallT);
      vAlpha = fadeIn * landFade;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor; uniform float uFogNear, uFogFar;
    varying float vFogDepth; varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.35, d);
      if (shape < 0.01) discard;
      float fog = smoothstep(uFogNear, uFogFar, vFogDepth);
      vec3 col = mix(vec3(1.0), uFogColor, fog * 0.7);
      float alpha = shape * vAlpha * (1.0 - fog * 0.85);
      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const snow = new THREE.Points(snowGeo, snowMat);
snow.frustumCulled = false;
scene.add(snow);

// ── Tap-to-dust-off ───────────────────────────────────────────────────────────
const DUST_PER_TAP = 36;
const DUST_MAX_CONCURRENT = 4;
const DUST_COUNT = DUST_PER_TAP * DUST_MAX_CONCURRENT;
const DUST_DURATION = 0.9;

const dustOrigins = new Float32Array(DUST_COUNT * 3);
const dustVel = new Float32Array(DUST_COUNT * 3);
const dustSize = new Float32Array(DUST_COUNT);
const DUST_INACTIVE_START = -1e6;
const dustStart = new Float32Array(DUST_COUNT).fill(DUST_INACTIVE_START);
for (let i = 0; i < DUST_COUNT; i++) {
  const theta = rng() * Math.PI * 2;
  const speedXZ = range(0.6, 2.2);
  dustVel[i*3+0] = Math.cos(theta) * speedXZ;
  dustVel[i*3+1] = range(0.8, 2.6);
  dustVel[i*3+2] = Math.sin(theta) * speedXZ;
  dustSize[i] = range(2.0, 4.5);
}
const dustGeo = new THREE.BufferGeometry();
const dustPosAttr = new THREE.BufferAttribute(dustOrigins, 3);
const dustStartAttr = new THREE.BufferAttribute(dustStart, 1);
dustPosAttr.setUsage(THREE.DynamicDrawUsage);
dustStartAttr.setUsage(THREE.DynamicDrawUsage);
dustGeo.setAttribute('position', dustPosAttr);
dustGeo.setAttribute('aVel', new THREE.BufferAttribute(dustVel, 3));
dustGeo.setAttribute('aStartTime', dustStartAttr);
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSize, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uDuration: { value: DUST_DURATION },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec3 aVel;
    attribute float aStartTime;
    attribute float aSize;
    uniform float uTime, uDuration, uPixelRatio;
    varying float vAlpha;
    void main(){
      float t = uTime - aStartTime;
      vec3 pos = position;
      float alpha = 0.0;
      if (t >= 0.0 && t < uDuration) {
        vec3 gravity = vec3(0.0, -9.0, 0.0);
        pos = position + aVel * t + 0.5 * gravity * t * t;
        float fadeIn = smoothstep(0.0, uDuration * 0.08, t);
        float fadeOut = 1.0 - smoothstep(uDuration * 0.45, uDuration, t);
        alpha = fadeIn * fadeOut;
      }
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      float dist = -mvPosition.z;
      gl_PointSize = clamp(aSize * uPixelRatio * (50.0 / max(dist, 3.0)), 1.0, 30.0);
      vAlpha = alpha;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.35, d);
      if (shape < 0.01) discard;
      gl_FragColor = vec4(1.0, 1.0, 1.0, shape * vAlpha * 0.9);
    }
  `,
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled = false;
scene.add(dust);

let dustCursor = 0;
function spawnDustBurst(originPoint){
  for (let k = 0; k < DUST_PER_TAP; k++){
    const j = dustCursor;
    dustCursor = (dustCursor + 1) % DUST_COUNT;
    dustPosAttr.setXYZ(j, originPoint.x, originPoint.y, originPoint.z);
    dustStartAttr.setX(j, simTime);
  }
  dustPosAttr.needsUpdate = true;
  dustStartAttr.needsUpdate = true;
}

// ── Multi-tap dusting state machine ──────────────────────────────────────────
// Identical logic/formulas to the deployed scene -- only writeTreeResetTime()
// is new, mirroring each write into the per-card attribute too.
const TAP_COOLDOWN = 0.8;
const TAP_FADE_DURATION = 0.25;
const tapState = new Array(treePlacements.length).fill(null);

function coverageNow(i, now){
  const elapsed = Math.max(0, now - resetTimeAttr[i]);
  const elapsedNorm = Math.min(1, elapsed / SNOW_BUILDUP_SPAN);
  return SNOW_BUILDUP_MAX * elapsedNorm;
}

// Writes a tree's resetTime AND mirrors it into every one of that tree's
// card instances -- resetTimeAttr stays the single source of truth for JS-
// side coverage bookkeeping (coverageNow/applyTap), cardResetTimeAttr is
// purely the GPU-facing copy the shader actually reads.
function writeTreeResetTime(i, value){
  resetTimeAttr[i] = value;
  const base = i * CARDS_PER_TREE;
  for (let j = 0; j < CARDS_PER_TREE; j++) cardResetTimeArr[base + j] = value;
}

const activeFades = new Map();

function updateTapFades(now){
  if (activeFades.size === 0) return;
  for (const [i, fade] of activeFades) {
    const elapsed = now - fade.fadeStartTime;
    let coverage;
    if (elapsed >= TAP_FADE_DURATION) {
      coverage = fade.fadeTargetCoverage;
      activeFades.delete(i);
    } else {
      const p = elapsed / TAP_FADE_DURATION;
      const eased = p * p * (3 - 2 * p);
      coverage = fade.fadeStartCoverage + (fade.fadeTargetCoverage - fade.fadeStartCoverage) * eased;
    }
    writeTreeResetTime(i, now - SNOW_BUILDUP_SPAN * (coverage / SNOW_BUILDUP_MAX));
  }
  cardResetTimeAttr.needsUpdate = true;
}

function applyTap(i, now){
  const state = tapState[i] || (tapState[i] = { tapsRemaining: 0, perTapRemoval: 0, lastTapTime: -Infinity });
  if (now - state.lastTapTime < TAP_COOLDOWN) return false;

  const current = coverageNow(i, now);
  if (state.tapsRemaining <= 0) {
    const frac = current / SNOW_BUILDUP_MAX;
    if (frac <= 0.15) return false;
    const requiredTaps = frac > 2/3 ? 3 : frac > 1/3 ? 2 : 1;
    state.tapsRemaining = requiredTaps;
    state.perTapRemoval = current / requiredTaps;
  }

  state.lastTapTime = now;
  state.tapsRemaining -= 1;
  const target = Math.max(0, current - state.perTapRemoval);
  activeFades.set(i, { fadeStartTime: now, fadeStartCoverage: current, fadeTargetCoverage: target });
  return true;
}

// ── Dusting shake ────────────────────────────────────────────────────────────
// A brief decaying wobble of the whole card cluster around the tree's own
// vertical axis when a tap registers -- cheap: only rewrites instance
// matrices for the (small, rare) set of trees actively shaking right now,
// same "touch only what's animating" discipline as updateTapFades. No new
// shader code; this is plain CPU-side matrix composition, same as the
// original per-tree placement pass.
const SHAKE_DURATION = 0.6; // seconds until the wobble has fully settled
const activeShakes = new Map(); // tree index -> { startTime }
const _shakeRot = new THREE.Matrix4();
const _shakeCombined = new THREE.Matrix4();

function triggerShake(i, now){
  activeShakes.set(i, { startTime: now });
}

function updateShakes(now){
  if (activeShakes.size === 0) return;
  for (const [i, shake] of activeShakes) {
    const elapsed = now - shake.startTime;
    let angleJitter = 0;
    if (elapsed >= SHAKE_DURATION) {
      activeShakes.delete(i); // settles back to the resting (unrotated) pose below
    } else {
      const envelope = Math.exp(-elapsed * 6.0);
      angleJitter = Math.sin(elapsed * 18.0) * 0.14 * envelope
                  + Math.sin(elapsed * 31.0 + 1.3) * 0.05 * envelope;
    }
    _shakeRot.makeRotationY(angleJitter);
    _shakeCombined.multiplyMatrices(cardTreeMatrices[i], _shakeRot);
    const base = i * CARDS_PER_TREE;
    for (let j = 0; j < CARDS_PER_TREE; j++) {
      _finalMat.multiplyMatrices(_shakeCombined, CARD_SLOT_MATRICES[j]);
      cardMesh.setMatrixAt(base + j, _finalMat);
    }
  }
  cardMesh.instanceMatrix.needsUpdate = true;
}

const tapRaycaster = new THREE.Raycaster();
const tapNDC = new THREE.Vector2();
function handleTap(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  tapNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  tapNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  tapRaycaster.setFromCamera(tapNDC, camera);
  const hits = tapRaycaster.intersectObject(cardMesh, false);
  if (!hits.length) return null;
  const hit = hits[0];
  const cardIdx = hit.instanceId;
  if (cardIdx == null) return null;
  const i = Math.floor(cardIdx / CARDS_PER_TREE);
  if (i >= treePlacements.length) return null;
  const registered = applyTap(i, simTime);
  if (registered) {
    spawnDustBurst(hit.point);
    triggerShake(i, simTime);
  }
  return registered ? i : null;
}
canvas.addEventListener('pointerdown', (e) => { handleTap(e.clientX, e.clientY); });

// ── FPS readout ───────────────────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsAccum = 0;

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
const ffParam = parseFloat(new URLSearchParams(location.search).get('ff'));
let simTime = Number.isFinite(ffParam) ? ffParam : 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  snowMat.uniforms.uTime.value = simTime;
  dustMat.uniforms.uTime.value = simTime;
  if (cardMat.userData.shader) cardMat.userData.shader.uniforms.uTime.value = simTime;
  updateTapFades(simTime);
  updateShakes(simTime);

  renderer.render(scene, camera);

  fpsFrames++; fpsAccum += dt;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = `${(fpsFrames/fpsAccum).toFixed(1)} fps`;
    fpsFrames = 0; fpsAccum = 0;
  }
});

// ── Console handle for future work ───────────────────────────────────────────
window.__snow = { THREE, scene, camera, renderer, ground, trunkMesh, cardMesh, treePlacements, CARDS_PER_TREE, CARD_TOTAL, snow, snowMat, SNOW_COUNT, cardMat, resetTimeAttr, cardResetTimeAttr, SNOW_BUILDUP_MAX, SNOW_BUILDUP_SPAN, dust, dustMat, handleTap, spawnDustBurst, applyTap, coverageNow, tapState, TAP_COOLDOWN, TAP_FADE_DURATION, activeFades, updateTapFades, activeShakes, triggerShake, updateShakes, SHAKE_DURATION, get simTime(){ return simTime; } };
</script>
