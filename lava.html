<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0402">
<title>Lava River</title>
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#0a0402;
    font-family:system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #canvas{
    display:block; width:100%; height:100%;
    touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse 100% 90% at 50% 45%,
      transparent 45%, rgba(0,0,0,0.35) 78%, rgba(0,0,0,0.72) 100%);
  }
  #fps{
    position:fixed; top:8px; left:8px; z-index:9999;
    font:12px/1.4 monospace; color:#ff8a4a;
    background:rgba(10,4,2,0.55); padding:4px 8px; border-radius:4px;
    pointer-events:none; white-space:pre;
  }
  #reset-btn{
    position:fixed; bottom:24px; right:24px; width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(255,110,60,0.35);
    background:rgba(20,6,4,0.72);
    color:rgba(255,140,90,0.9);
    font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .25s ease, transform .14s ease;
    opacity:.6; z-index:100; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  #reset-btn:hover  { opacity:1; }
  #reset-btn:active { transform:scale(.9); opacity:1; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>
<div id="fps">-- fps</div>
<button id="reset-btn" title="Reset">↺</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Seeded RNG ───────────────────────────────────────────────────────────────
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng   = mulberry32(0x1a7a51);
const range = (a,b) => a + rng() * (b - a);
function smoothstepJS(a,b,x){ const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); }

// ── Renderer / scene / camera (orthographic, straight top-down) ─────────────
// Use visualViewport when available — on iOS Safari, window.innerWidth/Height
// can mismatch the actual visible area when the address/toolbar collapses or
// expands, which throws off both the canvas size and touch coordinate mapping.
function getViewportSize(){
  if (window.visualViewport) {
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}

let { w: W, h: H } = getViewportSize();
const canvas = document.getElementById('canvas');
const isMobile = window.matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080302);

const ORTHO_H = 9;
const camera = new THREE.OrthographicCamera(
  -(W / H) * ORTHO_H, (W / H) * ORTHO_H,
  ORTHO_H, -ORTHO_H,
  0.1, 100
);
camera.up.set(0, 0, -1);
camera.position.set(0, 20, 0);
camera.lookAt(0, 0, 0);

let resizeTimer;
function handleViewportResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const size = getViewportSize();
    W = size.w; H = size.h;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    camera.left   = -(W / H) * ORTHO_H;
    camera.right  =  (W / H) * ORTHO_H;
    camera.top    =  ORTHO_H;
    camera.bottom = -ORTHO_H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }, 250);
}
window.addEventListener('resize', handleViewportResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewportResize);
}

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x2a1408, 0x040201, 0.5));
const sun = new THREE.DirectionalLight(0xffa070, 0.95);
sun.position.set(-6, 14, 4);
sun.color.set(0xffe0c0);
sun.intensity = 0.5;
scene.add(sun);
const fillLight = new THREE.DirectionalLight(0x3a1a10, 0.20);
fillLight.position.set(5, 8, -6);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0x1a0a05, 0.45);
rimLight.position.set(8, 6, 8);
scene.add(rimLight);

// ── River path shape (centerline + width, in world units) ───────────────────
const HW = camera.right;                      // half visible width at startup
const BOUNDS_X = HW * 7.2 + 18;                // boulder field half-width — comfortably past the visible edges on both sides
const baseHalfWidth = HW * 0.50;
const widthVar      = HW * 0.035;
const ampA = HW * 0.22, ampB = HW * 0.09;
function centerX(z){ return Math.sin(z*0.34+1.3)*ampA + Math.sin(z*0.15+0.6)*ampB; }
function halfWidth(z){ return baseHalfWidth + Math.sin(z*0.19+2.1)*widthVar; }

const RIVER_LENGTH = ORTHO_H * 3.6;
const Z0 = -RIVER_LENGTH / 2;
const EDGE_BLEED = 0.75; // extra lava width hidden under the innermost boulder ring

// ── Lava river mesh + shader ──────────────────────────────────────────────────
function buildRiverGeometry(edgeBleed){
  const LEN_SEG = 90, WID_SEG = 14;
  const positions = [], uvs = [], indices = [];
  for (let i = 0; i <= LEN_SEG; i++) {
    const t = i / LEN_SEG;
    const z = Z0 + t * RIVER_LENGTH;
    const cx = centerX(z);
    const hw = halfWidth(z) + edgeBleed;
    for (let j = 0; j <= WID_SEG; j++) {
      const s = j / WID_SEG;
      positions.push(cx + (s - 0.5) * 2 * hw, 0, z);
      uvs.push(s, t);
    }
  }
  const rowLen = WID_SEG + 1;
  for (let i = 0; i < LEN_SEG; i++) {
    for (let j = 0; j < WID_SEG; j++) {
      const a = i*rowLen+j, b = a+1, c = a+rowLen, d = c+1;
      indices.push(a,c,b, b,c,d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

const MAX_TOUCH = 4;
const lavaMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    precision mediump float;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    uniform float uTime;

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      float a = hash(i), b = hash(i+vec2(1.0,0.0));
      float c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
      vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm2(vec2 p){
      float v = 0.0, a = 0.5;
      for(int i=0;i<2;i++){ v += a*noise(p); p *= 2.02; a *= 0.5; }
      return v;
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.5;
      for(int i=0;i<4;i++){ v += a*noise(p); p *= 2.02; a *= 0.5; }
      return v;
    }

    void main(){
      // domain-warped turbulence — reads as a viscous flowing surface
      // rather than a smooth glowing mist. Unchanged from before (same
      // uTime coefficients throughout this block) so the flow's speed and
      // wander pattern are identical — only the coloring/shading below was
      // reworked, to match real-lava reference photos.
      vec2 flowUv = vUv*vec2(3.2,9.0) + vec2(uTime*0.02, -uTime*0.28);
      vec2 warp = vec2(fbm2(flowUv*1.4 + 5.2), fbm2(flowUv*1.4 - 3.7)) - 0.5;
      vec2 p1 = flowUv + warp*1.1;
      float n1 = fbm(p1);
      vec2 p2 = vUv*vec2(6.5,17.0) - vec2(uTime*0.018, uTime*0.24) + warp*0.7;
      float n2 = fbm(p2);

      // thin dark solidified-crust veins threaded through the flow
      float crustN = fbm(vUv*vec2(9.5,23.0) + warp*1.6 + vec2(uTime*0.010, -uTime*0.045));
      float crust = smoothstep(0.40,0.5,crustN) - smoothstep(0.5,0.60,crustN);

      float veins = smoothstep(0.56, 0.80, n1*0.6 + n2*0.4);

      // Fine cellular surface bump — a small 2-octave noise field sampled
      // at a slight offset in two directions to approximate a local
      // gradient, used as a cheap fake-normal light term (same trick as the
      // boulders' fixed crack-light direction) instead of an actual normal
      // map. fbm2 (rather than a single noise() sample) avoids the
      // underlying value-noise grid reading as a regular brick pattern at
      // this scale; this is what gives the surface a rough, mottled,
      // organic-rock read instead of a smooth gradient.
      vec2 bumpUv = vUv*vec2(46.0,52.0) + vec2(uTime*0.02, -uTime*0.28) + warp*0.3;
      float bumpC = fbm2(bumpUv);
      float bumpX = fbm2(bumpUv + vec2(0.35,0.0));
      float bumpY = fbm2(bumpUv + vec2(0.0,0.35));
      vec2 bumpGrad = vec2(bumpX - bumpC, bumpY - bumpC);
      float bumpLight = dot(normalize(bumpGrad + 1e-4), normalize(vec2(-0.5,-0.85)));

      // Heat field — how brightly/actively this point is flowing, before
      // crust darkening. Combining both turbulence layers makes the bright
      // channels wander, pinch and widen the way the reference photos show,
      // rather than a flat glow across the whole river.
      float heat = clamp(n1*0.65 + n2*0.35, 0.0, 1.0);

      // Bright orange-yellow glowing channels (rather than a uniform dark
      // crimson) grading up into a near-white hottest core at the strongest
      // vein peaks, contrasted against a much darker, barely-red crust —
      // matching the vivid-glow-against-dark-rock look of real lava photos.
      vec3 crustColor  = vec3(0.05, 0.008, 0.004);
      vec3 coolFlow    = vec3(0.30, 0.045, 0.012);
      vec3 midHot      = vec3(0.80, 0.20, 0.025);
      vec3 brightHot   = vec3(1.00, 0.46, 0.06);
      vec3 hottestCore = vec3(1.00, 0.80, 0.28);

      vec3 col = mix(coolFlow, midHot, smoothstep(0.15, 0.55, heat));
      col = mix(col, brightHot, smoothstep(0.45, 0.80, heat));
      col = mix(col, hottestCore, smoothstep(0.78, 0.98, heat) * smoothstep(0.5, 0.85, veins));

      // Fine bump shading on top of the broad heat coloring — brightens
      // crests and darkens troughs of the small-scale cellular texture.
      col *= 1.0 + bumpLight*0.16;

      // Solidified crust patches, darkened much further than before so they
      // read as distinct cooled-rock islands breaking up the molten channel
      // instead of a subtle tint — the scattered-dark-patches look the
      // reference photos show even within the active flow.
      col = mix(col, crustColor, clamp(crust,0.0,1.0)*0.88);

      float c = abs(vUv.x-0.5)*2.0;

      // sharpen the riverbank — crust down hard right at the true (un-bled) edge
      float hw = ${baseHalfWidth.toFixed(6)} + sin(vWorldPos.z*0.19+2.1)*${widthVar.toFixed(6)};
      float meshHw = hw + ${EDGE_BLEED.toFixed(6)};
      float edgeFrac = hw/meshHw;
      float bank = smoothstep(edgeFrac*0.62, edgeFrac*1.05, c);
      col = mix(col, crustColor*0.7, bank*0.95);

      // absolute brightness floor — the darkest parts of the flow must never
      // read as pure black, regardless of bank/crust darkening. Lowered
      // from before (which forced a fairly bright minimum) so genuinely
      // dark crust patches can read as dark — the higher-contrast look
      // being asked for — while still avoiding true (0,0,0).
      col = max(col, vec3(0.015, 0.003, 0.0015));

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const lavaGeo = buildRiverGeometry(EDGE_BLEED);
const lavaMesh = new THREE.Mesh(lavaGeo, lavaMaterial);
scene.add(lavaMesh);

// A second, un-bled geometry defines the "true" river edge used to keep
// boulders and bubbles clear of the flow — the bleed is purely a visual
// strip that peeks through the gaps of the innermost boulder ring.
function riverHalfWidthNominal(z){ return halfWidth(z); }

// ── Ground plane (cooled rock bed beneath the boulder field) ─────────────────
const groundGeo = new THREE.PlaneGeometry(BOUNDS_X*2 + 4, RIVER_LENGTH + ORTHO_H*2.4);
groundGeo.rotateX(-Math.PI/2);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a1a0a, roughness: 1.0, metalness: 0.0, emissive: new THREE.Color(0x1a0000), emissiveIntensity: 0.8 });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.position.y = -0.03;
scene.add(groundMesh);

// ── Boulders (dense instanced field along the river banks) ──────────────────
// Multi-tier scatter: large boulders first, then medium — each later pass
// fills the gaps the previous pass left, so the banks read as dense packed
// rock rather than pebbles scattered on black ground. Positions must exist
// before texture generation below, since visible-boulder textures are keyed
// off each boulder's final (x,z).
const boulderDefs = [];
const BOULDER_Z_MARGIN = ORTHO_H * 1.2; // extra reach past the river's ends so far top/bottom edges never show bare ground

function inRiver(x, z, buffer){
  return Math.abs(x - centerX(z)) < riverHalfWidthNominal(z) + buffer;
}
// Uniform spatial hash for collision checks — with tens of thousands of
// candidates in the dense filler pass, a linear scan against every existing
// boulder would be far too slow, so neighbors are looked up by grid cell
// instead. Cell size comfortably exceeds the largest possible collision
// radius so only the 3x3 neighborhood ever needs checking.
const COLLISION_CELL = 2.6;
const collisionGrid = new Map();
function cellKey(gx, gz){ return gx + ',' + gz; }
function addToGrid(idx){
  const b = boulderDefs[idx];
  const key = cellKey(Math.floor(b.x/COLLISION_CELL), Math.floor(b.z/COLLISION_CELL));
  let bucket = collisionGrid.get(key);
  if (!bucket) { bucket = []; collisionGrid.set(key, bucket); }
  bucket.push(idx);
}
function tooClose(x, z, radius, factor){
  const gx = Math.floor(x/COLLISION_CELL), gz = Math.floor(z/COLLISION_CELL);
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      const bucket = collisionGrid.get(cellKey(gx+dx, gz+dz));
      if (!bucket) continue;
      for (const idx of bucket) {
        const b = boulderDefs[idx];
        const ddx = x - b.x, ddz = z - b.z;
        const minDist = (radius + b.radius) * factor;
        if (ddx*ddx + ddz*ddz < minDist*minDist) return true;
      }
    }
  }
  return false;
}
function scatterTier(cell, riverBuffer, radiusMin, radiusMax, packFactor, xMin, xMax, zMin, zMax){
  if (xMin === undefined) xMin = -BOUNDS_X;
  if (xMax === undefined) xMax = BOUNDS_X;
  if (zMin === undefined) zMin = Z0 - BOULDER_Z_MARGIN;
  if (zMax === undefined) zMax = Z0 + RIVER_LENGTH + BOULDER_Z_MARGIN;
  for (let z = zMin; z <= zMax; z += cell) {
    for (let x = xMin; x <= xMax; x += cell) {
      const jx = x + range(-cell*0.42, cell*0.42);
      const jz = z + range(-cell*0.42, cell*0.42);
      const radius = range(radiusMin, radiusMax);
      // Scale the river exclusion by this boulder's own radius so large
      // rocks can't visually intrude deep into the flow near the bank.
      if (inRiver(jx, jz, riverBuffer + radius*0.40)) continue;
      if (Math.abs(jx) > BOUNDS_X) continue;
      if (tooClose(jx, jz, radius, packFactor)) continue;
      boulderDefs.push({ x: jx, z: jz, radius });
      addToGrid(boulderDefs.length - 1);
    }
  }
}

scatterTier(1.30, 0.16, 0.75, 1.45, 0.62); // large
scatterTier(0.62, 0.12, 0.45, 0.75, 0.68); // medium

// ── Boulder shape — jittered sphere reads as an irregular lumpy rock.
// Segments raised again (18x14 -> 22x16, a real, verified triangle-count
// increase — see window.__lava.boulderMesh.geometry for confirmation).
// Two things drive the faceted look, and both are addressed here: (1) large
// triangles from too few segments — smooth shading alone can't fix that,
// since normal interpolation only smooths lighting across a triangle, not
// the triangle's own size; (2) the PER-VERTEX jitter below was applied
// independently at each vertex with no correlation to its neighbors, which
// put sharp, spiky steps in the surface itself, at any segment count. The
// jitter magnitude is cut hard (0.65 -> 0.28) so the underlying shape is
// smoother, letting a more moderate (cheaper) segment increase still read
// as rounded rock instead of needing an even heavier, costlier tessellation
// to visually fight through jagged vertex noise.
const boulderGeo = new THREE.SphereGeometry(1, 22, 16);
{
  const jrng = mulberry32(0x9e3b7a);
  const pos = boulderGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const jitter = 1 + (jrng() - 0.5) * 0.28;
    pos.setXYZ(i, pos.getX(i)*jitter, pos.getY(i)*jitter, pos.getZ(i)*jitter);
  }
  pos.needsUpdate = true;
  boulderGeo.computeVertexNormals();
}

// ── Boulder surface + crack texture atlas ────────────────────────────────────
// Each boulder inside the visible viewport gets a unique baked texture
// (porous rock surface + carved crack grooves); every boulder outside it
// shares one generic texture, since it's never seen closely enough to need
// individual detail. All of these are packed into a single shared atlas so
// every boulder — visible or not — stays in the one InstancedMesh; tap/crack
// raycasting keeps working off plain instanceId, exactly as before.
const CRACK_SEED_SALT = 7919;

// Same seeded random-walk branch generator feeds both the baked groove
// texture and the separate glow texture, so their crack patterns line up
// pixel-for-pixel.
function generateCrackPaths(seed, cx, cy, radius){
  const rng = mulberry32(seed >>> 0);
  const r = (a, b) => a + rng() * (b - a);

  // Jitter the crack hub off dead-center so every boulder's fracture
  // network doesn't radiate from the exact same spot.
  const originX = cx + r(-0.22, 0.22) * radius;
  const originY = cy + r(-0.22, 0.22) * radius;

  // Uneven angular wedges instead of evenly-spaced spokes — branches
  // cluster together in places and leave big gaps elsewhere. Kept modest
  // (was 3-7) since combined with sub-branches below, the higher end read
  // as a tangled cluster rather than a legible fracture pattern.
  const branchCount = 2 + Math.floor(r(0, 3));
  const wedges = [];
  let wedgeTotal = 0;
  for (let i = 0; i < branchCount; i++) {
    const w = r(0.4, 1.6);
    wedges.push(w);
    wedgeTotal += w;
  }
  let angleCursor = r(0, Math.PI * 2);
  const branchAngles = [];
  for (let i = 0; i < branchCount; i++) {
    angleCursor += (wedges[i] / wedgeTotal) * Math.PI * 2;
    branchAngles.push(angleCursor + r(-0.35, 0.35));
  }

  const paths = [];
  let maxReach = 0.0001;

  // Quality gates applied to every branch/offshoot before it's committed to
  // `paths`: reject (and reroll a fresh random walk for) anything too short
  // to read as a real fracture line, or that crosses another branch already
  // on this boulder in a way that looks tangled rather than a clean fracture
  // network. Both are measured relative to this boulder's own radius/paths
  // so they scale correctly across every boulder size and seed.
  const MIN_BRANCH_LEN = radius * 0.18;
  const MAX_GROW_ATTEMPTS = 6;

  // Builds one candidate random walk without committing it anywhere, so it
  // can be measured and checked first. Same walk logic as before: few, long,
  // straight segments with a wide alternating-side angle change at each
  // joint — reads as an angular lightning-bolt/fracture trajectory rather
  // than a smooth many-point curve.
  function buildBranchCandidate(startX, startY, startAng, len){
    const segs = 2 + Math.floor(r(0, 3));
    const pts = [{ x: startX, y: startY, d: 0 }];
    let x = startX, y = startY, a = startAng, cumLen = 0;
    let turnSign = rng() > 0.5 ? 1 : -1;
    for (let s = 0; s < segs; s++) {
      const sharp = rng() < 0.3 ? 1.5 : 1.0;      // occasional extra-sharp kink
      a += turnSign * r(0.5, 1.35) * sharp;       // wide, deliberate angle change per joint
      turnSign *= -1;                             // alternate sides at each joint
      const step = (len / segs) * r(0.6, 1.5);    // uneven segment lengths
      x += Math.cos(a) * step;
      y += Math.sin(a) * step;
      cumLen += step;
      pts.push({ x, y, d: cumLen });
    }
    return { pts, cumLen, endAngle: a };
  }

  // True if segment AB crosses segment CD somewhere in their interiors.
  // Touches right at (or very near) a shared endpoint don't count — that's
  // exactly how a branch is meant to meet the hub, or an offshoot its
  // parent, and isn't the tangled-overlap case being screened for here.
  function segmentsCross(ax,ay,bx,by,cx,cy,dx,dy){
    const d1x = bx-ax, d1y = by-ay;
    const d2x = dx-cx, d2y = dy-cy;
    const denom = d1x*d2y - d1y*d2x;
    if (Math.abs(denom) < 1e-9) return false; // parallel/collinear — never the messy case
    const t = ((cx-ax)*d2y - (cy-ay)*d2x) / denom;
    const u = ((cx-ax)*d1y - (cy-ay)*d1x) / denom;
    const m = 0.04;
    return t > m && t < 1-m && u > m && u < 1-m;
  }

  // Checks a candidate's segments against every branch/offshoot already
  // accepted on this boulder, plus its own earlier segments (a sharp
  // alternating zigzag can in rare cases fold back over itself).
  function candidateTangles(pts){
    for (let i = 1; i < pts.length; i++) {
      const a0 = pts[i-1], a1 = pts[i];
      for (const other of paths) {
        for (let j = 1; j < other.length; j++) {
          const b0 = other[j-1], b1 = other[j];
          if (segmentsCross(a0.x,a0.y,a1.x,a1.y,b0.x,b0.y,b1.x,b1.y)) return true;
        }
      }
      for (let j = 1; j < i - 1; j++) {
        const b0 = pts[j-1], b1 = pts[j];
        if (segmentsCross(a0.x,a0.y,a1.x,a1.y,b0.x,b0.y,b1.x,b1.y)) return true;
      }
    }
    return false;
  }

  // Guards against a subtler kind of clutter than a mid-length crossing:
  // several branches leaving the *same* point (the hub, or wherever an
  // offshoot happens to start) at nearly the same angle. Neither branch
  // technically crosses the other, but they run near-parallel out of that
  // shared point and, once the crack widens during tap-fill (plus glow
  // bloom), visually merge into a single clump right at the origin instead
  // of reading as distinct fractures. Checked against each accepted
  // branch's *actual* first-segment direction (not its nominal start
  // angle) since the very first joint below already bends it by a wide,
  // random amount before anything is drawn.
  const MIN_HUB_ANGLE_SEP = 25 * Math.PI / 180;
  const HUB_EPS = radius * 0.02;
  const hubDirs = [];
  function angularGap(a, b){
    const d = Math.abs(a - b) % (Math.PI * 2);
    return d > Math.PI ? Math.PI * 2 - d : d;
  }
  function clumpsAtSharedOrigin(startX, startY, dirAngle){
    for (const h of hubDirs) {
      const dx = h.x - startX, dy = h.y - startY;
      if (dx*dx + dy*dy > HUB_EPS*HUB_EPS) continue;
      if (angularGap(dirAngle, h.angle) < MIN_HUB_ANGLE_SEP) return true;
    }
    return false;
  }

  function growBranch(startX, startY, startAng, len, startD, depth){
    let accepted = null, acceptedDir = 0;
    for (let attempt = 0; attempt < MAX_GROW_ATTEMPTS; attempt++) {
      const cand = buildBranchCandidate(startX, startY, startAng, len);
      if (cand.cumLen < MIN_BRANCH_LEN) continue;
      if (candidateTangles(cand.pts)) continue;
      const dirAngle = Math.atan2(cand.pts[1].y - cand.pts[0].y, cand.pts[1].x - cand.pts[0].x);
      if (clumpsAtSharedOrigin(startX, startY, dirAngle)) continue;
      accepted = cand;
      acceptedDir = dirAngle;
      break;
    }
    // Couldn't find a clean, legible walk within the attempt budget — skip
    // this branch/offshoot rather than force a too-short, tangled, or
    // hub-clumped one in.
    if (!accepted) return;
    hubDirs.push({ x: startX, y: startY, angle: acceptedDir });

    const pts = accepted.pts.map(p => ({ x: p.x, y: p.y, d: p.d + startD }));
    maxReach = Math.max(maxReach, startD + accepted.cumLen);
    paths.push(pts);

    // At most one level of offshoots, and only sometimes, and always just a
    // single one — was up to two recursive levels with 1-2 offshoots each,
    // which compounded into a dense, hard-to-follow tangle. A single
    // occasional offshoot per branch still reads as a fracture network, just
    // a legible one.
    if (depth < 1 && rng() > 0.7) {
      const along = pts[1 + Math.floor(r(0, pts.length - 1))];
      const subAng = accepted.endAngle + r(0.5, 1.3) * (rng() > 0.5 ? 1 : -1);
      const subLen = len * r(0.25, 0.55);
      growBranch(along.x, along.y, subAng, subLen, along.d, depth + 1);
    }
  }

  for (let i = 0; i < branchCount; i++) {
    const len = radius * r(0.55, 1.35);
    growBranch(originX, originY, branchAngles[i], len, 0, 0);
  }

  for (const pts of paths) for (const p of pts) p.d /= maxReach;

  // Re-anchor "distance" to a point ALONG the crack itself — the median
  // point across the whole fracture network — instead of the hub all
  // branches grow from. Left as-is, d=0 always sits at the hub (near the
  // boulder's center), so the tap-fill reveal (driven by this value in
  // makeCrackGlowTexture) would always well up there first and radiate
  // outward across every branch at once, reading as spreading out from the
  // rock's center rather than creeping along the crack. Remapping every
  // point's d to its distance from this anchor instead makes the reveal
  // start inside the crack and creep outward in both directions. The median
  // (rather than, say, one branch's own midpoint) keeps the split balanced
  // regardless of how lopsided the branch lengths are — a single branch's
  // midpoint can sit far out toward one tip, leaving most of the rest of
  // the network on one side and barely revealing at low fill levels. Only
  // this bookkeeping value changes here; the x/y path geometry (and
  // therefore the crack's visible shape) is untouched.
  let anchorD = 0.5;
  if (paths.length) {
    const allD = [];
    for (const pts of paths) for (const p of pts) allD.push(p.d);
    allD.sort((a, b) => a - b);
    anchorD = allD[Math.floor(allD.length / 2)];
  }
  let maxSpread = 0.0001;
  for (const pts of paths) for (const p of pts) {
    p.d = Math.abs(p.d - anchorD);
    maxSpread = Math.max(maxSpread, p.d);
  }
  for (const pts of paths) for (const p of pts) p.d /= maxSpread;

  return paths;
}

// fixed per-crack shading direction — keeps the shadow/highlight side of
// every crack segment/branch on a boulder consistent, as if lit from one
// place, instead of flipping with each segment's own travel direction.
const CRACK_LIGHT_DIR = { x: -0.6, y: -0.8 };

function makeBoulderTexture(seed, isVisible, crackPaths){
  const size = 256;
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const trng = mulberry32(seed >>> 0);

  ctx.fillStyle = '#08080a';
  ctx.fillRect(0, 0, size, size);

  // cheap multi-frequency pseudo-noise (no dependencies) for organic,
  // non-repeating bumpiness within a plate — several sine/cosine terms at
  // different frequencies/phases combine into something far less regular
  // than a single wave, roughly spanning -1..1.
  function bumpNoise(x, y) {
    const n1 = Math.sin(x*0.15 + seed*0.00071) * Math.cos(y*0.13 - seed*0.00043);
    const n2 = Math.sin(x*0.37 + y*0.29 + seed*0.00097) * 0.5;
    const n3 = Math.sin((x + y*1.7) * 0.06 + seed*0.00061) * 0.35;
    return (n1 + n2 + n3) / 1.85;
  }

  // Large irregular cracked plate/slab shapes (a coarse Voronoi cellular
  // pattern) instead of a dot/pit scatter — each plate is a flat region
  // around its own seed point, its own near-black shade, with a darker seam
  // painted along the boundary where two plates meet, plus per-pixel
  // bumpiness within it. Every tone here stays dark (well under a fifth of
  // full brightness) — no white/gray anywhere — but the spread between
  // plate and seam is kept wide within that dark range: this scene's
  // ambient lighting is already pulled down (see boulderMaterial's onBefore-
  // Compile), so a narrower raw contrast here was getting crushed to a flat
  // black on the actual boulder even though the baked texture itself was
  // fine — confirmed by rendering the raw canvas directly, outside the 3D
  // pipeline, during testing.
  const plateCount = 7 + Math.floor(trng()*7); // 7-13 large plates
  const plates = [];
  for (let i = 0; i < plateCount; i++) {
    plates.push({ x: trng()*size, y: trng()*size, shade: 18 + trng()*34 });
  }

  const grid = 160; // sampled on a coarser grid than the 256px canvas, drawn as small blocks — cheap, one-time bake cost
  const cell = size / grid;
  const seamReach = cell * 3.4; // how wide the darkened seam band is, in gap-to-next-plate terms
  for (let gy = 0; gy < grid; gy++) {
    for (let gx = 0; gx < grid; gx++) {
      const px = (gx + 0.5) * cell, py = (gy + 0.5) * cell;
      let best = Infinity, second = Infinity, bestIdx = 0;
      for (let p = 0; p < plates.length; p++) {
        const dx = px - plates[p].x, dy = py - plates[p].y;
        const d = dx*dx + dy*dy;
        if (d < best) { second = best; best = d; bestIdx = p; }
        else if (d < second) { second = d; }
      }
      // Jitter the seam boundary itself (a separate, decorrelated phase of
      // the same bump noise) rather than leaving it a perfect Voronoi curve
      // — natural rock fractures don't run in smooth arcs, so this is what
      // keeps the plate edges reading as irregular slab breaks instead of a
      // cellular diagram.
      const gap = Math.sqrt(second) - Math.sqrt(best) + bumpNoise(px*0.6 + 91.0, py*0.6 - 47.0) * 4.5;

      // Three noise octaves instead of two: the original coarse bumpNoise
      // for broad shape variation across a plate, a finer pass for the
      // small-scale pitted/porous roughness, and now a third, even finer
      // pass on top for a chunkier, more rugged read up close — amplitudes
      // raised across the board from the last pass, which still read as
      // gently shaded rather than genuinely rough rock.
      const coarseBump = bumpNoise(px, py) * 10;
      const fineBump = bumpNoise(px*4.1 + 13.0, py*4.1 - 29.0) * 9;
      const microBump = bumpNoise(px*9.3 + 77.0, py*9.3 - 51.0) * 6;
      let shade = plates[bestIdx].shade + coarseBump + fineBump + microBump;
      if (gap < seamReach) {
        // interpolate toward a near-black floor at the exact boundary,
        // rather than subtracting a capped amount — a subtraction still
        // left brighter plates with a lighter seam than darker plates,
        // which diluted the contrast this pipeline's dim ambient light
        // needs to keep the seam reliably readable against any plate.
        const t = 1 - gap / seamReach;
        shade = shade * (1 - t) + 2 * t;
      }
      shade = Math.max(1, Math.min(55, Math.round(shade)));

      // A faint warm-black undertone (red channel a touch above green/blue)
      // rather than a neutral gray-black — reads as dark volcanic rock
      // rather than dark stone of no particular temperature, while staying
      // low enough to never look like a color shift.
      ctx.fillStyle = `rgb(${shade+2},${shade},${Math.max(0,shade-2)})`;
      ctx.fillRect(gx*cell, gy*cell, cell + 1, cell + 1); // +1 so our own blocks don't leave seams against each other
    }
  }

  // Scattered small dark pits — irregular soft-edged blobs, distinct from
  // the fine per-pixel grain below — give the surface a porous, cratered
  // read at a medium scale the plate shading alone doesn't cover. Count and
  // radius both raised for a chunkier, more rugged surface.
  const pitCount = 60 + Math.floor(trng()*36);
  for (let i = 0; i < pitCount; i++) {
    const x = trng()*size, y = trng()*size;
    const r = 3 + trng()*7.5;
    const pit = ctx.createRadialGradient(x, y, 0, x, y, r);
    const v = Math.floor(trng()*4);
    pit.addColorStop(0, `rgba(${v},${v},${v},0.6)`);
    pit.addColorStop(1, `rgba(${v},${v},${v},0)`);
    ctx.fillStyle = pit;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }

  // fine per-pixel grain on top for close-up micro-texture — always dark,
  // low-alpha so it reads as rough grain rather than added speckle dots.
  const grainCount = 2600;
  for (let i = 0; i < grainCount; i++) {
    const x = trng()*size, y = trng()*size;
    const v = 2 + Math.floor(trng()*8);
    ctx.fillStyle = `rgba(${v},${v},${v+1},${(0.15 + trng()*0.3).toFixed(2)})`;
    ctx.fillRect(x, y, 1, 1);
  }

  if (isVisible) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const pts of crackPaths) {
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i-1], p1 = pts[i];
        const dx = p1.x - p0.x, dy = p1.y - p0.y;
        const segLen = Math.sqrt(dx*dx + dy*dy) || 1;
        let nx = -dy/segLen, ny = dx/segLen;
        // orient the normal toward the fixed light direction so the shadow/
        // highlight sides stay consistent across every branch and segment
        // on this boulder, instead of flipping with each segment's own
        // travel direction.
        if (nx*CRACK_LIGHT_DIR.x + ny*CRACK_LIGHT_DIR.y < 0) { nx = -nx; ny = -ny; }
        // At rest (before any tap-fill), the crack should read as a dark
        // void/seam cut into the rock — depth implied by shadow gradation
        // between its two walls, never by a bright or light-colored line.
        // All colors here stay in the rock's own dark tonal range; the
        // tap-fill glow (a separate overlay texture, drawn additively on
        // top only once triggered) is what actually supplies color/light.
        // Widened again (was 8, before that 5.5/4.5) — direct A/B testing
        // (forcing a boulder's aRiverGlow attribute to 0 vs its real value)
        // confirmed the river-adjacency glow and rim light in
        // boulderMaterial's onBeforeCompile substantially wash out a lit
        // facet's contrast, and even the previous, already-widened pass was
        // still hard to make out on a brightly-lit boulder. Pushed further
        // again, deliberately overshooting so there's headroom to dial back
        // from a clearly-visible baseline instead of nudging up from one
        // that's still marginal.
        const off = 10;

        // Wide, now fully opaque dark halo underneath, then a near-black
        // groove core on top of it — the base carved void. Halo alpha taken
        // to 1.0 (was 0.92) — genuinely opaque black underneath, not just
        // close to it, so there's no rock color left for the scene's
        // additive lighting to wash out in the first place.
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 38;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 15;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        // shadow side — drawn ON TOP of the halo/core (not under it) so it
        // actually reads as a dark rim cut into the rock instead of being
        // buried under the wider fill beneath it. Fully opaque black.
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(p0.x - nx*off, p0.y - ny*off);
        ctx.lineTo(p1.x - nx*off, p1.y - ny*off);
        ctx.stroke();

        // far wall — a dark, rock-toned rim on the side facing
        // CRACK_LIGHT_DIR, also on top. Pushed further again (was
        // rgba(85,75,68,0.9)) — deliberately erring toward too strong per
        // instruction, to land clearly visible on even a brightly-lit,
        // river-adjacent boulder rather than staying marginal. Still a
        // dark, desaturated warm gray — nowhere near white or a saturated
        // color, just a bolder version of the same rock-toned highlight.
        ctx.strokeStyle = 'rgba(112,99,89,0.95)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(p0.x + nx*off, p0.y + ny*off);
        ctx.lineTo(p1.x + nx*off, p1.y + ny*off);
        ctx.stroke();
      }
    }
  }

  // dark edge vignette — the outer 20% of the canvas fades toward near-black
  // so adjacent boulders read as separate rocks instead of blending together.
  const vignette = ctx.createRadialGradient(size/2, size/2, size*0.4, size/2, size/2, size*0.5);
  vignette.addColorStop(0, 'rgba(2,2,3,0)');
  vignette.addColorStop(1, '#020203');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, size, size);

  const tex = new THREE.CanvasTexture(cnv);
  tex.needsUpdate = true;
  return tex;
}

function makeCrackGlowTexture(seed, paths){
  const size = 256;
  // paths is the exact same array baked into this boulder's static groove
  // art in makeBoulderTexture — the tap-fill reveal traces that same shape.

  // RGB is baked on one canvas, and normalized distance-from-origin (for the
  // tap fill-reveal) is baked as grayscale on a second — then merged so the
  // final texture's alpha channel carries distance instead of transparency.
  const colorCnv = document.createElement('canvas'); colorCnv.width = colorCnv.height = size;
  const colorCtx = colorCnv.getContext('2d');
  const distCnv = document.createElement('canvas'); distCnv.width = distCnv.height = size;
  const distCtx = distCnv.getContext('2d');

  // Deep red-to-orange gradient matching the lava river's own established
  // palette (see coolFlow/midHot/brightHot in the river shader above),
  // capped at a vivid orange rather than reaching yellow-white — the prior
  // pass's near-white core read as too bright and mismatched against the
  // river. Drawn in three narrower, more opaque layers (edge, mid, core)
  // instead of the previous four wide, low-alpha ones — that soft, spread-
  // out falloff was what gave the glow its "doodle"/drawn-line look; tighter
  // widths with higher opacity read as a defined, crisp molten crack.
  const haloC0 = [0x30,0x06,0x01], haloC1 = [0x48,0x0a,0x02];
  const midC0  = [0x90,0x22,0x03], midC1  = [0xb8,0x30,0x04];
  const coreC0 = [0xd8,0x4c,0x06], coreC1 = [0xff,0x70,0x0a];
  const distWidth = 16; // widest layer below — the reveal mask matches this so no layer gets clipped
  const widthSteps = 10; // ring count for the width-based thickness reveal, below
  // Shift the whole glow off the raw path centerline, toward the same side
  // the static groove's shadow trough sits on (see CRACK_LIGHT_DIR / the
  // shadow offset in makeBoulderTexture) — previously the glow was centered
  // exactly on the centerline, independent of where the groove's actual
  // dark trough was, so it read as a separate bright line floating over the
  // rock rather than light coming from inside the carved channel. Offsetting
  // it to sit inside that trough (with the groove's highlight edge, offset
  // to the opposite side, left outside the glow's reach) makes the fill
  // look like it's welling up inside the groove instead of sitting on it.
  const glowOff = 2.0;
  for (const pts of paths) {
    for (let i = 1; i < pts.length; i++) {
      const p0 = pts[i-1], p1 = pts[i];
      const dx = p1.x - p0.x, dy = p1.y - p0.y;
      const segLen = Math.sqrt(dx*dx + dy*dy) || 1;
      let nx = -dy/segLen, ny = dx/segLen;
      if (nx*CRACK_LIGHT_DIR.x + ny*CRACK_LIGHT_DIR.y < 0) { nx = -nx; ny = -ny; }
      const gx0 = p0.x - nx*glowOff, gy0 = p0.y - ny*glowOff;
      const gx1 = p1.x - nx*glowOff, gy1 = p1.y - ny*glowOff;

      const dAvg = (p0.d + p1.d) * 0.5;
      const mix3 = (c0, c1) => c0.map((v, k) => Math.round(v + (c1[k]-v)*dAvg));

      colorCtx.lineCap = 'round'; colorCtx.lineJoin = 'round';

      // Edge — narrower and more opaque than the old wide, low-alpha halo,
      // so the color falls off over a short distance instead of spreading
      // into a soft haze.
      const [hr,hg,hb] = mix3(haloC0, haloC1);
      colorCtx.strokeStyle = `rgba(${hr},${hg},${hb},0.8)`;
      colorCtx.lineWidth = 10;
      colorCtx.beginPath(); colorCtx.moveTo(gx0, gy0); colorCtx.lineTo(gx1, gy1); colorCtx.stroke();

      const [mr,mg,mb] = mix3(midC0, midC1);
      colorCtx.strokeStyle = `rgb(${mr},${mg},${mb})`;
      colorCtx.lineWidth = 6;
      colorCtx.beginPath(); colorCtx.moveTo(gx0, gy0); colorCtx.lineTo(gx1, gy1); colorCtx.stroke();

      const [cr,cg,cb] = mix3(coreC0, coreC1);
      colorCtx.strokeStyle = `rgb(${cr},${cg},${cb})`;
      colorCtx.lineWidth = 3;
      colorCtx.beginPath(); colorCtx.moveTo(gx0, gy0); colorCtx.lineTo(gx1, gy1); colorCtx.stroke();

      // "distance" here is no longer position along the path — it's
      // perpendicular distance from the crack's own centerline, baked as
      // concentric rings from widest (outer edge, highest value) drawn
      // first down to the thinnest (centerline, lowest value) drawn last on
      // top. Every point along the ENTIRE crack network gets the same ring
      // values regardless of where it sits along the path, so the reveal
      // threshold uncovers a thin line down the whole crack at once, then
      // widens uniformly outward — a "filling up in thickness" animation
      // instead of one that travels along the path.
      distCtx.lineCap = 'round'; distCtx.lineJoin = 'round';
      for (let s = widthSteps; s >= 1; s--) {
        const t = s / widthSteps;
        const byte = Math.max(1, Math.round(t * 255));
        distCtx.strokeStyle = `rgb(${byte},${byte},${byte})`;
        distCtx.lineWidth = distWidth * t;
        distCtx.beginPath();
        distCtx.moveTo(gx0, gy0);
        distCtx.lineTo(gx1, gy1);
        distCtx.stroke();
      }
    }
  }

  // returned as two separate canvases (not merged into one texture) so the
  // color layer can be sampled with smooth linear filtering for clean edges,
  // while the distance layer keeps exact nearest-neighbor sampling — see the
  // filter settings where these are turned into textures, below.
  return { colorCnv, distCnv };
}

// Derived from the actual camera bounds (camera.right scales with the real
// device/viewport aspect ratio) rather than a fixed guess, so it's correct
// for whatever the real viewport turns out to be. The margin was previously
// +1.5 (just over the largest boulder radius) but a boulder was still
// reported missing its crack texture on a real device even with that in
// place. Investigating turned up two things: (1) +1.5 leaves almost no
// headroom beyond the radius itself for any device wider than what's been
// tested, and (2) the Z-axis check below had NO margin at all — camera.top/
// ORTHO_H is a fixed constant (doesn't vary with aspect ratio), but boulders
// sitting just past it (confirmed: 62 boulders on this scene, comfortably
// within X range, with |z| between ORTHO_H and ORTHO_H+4.5) were being
// excluded purely by that missing margin, regardless of how wide VISIBLE_X
// was — very likely the actual cause of the persisting report, since a
// "top" boulder is a Z-boundary case. Both margins widened substantially
// (1.5 -> 4.5) to comfortably cover real device variance; checked the
// resulting eligible-boulder count and atlas size before deploying (see
// commit notes) to confirm this stays well within texture size/memory
// limits — this is a wider but still finite, dynamically-sized cutoff, not
// the "bake everything, no cutoff" approach that caused a full regression.
const MARGIN = 4.5;
const VISIBLE_X = camera.right + MARGIN;
const VISIBLE_Z = ORTHO_H + MARGIN;
const visibleBoulderIdx = [];
boulderDefs.forEach((b, i) => { if (Math.abs(b.x) <= VISIBLE_X && Math.abs(b.z) <= VISIBLE_Z) visibleBoulderIdx.push(i); });

const ATLAS_CELL = 256;
const atlasCols = Math.max(1, Math.ceil(Math.sqrt(visibleBoulderIdx.length + 1)));
const atlasRows = Math.max(1, Math.ceil((visibleBoulderIdx.length + 1) / atlasCols));
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = atlasCols * ATLAS_CELL; atlasCanvas.height = atlasRows * ATLAS_CELL;
const atlasCtx = atlasCanvas.getContext('2d');
// glow color and glow distance are kept as two separate atlases so each can
// use its own GPU filtering (see the texture setup below) — smooth linear
// for the visible color, exact nearest for the reveal-threshold distance.
const glowColorAtlasCanvas = document.createElement('canvas');
glowColorAtlasCanvas.width = atlasCols * ATLAS_CELL; glowColorAtlasCanvas.height = atlasRows * ATLAS_CELL;
const glowColorAtlasCtx = glowColorAtlasCanvas.getContext('2d');
const glowDistAtlasCanvas = document.createElement('canvas');
glowDistAtlasCanvas.width = atlasCols * ATLAS_CELL; glowDistAtlasCanvas.height = atlasRows * ATLAS_CELL;
const glowDistAtlasCtx = glowDistAtlasCanvas.getContext('2d');

const atlasOffsetArray = new Float32Array(boulderDefs.length * 2); // defaults to (0,0) — cell 0, the shared generic texture
const cellUvW = 1 / atlasCols, cellUvH = 1 / atlasRows;

// cell 0 — shared generic texture for every boulder outside the viewport
atlasCtx.drawImage(makeBoulderTexture(0x2c3e50, false).image, 0, 0);

visibleBoulderIdx.forEach((idx, n) => {
  const cellIndex = n + 1; // cell 0 is reserved for the shared generic texture
  const col = cellIndex % atlasCols, row = Math.floor(cellIndex / atlasCols);
  const seed = idx * CRACK_SEED_SALT + 13;
  // Generated once per boulder and passed into both bakers below, so the
  // visible groove art and the tap-fill glow reveal are guaranteed to trace
  // the exact same crack shape — not just two independently-seeded calls

// ── Boulder crack system — per-instance fill level sweeps outward from the
// tapped point through the baked crack-glow atlas, like molten lava surging
// out through the fracture. Timing/trigger logic is unchanged from before —
// only the render target changed (a per-instance attribute instead of a
// per-mesh uniform), since all boulders now share one InstancedMesh.
const activeCracks = [];   // { id, startTime }
const HEAT_DECAY = 0.16;
const FILL_REST = 0;

function triggerCrack(id, hitPoint){
  const existing = activeCracks.find(c => c.id === id);
  if (existing) {
    existing.startTime = performance.now();
  } else {
    activeCracks.push({ id, startTime: performance.now() });
    if (activeCracks.length > 36) {
      const old = activeCracks.shift();
      fillLevelArray[old.id] = FILL_REST;
      boulderGeo.attributes.aFillLevel.needsUpdate = true;
    }
  }
  heatArray[id] = 1.0;
}

function handleBoulderTap(id){
  heatArray[id] = Math.min(0.5, heatArray[id] + 0.25);
}

function updateBoulderHeat(dt){
  let changed = false;
  for (let i = 0; i < heatArray.length; i++) {
    if (heatArray[i] > 0) {
      heatArray[i] = Math.max(0, heatArray[i] - dt*HEAT_DECAY);
      changed = true;
    }
  }
  if (changed) boulderGeo.attributes.aHeat.needsUpdate = true;
  const now = performance.now();
  let fillChanged = false;
  for (let i = activeCracks.length - 1; i >= 0; i--) {
    const c = activeCracks[i];
    const elapsed = (now - c.startTime) / 1000;
    const fillDur  = 5.0;
    const holdDur  = 1.8;
    const drainDur = 6.5;
    let level = FILL_REST;
    if (elapsed < fillDur) {
      const t = elapsed / fillDur;
      // cubic ease-out — was smoothstep, which has a flat tangent at t=0 and
      // stays under the width-reveal's visibility threshold for close to a
      // second, reading as a startup delay after the tap. This ramps up
      // immediately from the first frame, still decelerating into the hold
      // rather than a linear/instant snap.
      level = 1.0 - Math.pow(1.0 - t, 3);
    } else if (elapsed < fillDur + holdDur) {
      level = 1.0;
    } else if (elapsed < fillDur + holdDur + drainDur) {
      const t = (elapsed - fillDur - holdDur) / drainDur;
      level = 1.0 - t*t*(3.0 - 2.0*t); // smoothstep ease — settles/pools back out gently
    } else {
      fillLevelArray[c.id] = FILL_REST;
      fillChanged = true;
      activeCracks.splice(i, 1);
      continue;
    }
    fillLevelArray[c.id] = level;
    fillChanged = true;
  }

}

// ── Bubbles: grow, swell, pop with splash ─────────────────────────────────────
// Surface shader reuses the lava river's own noise/color pipeline verbatim
// (same hash/noise/fbm functions, same flow-warp, same heat-driven color
// ramp from cool flow through to a hottest near-white core, same crust
// darkening and fine bump shading) instead of a separate sphere-shading
// technique — a custom diffuse/specular model was tried here previously,
// but it didn't read as "lava"; this makes a bubble look like a raised
// patch of the same molten surface, just applied to the sphere's own UV.
// Shares the exact same uTime uniform object as lavaMaterial (not a copy)
// so its flow animation stays in sync automatically with no extra update
// code needed.
const bubbleGeo = new THREE.SphereGeometry(1, 12, 8);

const MAX_BUBBLES = 5;

function makeBubbleMaterial(){
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: { uTime: lavaMaterial.uniforms.uTime },
    vertexShader: `
      varying vec2 vUv;
      varying float vNy;
      void main(){
        vUv = uv;
        // object-space normal.y — 1.0 at the crown, 0 at the equator (the
        // silhouette edge as seen from this scene's straight-down camera).
        // Used only for the edge alpha fade below, not for shading color.
        vNy = normalize(normal).y;

      }
    `,
    fragmentShader: `
      precision mediump float;
      varying vec2 vUv;
      varying float vNy;
      uniform float uTime;

      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        float a = hash(i), b = hash(i+vec2(1.0,0.0));
        float c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
        vec2 u = f*f*(3.0-2.0*f);

        for(int i=0;i<2;i++){ v += a*noise(p); p *= 2.02; a *= 0.5; }
        return v;
      }
      float fbm(vec2 p){
        float v = 0.0, a = 0.5;
        for(int i=0;i<4;i++){ v += a*noise(p); p *= 2.02; a *= 0.5; }

      }

      void main(){

        // (see lavaMaterial above) — same uTime coefficients throughout, so
        // the surface motion reads as the same substance, just on a sphere.
        vec2 flowUv = vUv*vec2(3.2,9.0) + vec2(uTime*0.02, -uTime*0.28);

        vec3 midHot      = vec3(0.80, 0.20, 0.025);
        vec3 brightHot   = vec3(1.00, 0.46, 0.06);
        vec3 hottestCore = vec3(1.00, 0.80, 0.28);

        vec3 col = mix(coolFlow, midHot, smoothstep(0.15, 0.55, heat));
        col = mix(col, brightHot, smoothstep(0.45, 0.80, heat));

        // underneath show through at the rim, so the boundary dissolves
        // into the surrounding flow instead of cutting a clean circle.
        float edgeAlpha = smoothstep(-0.05, 0.55, vNy);

// ── Shared sprite textures ────────────────────────────────────────────────────
function makeRadialTexture(inner, outer, size=64){
  const cnv = document.createElement('canvas'); cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  g.addColorStop(0, inner);
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(cnv);
  tex.needsUpdate = true;
  return tex;
}
// A perfectly circular radial gradient (makeRadialTexture above) rotates
// into itself with no visible change, so per-sprite rotation is wasted on
// it. This bakes several overlapping soft blobs at jittered positions/sizes
// into one irregular, non-circular cloud shape instead — rotating and
// offsetting instances of THIS texture is what actually gives overlapping
// sprites a wispy, uneven silhouette rather than a stack of perfect
// circles. Baked once and reused (cheap); "rgb" is an "r,g,b" string.
function makeWispyTexture(rgb, size=96){
  const cnv = document.createElement('canvas'); cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const blobCount = 5;
  for (let i = 0; i < blobCount; i++) {
    const bx = size*0.5 + (Math.random()-0.5)*size*0.55;
    const by = size*0.5 + (Math.random()-0.5)*size*0.55;
    const br = size*(0.26 + Math.random()*0.24);
    const a = 0.32 + Math.random()*0.3;
    const g = ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,size,size);
  }
  const tex = new THREE.CanvasTexture(cnv);
  tex.needsUpdate = true;
  return tex;
}
const splashTex = makeRadialTexture('rgba(90,10,5,0.7)', 'rgba(50,4,2,0)');
const smokeTex  = makeRadialTexture('rgba(60,8,8,0.45)', 'rgba(25,4,4,0)');
// Distinct texture for pop-triggered smoke — the ambient smokeTex above is
// deliberately faint and reddish for its own small wisps; that same color
// (even at a higher peak alpha, tried in the last pass) still read as a
// warm tint rather than actual smoke. This is a genuine dark neutral gray,
// near-opaque at the core, so a pop reads as a real puff of steam/smoke.
// Built from makeWispyTexture (irregular multi-blob shape, not a perfect
// circle) so overlapping/rotating puffs read as curling tendrils rather
// than a stack of flat gray discs.
const popSmokeTex = makeWispyTexture('22,20,20');
// Hot yellow-white ember core (rather than reusing splashTex's softer,
// darker-orange radial) so burst fragments stay visible with additive
// blending even when spawned over the lava river's own already-bright
// orange surface — adding a near-white glow reads clearly there, whereas
// the darker splash color barely showed any contrast on top of the lava.
const burstTex = makeRadialTexture('rgba(255,205,130,0.95)', 'rgba(255,90,20,0)');

function makeSpritePool(count, texture, blending){
  const pool = [];
  for (let i = 0; i < count; i++) {
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0, depthWrite: false, blending });
    const spr = new THREE.Sprite(mat);
    spr.visible = false;
    scene.add(spr);
    pool.push({ sprite: spr, active: false, data: {} });
  }
  return pool;
}
const splashPool = makeSpritePool(40, splashTex, THREE.AdditiveBlending);
// Raised from 14, then again from 24 — pop-smoke now spawns a staggered
// cluster of several sub-puffs per pop (below) instead of 1-2, and each
// puff's long multi-second lifetime means many can be alive at once;
// sized with headroom so clusters don't get starved by pool exhaustion.
const smokePool  = makeSpritePool(56, smokeTex, THREE.NormalBlending);
// Small upward-arcing eruption fragments — a new, separate pool from the
// existing flat splash particles below, since those never move in Y at all
// (pure radial scatter at a fixed height). Uses the brighter burstTex (not
// splashTex) so it reads as a distinct hot ember against the lava.
const burstPool = makeSpritePool(24, burstTex, THREE.AdditiveBlending);

// ── Splash particles (bubble pops) ───────────────────────────────────────────
function spawnSplash(x, z, count){
  let spawned = 0;
  for (const item of splashPool) {
    if (item.active) continue;
    const ang = Math.random()*Math.PI*2;
    const speed = 0.5 + Math.random()*1.1;
    item.active = true;
    item.data = { x, z, vx: Math.cos(ang)*speed, vz: Math.sin(ang)*speed, life: 0, maxLife: 0.3+Math.random()*0.25, size: 0.16+Math.random()*0.16 };
    item.sprite.visible = true;
    item.sprite.position.set(x, 1.5, z);
    item.sprite.material.opacity = 0.22;
    item.sprite.scale.setScalar(item.data.size);
    spawned++;
    if (spawned >= count) break;
  }
}
function updateSplashes(dt){
  for (const item of splashPool) {
    if (!item.active) continue;
    const d = item.data;
    d.life += dt;
    const tt = d.life / d.maxLife;
    if (tt >= 1) { item.active = false; item.sprite.visible = false; continue; }
    d.x += d.vx*dt; d.z += d.vz*dt;
    item.sprite.position.set(d.x, 1.5, d.z);
    item.sprite.material.opacity = (1 - tt) * 0.22;
    item.sprite.scale.setScalar(d.size * (1 + tt*0.6));
  }
}

// ── Small eruption burst (bubble pops) ───────────────────────────────────────
// Individual fragments that visibly separate from the pop point in a radial
// spray, distinct from the bubble's own brief pop-scale bump. The previous
// version gave each fragment an upward velocity plus gravity, but this
// scene's camera looks straight down through an ORTHOGRAPHIC projection —
// under orthographic projection, a world-Y change moves an object only in
// depth (affecting occlusion order), never in screen-space position, so
// that "arc" was completely invisible on screen; combined with a fairly
// modest horizontal speed, fragments barely read as separating from the
// bubble's own flash before fading. Rebuilt around what's actually visible:
// a much wider, evenly-spaced horizontal spray so each fragment reads as a
// distinct moving piece, plus a scale pulse (grow then shrink over its
// life) standing in for the rise-and-fall an orthographic top-down view
// can't otherwise convey. Still kept small/brief/restrained — a handful of
// fragments, well under a second.
function spawnBurst(x, z){
  const count = 5 + Math.floor(Math.random()*3); // 5-7 fragments
  let spawned = 0;
  for (const item of burstPool) {
    if (item.active) continue;
    // roughly evenly spaced around a full circle (with jitter) rather than
    // fully random per-fragment, so they reliably spray outward in
    // different directions instead of occasionally clumping together.
    const ang = (Math.PI * 2 * spawned / count) + range(-0.35, 0.35);
    const outSpeed = 0.9 + Math.random() * 0.7;
    item.active = true;
    item.data = {
      x, z,
      vx: Math.cos(ang) * outSpeed, vz: Math.sin(ang) * outSpeed,
      life: 0, maxLife: 0.5 + Math.random() * 0.3,
      size: 0.16 + Math.random() * 0.1,
    };
    item.sprite.visible = true;
    item.sprite.position.set(x, 1.5, z);
    item.sprite.material.opacity = 1.0;
    item.sprite.scale.setScalar(item.data.size);
    spawned++;
    if (spawned >= count) break;
  }
}
function updateBurst(dt){
  for (const item of burstPool) {
    if (!item.active) continue;
    const d = item.data;
    d.life += dt;
    const tt = d.life / d.maxLife;
    if (tt >= 1) { item.active = false; item.sprite.visible = false; continue; }
    d.x += d.vx*dt; d.z += d.vz*dt;
    item.sprite.position.set(d.x, 1.5, d.z);
    // Scale pulse — bigger mid-flight, smaller at both the start and the
    // end (a half sine over the fragment's life) — the visible stand-in for
    // a rise-then-fall arc.
    const arc = 1.0 + Math.sin(Math.min(1, tt) * Math.PI) * 0.5;
    item.sprite.material.opacity = 1.0 * (1 - tt);
    item.sprite.scale.setScalar(d.size * arc);
  }
}

// ── Smoke puffs drifting off the lava ────────────────────────────────────────
let smokeTimer = 0.4;
function updateSmokeSpawning(dt){
  smokeTimer -= dt;
  if (smokeTimer <= 0) {
    smokeTimer = 0.6 + Math.random()*1.0;
    spawnSmoke();
  }
}
function spawnSmoke(){
  const item = smokePool.find(p => !p.active);
  if (!item) return;
  const z = range(-ORTHO_H*0.85, ORTHO_H*0.85);
  const x = centerX(z) + range(-0.7, 0.7) * halfWidth(z);
  item.active = true;
  // Explicitly set the ambient texture/peak alpha every spawn (rather than
  // relying on whatever this pool slot was last used for) since slots are
  // now shared with spawnPopSmoke below, which uses a different texture and
  // a much higher peak alpha.
  item.sprite.material.map = smokeTex;
  item.data = {
    x, z, driftX: range(-0.05,0.05), driftZ: range(-0.02,0.06),
    life: 0, maxLife: range(3.5,5.5), startSize: range(0.35,0.55), endSize: range(1.0,1.5),
    peakAlpha: 0.28,
  };
  item.sprite.visible = true;
  item.sprite.position.set(x, 1.2, z);
  item.sprite.material.opacity = 0;
  item.sprite.scale.set(item.data.startSize*0.55, item.data.startSize*1.3, 1);
}
// Spawned specifically when a bubble pops (see updateBubbles), on top of —
// not instead of — the ambient drift-smoke above. Shares updateSmoke's
// animation, but with its own texture (popSmokeTex, now a genuine dark
// gray/near-black rather than a reddish tint) and a near-opaque peakAlpha,
// plus a substantially bigger size and longer lifetime. Two earlier passes
// were still too subtle: the first reused smokeTex with updateSmoke's
// hardcoded 0.28 peak-alpha cap outright (effective opacity ~0.13); the
// second raised the cap and size but kept a reddish tint, which still read
// as a warm haze rather than actual smoke.
// Spawns a small staggered CLUSTER of sub-puffs rather than 1-2 uniform
// blobs, so a pop reads as layered, curling smoke instead of one growing
// smudge. Each sub-puff gets its own jittered offset, drift, size, peak
// opacity, and rotation/spin — and a slightly delayed start (negative
// initial `life`, relying on updateSmoke's existing alpha clamp to keep it
// invisible until its delay elapses) so puffs unfurl one after another
// instead of all blooming in perfect unison.
function spawnPopSmoke(x, z){
  const count = 4 + Math.floor(Math.random()*3); // 4-6 puffs per pop
  let spawned = 0;
  for (const item of smokePool) {
    if (item.active) continue;
    const px = x + range(-0.32, 0.32), pz = z + range(-0.32, 0.32);
    item.active = true;
    item.sprite.material.map = popSmokeTex;
    item.data = {
      x: px, z: pz, driftX: range(-0.1,0.1), driftZ: range(-0.05,0.13),
      life: -range(0, 0.5), maxLife: range(6.0,9.5), startSize: range(1.0,1.6), endSize: range(3.6,5.6),
      peakAlpha: range(0.55, 0.92),
      rot: range(0, Math.PI*2), rotSpeed: range(-0.5, 0.5),
    };
    item.sprite.visible = true;
    item.sprite.position.set(px, 1.2, pz);
    item.sprite.material.opacity = 0;
    item.sprite.material.rotation = item.data.rot;
    item.sprite.scale.set(item.data.startSize*0.55, item.data.startSize*1.3, 1);
    spawned++;
    if (spawned >= count) break;
  }
}
function updateSmoke(dt){
  for (const item of smokePool) {
    if (!item.active) continue;
    const d = item.data;
    d.life += dt;
    if (d.life < 0) continue; // still waiting out its staggered start delay
    const tt = d.life / d.maxLife;
    if (tt >= 1) { item.active = false; item.sprite.visible = false; continue; }
    d.x += d.driftX*dt; d.z += d.driftZ*dt;
    const scale = d.startSize + (d.endSize - d.startSize) * tt;
    item.sprite.position.set(d.x, 1.2 + tt*1.5, d.z);
    item.sprite.scale.set(scale*0.55, scale*1.3, 1);
    if (d.rotSpeed) item.sprite.material.rotation = d.rot + d.rotSpeed * d.life;
    let alpha;
    if (tt < 0.15) alpha = tt/0.15 * d.peakAlpha;
    else alpha = d.peakAlpha * (1 - (tt-0.15)/0.85);
    item.sprite.material.opacity = Math.max(0, alpha);
  }
}

// ── Drag-on-lava parting effect ──────────────────────────────────────────────
const dragSlots = Array.from({length: MAX_TOUCH}, () => ({ x: 9999, z: 9999, strength: 0, active: false, pointerId: null }));

function updateDragSlots(dt){
  for (const s of dragSlots) {
    if (s.active) s.strength = Math.min(1, s.strength + dt*5.0);
    else s.strength = Math.max(0, s.strength - dt*(1/3.2));
  }
}
// Drag-parting visual: a glowing streak of small quads dropped along the
// drag path, instead of a shader-driven effect.
const dragQuadGeo = new THREE.PlaneGeometry(1.4, 1.4);
dragQuadGeo.rotateX(-Math.PI/2); // face upward, flat on the lava surface

const dragCanvas = document.createElement('canvas');
dragCanvas.width = 64; dragCanvas.height = 64;
const dragCtx = dragCanvas.getContext('2d');
const dragGrad = dragCtx.createRadialGradient(32,32,0,32,32,32);
dragGrad.addColorStop(0, 'rgba(130,20,4,0.9)');
dragGrad.addColorStop(0.35, 'rgba(90,8,2,0.5)');
dragGrad.addColorStop(0.7, 'rgba(50,2,0,0.2)');
dragGrad.addColorStop(1, 'rgba(0,0,0,0)');
dragCtx.fillStyle = dragGrad;
dragCtx.fillRect(0,0,64,64);
const dragTex = new THREE.CanvasTexture(dragCanvas);
const dragMat = new THREE.MeshBasicMaterial({
  map: dragTex, transparent: true, opacity: 1.0,
  depthWrite: false, blending: THREE.AdditiveBlending
});

const DRAG_QUAD_COUNT = 80;
const DRAG_QUAD_LIFE = 1.5;
const DRAG_QUAD_OPACITY = 0.65;
const dragQuadPool = [];
for (let i = 0; i < DRAG_QUAD_COUNT; i++) {
  const mesh = new THREE.Mesh(dragQuadGeo, dragMat.clone());
  mesh.material.opacity = 0;
  mesh.position.y = 0.05;
  mesh.visible = false;
  scene.add(mesh);
  dragQuadPool.push({ mesh, life: 0 });
}
let nextDragQuad = 0;
const dragLastSpawn = dragSlots.map(() => null);
const DRAG_QUAD_SPACING = 0.05; // world units between quads along the path

function spawnDragQuad(x, z){
  const item = dragQuadPool[nextDragQuad];
  nextDragQuad = (nextDragQuad + 1) % DRAG_QUAD_COUNT;
  item.life = 0;
  item.mesh.position.set(x, 0.05, z);
  item.mesh.visible = true;
  item.mesh.material.opacity = DRAG_QUAD_OPACITY;
}

function updateDragQuads(dt){
  for (const item of dragQuadPool) {
    if (!item.mesh.visible) continue;
    item.life += dt;
    if (item.life >= DRAG_QUAD_LIFE) { item.mesh.visible = false; continue; }
    item.mesh.material.opacity = DRAG_QUAD_OPACITY * (1 - item.life / DRAG_QUAD_LIFE);
  }
}

// ── Input: raycasting for boulder tap/hold and river drag ───────────────────
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function ndcFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  ndc.x = Math.max(-1, Math.min(1,  ((e.clientX - rect.left) / rect.width)  * 2 - 1));
  ndc.y = Math.max(-1, Math.min(1, -((e.clientY - rect.top)  / rect.height) * 2 + 1));
  return ndc;
}
function pickBoulder(e){
  raycaster.setFromCamera(ndcFromEvent(e), camera);
  const hits = raycaster.intersectObject(boulderMesh);
  return hits.length ? hits[0] : null;
}
function pickRiver(e){
  raycaster.setFromCamera(ndcFromEvent(e), camera);
  const hits = raycaster.intersectObject(lavaMesh);
  return hits.length ? hits[0] : null;
}

let boulderDownId = null, boulderDownTime = 0, boulderDownX = 0, boulderDownY = 0;
let holdTimer = null;
const HOLD_MS = 220;
let lastBoulderHitPoint = new THREE.Vector3();

canvas.addEventListener('pointerdown', (e) => {
  const hit = pickBoulder(e);
  if (hit) {
    boulderDownId = hit.instanceId;
    boulderDownTime = performance.now();
    boulderDownX = e.clientX; boulderDownY = e.clientY;
    lastBoulderHitPoint.copy(hit.point);
    // Fire immediately on touch rather than waiting for release — triggering
    // on pointerup added the tap's own hold duration (up to HOLD_MS) as a
    // felt delay before the fill ever started.
    handleBoulderTap(hit.instanceId);
    triggerCrack(hit.instanceId, hit.point);
    return;
  }
  const riverHit = pickRiver(e);
  if (riverHit) {
    const slotIndex = dragSlots.findIndex(s => !s.active);
    if (slotIndex !== -1) {
      const slot = dragSlots[slotIndex];
      slot.active = true; slot.pointerId = e.pointerId;
      slot.x = riverHit.point.x; slot.z = riverHit.point.z;
      dragLastSpawn[slotIndex] = { x: riverHit.point.x, z: riverHit.point.z };
      spawnDragQuad(riverHit.point.x, riverHit.point.z);
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (boulderDownId !== null) {
    const dx = e.clientX - boulderDownX, dy = e.clientY - boulderDownY;
    if (dx*dx + dy*dy > 400) {
      clearTimeout(holdTimer);
      boulderDownId = null;
    }
  }
  const slotIndex = dragSlots.findIndex(s => s.active && s.pointerId === e.pointerId);
  if (slotIndex !== -1) {
    const slot = dragSlots[slotIndex];
    const riverHit = pickRiver(e);
    if (riverHit) {
      slot.x = riverHit.point.x; slot.z = riverHit.point.z;
      const last = dragLastSpawn[slotIndex];
      const dx = riverHit.point.x - last.x, dz = riverHit.point.z - last.z;
      if (Math.sqrt(dx*dx + dz*dz) >= DRAG_QUAD_SPACING) {
        spawnDragQuad(riverHit.point.x, riverHit.point.z);
        dragLastSpawn[slotIndex] = { x: riverHit.point.x, z: riverHit.point.z };
      }
    }
  }
});

function releasePointer(e){
  clearTimeout(holdTimer);
  boulderDownId = null;
  const slot = dragSlots.find(s => s.pointerId === e.pointerId);
  if (slot) { slot.active = false; slot.pointerId = null; }
}
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

// ── Reset ─────────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  for (let i = 0; i < heatArray.length; i++) heatArray[i] = 0;
  boulderGeo.attributes.aHeat.needsUpdate = true;
  for (const c of activeCracks) { fillLevelArray[c.id] = FILL_REST; }
  boulderGeo.attributes.aFillLevel.needsUpdate = true;
  activeCracks.length = 0;
  for (const s of dragSlots) { s.active = false; s.strength = 0; s.x = 9999; s.z = 9999; s.pointerId = null; }
  for (const item of dragQuadPool) { item.life = 0; item.mesh.visible = false; item.mesh.material.opacity = 0; }
  for (let i = 0; i < dragLastSpawn.length; i++) dragLastSpawn[i] = null;
  boulderDownId = null;
  clearTimeout(holdTimer);
});

// ── Initial ambient bubbles ───────────────────────────────────────────────────
for (let i = 0; i < 4; i++) trySpawnBubble();

// ── FPS readout ───────────────────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsAccum = 0;

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  lavaMaterial.uniforms.uTime.value += dt;
  updateDragSlots(dt);
  updateDragQuads(dt);
  updateBoulderHeat(dt);
  updateBubbles(dt);
  if (activeBubbleCount < 4) trySpawnBubble();
  updateSmokeSpawning(dt);
  updateSmoke(dt);
  updateSplashes(dt);
  updateBurst(dt);

  renderer.render(scene, camera);

  fpsFrames++; fpsAccum += dt;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = `${(fpsFrames/fpsAccum).toFixed(1)} fps`;
    fpsFrames = 0; fpsAccum = 0;
  }
});

// ── Console handle for future animation work ─────────────────────────────────
window.__lava = { THREE, scene, camera, renderer, boulderMesh, boulderDefs, heatArray, fillLevelArray, triggerCrack, handleBoulderTap, dragSlots, dragQuadPool, activeCracks };
</script>
</body>
</html>
