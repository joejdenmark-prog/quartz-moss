<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfdae0">
<title>Snowy Forest</title>
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#cfdae0;
    font-family:system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #canvas{
    display:block; width:100%; height:100%;
    touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  /* Cool, light edge darkening rather than a dark dramatic vignette -- the
     brief is "bright and calm, not dim or moody", so this only needs to
     softly draw the eye inward, not shade the scene down. Color stops are
     CSS custom properties (defaulting to these exact original values, so
     daytime is pixel-identical to before) -- the day/night toggle below
     overrides them at night, since this same light-gray tint read as a
     bright ring against the dark night sky instead of a vignette. */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse 100% 90% at 50% 45%,
      transparent 55%, var(--vig-c1, rgba(170,190,200,0.22)) 82%, var(--vig-c2, rgba(150,172,185,0.38)) 100%);
  }
  #fps{
    position:fixed; top:8px; left:8px; z-index:9999;
    font:12px/1.4 monospace; color:#eaf2f6;
    background:rgba(20,30,36,0.55); padding:4px 8px; border-radius:4px;
    pointer-events:none; white-space:pre;
  }
  /* Same circular floating-button pattern as lava.html's #reset-btn --
     translucent frosted panel, plain glyph, hover/active feedback. */
  #daynight-btn{
    position:fixed; bottom:24px; right:24px; width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(20,30,36,0.55);
    color:rgba(234,242,246,0.9);
    font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .25s ease, transform .14s ease;
    opacity:.75; z-index:100; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  #daynight-btn:hover  { opacity:1; }
  #daynight-btn:active { transform:scale(.9); opacity:1; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>
<div id="fps">-- fps</div>
<!-- Glyph shows the state a click switches TO (moon while it's day, sun
     while it's night), same convention as most day/night toggles. -->
<button id="daynight-btn" title="Toggle day/night">☾</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Seeded RNG ───────────────────────────────────────────────────────────────
// Same mulberry32 helper as the other scenes — deterministic across reloads,
// which makes the forest layout reproducible while tuning.
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng   = mulberry32(0x5f10001);
const range = (a,b) => a + rng() * (b - a);

// ── Renderer / scene / camera ────────────────────────────────────────────────
// visualViewport (not window.innerWidth/Height) avoids the iOS Safari
// address-bar-collapse mismatch — same reasoning as the other scenes.
function getViewportSize(){
  if (window.visualViewport) {
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}

let { w: W, h: H } = getViewportSize();
const canvas = document.getElementById('canvas');
const isMobile = window.matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
// No shadow maps at all, deliberately: overcast daylight scatters through a
// full cloud layer, so real shadows are extremely soft to the point of
// being nearly invisible anyway. Skipping shadow maps entirely both matches
// the "shadowless-feeling light" brief exactly and keeps this stage cheap —
// nothing here needs to pay for shadow-map render passes.
renderer.shadowMap.enabled = false;

// Sky/fog share one color so the horizon has no visible seam where the fog
// stops and open background starts — distant trees just fade smoothly away.
const SKY_COLOR = 0xcfdbe1;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);
// Light and airy per the brief, not a heavy near-in fog: starts well past
// the midground so close/mid trees stay crisp, and only softly dissolves
// the far edge of the forest into the sky color. Distances pulled in to
// match the tree field being pulled closer (was 70/205) -- otherwise the
// far edge of the now-nearer forest would sit well short of the old fog
// start and lose the "receding into haze" depth cue entirely.
scene.fog = new THREE.Fog(SKY_COLOR, 45, 125);

// Perspective, not orthographic — "viewed from a fixed camera angle" reads
// as standing at the edge of a clearing looking in, which needs a real
// vanishing point (matches rain.html's reasoning for the same choice).
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 260);
camera.position.set(0, 1.7, 9);
camera.lookAt(0, 1.3, -30);

let resizeTimer;
function handleViewportResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const size = getViewportSize();
    W = size.w; H = size.h;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }, 250);
}
window.addEventListener('resize', handleViewportResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewportResize);
}

// ── Lights ────────────────────────────────────────────────────────────────────
// Hemisphere light does almost all the work here — it's inherently a soft,
// directionless wash between a sky tone and a ground tone, which is exactly
// what light scattered through an overcast cloud layer looks like. Kept as
// the dominant source (well above the directional light's intensity below)
// so the scene reads as bright, even, ambient daylight rather than lit from
// one particular direction.
// Named (not added anonymously) so the day/night toggle below can animate
// its color/intensity.
const hemiLight = new THREE.HemisphereLight(0xdce8ee, 0xb7bfae, 1.15);
scene.add(hemiLight);
// A very weak, low directional light — not to cast shadows (there are none),
// just to give the tree canopies and ground undulation a faint sense of
// form/gradient so they don't read as completely flat. Positioned high and
// almost overhead, like a bright patch in a cloud layer rather than a
// visible sun.
const sky = new THREE.DirectionalLight(0xf3f8fb, 0.35);
sky.position.set(-8, 20, 6);
scene.add(sky);

// ── Ground: snowy plane with gentle undulation ───────────────────────────────
// Displaced with a handful of summed sine waves rather than an imported
// noise library — cheap, deterministic, and consistent with how the other
// scenes build their own procedural variation from scratch. This only runs
// once at startup (the ground never animates in this stage), so cost here
// is a load-time cost, not a per-frame one.
const GROUND_W = 400, GROUND_D = 220, GROUND_SEGS_X = 80, GROUND_SEGS_Z = 50;
const groundGeo = new THREE.PlaneGeometry(GROUND_W, GROUND_D, GROUND_SEGS_X, GROUND_SEGS_Z);
groundGeo.rotateX(-Math.PI / 2);
// PlaneGeometry is centered on its own origin; shift it so it spans roughly
// z:[-190, 30] instead of z:[-110, 110] — covers the full tree field (below)
// plus some ground visible near/behind the camera itself.
groundGeo.translate(0, 0, -80);

const SNOW_BASE  = new THREE.Color(0xeef4f7);
const SNOW_SHADE = new THREE.Color(0xc7d6dc); // cooler/darker, pools in the undulation's low points
// Factored out (not just inlined below) so anything else placed directly
// on the ground -- lanterns, see below -- can sample the same undulation
// instead of assuming a flat y=0, which trees get away with only because
// they're tall enough (TRUNK_H=1.6) for the ~+-1.5 unit undulation range to
// be a small fraction of their height.
function groundHeightAt(x, z){
  return Math.sin(x * 0.035 + 1.0) * 0.35
       + Math.sin(z * 0.045 + 2.4) * 0.40
       + Math.sin((x + z) * 0.021 + 0.7) * 0.50
       + Math.sin((x - z) * 0.013 + 3.1) * 0.30;
}
{
  const pos = groundGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = groundHeightAt(x, z);
    pos.setY(i, h);
    const t = THREE.MathUtils.clamp((h + 0.9) / 1.8, 0, 1);
    c.copy(SNOW_SHADE).lerp(SNOW_BASE, t);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals(); // required after manually displacing Y — lighting would otherwise use the flat pre-displacement normals
}

// Fine grain, layered on top of the vertex-color undulation shading above
// via an ordinary texture map rather than a custom shader -- standard
// MeshStandardMaterial multiplies vertexColors x map together
// automatically, so this composites correctly with the existing lighting/
// fog for free, no shader surgery needed. Generated once at load time onto
// an offscreen canvas (no external image assets, same "everything
// procedural, no build step" approach as the rest of the file) and tiled
// via RepeatWrapping, so texel detail doesn't depend on the ground mesh's
// own (fairly coarse) vertex density the way vertex colors did.
// (A sparkle/glint emissive map previously lived here too, but was removed
// -- under this scene's soft overcast lighting there's no distinct light
// source for snow to catch, so glint highlights didn't make physical sense.)
function clampByte(v){ return Math.max(0, Math.min(255, v | 0)); }

// Small, low-contrast per-pixel luminance jitter -- reads as grain/texture
// up close rather than the perfectly flat white the ground had before.
function makeSnowGrainTexture(size){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - 0.5) * 30; // +-15 luminance jitter, subtle
    d[i]   = clampByte(255 + n);
    d[i+1] = clampByte(255 + n);
    d[i+2] = clampByte(255 + n * 0.92); // fractionally cooler in the dark specks than the light ones
    d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const grainTex = makeSnowGrainTexture(256);
grainTex.repeat.set(50, 28); // tiled fine enough to read as grain rather than visible large tiles, across the 400x220 ground

const groundMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.92,
  metalness: 0.0,
  map: grainTex,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

// ── Trees ─────────────────────────────────────────────────────────────────────
// The canopy is a small cluster of flat, alpha-blended "needle clump" cards
// per tree, arranged in a rough conical taper (wide/low near the trunk,
// narrow/high at the tip) -- replaces the earlier smooth-cone canopy after
// a separate cheap-prototype comparison (see snow-foliage-test.html) showed
// it read as more convincing foliage at effectively the same cost. All
// cards across the whole forest share ONE geometry + ONE material + ONE
// InstancedMesh, so canopy draw-call count is 1 regardless of tree count.
// Cards are NOT true per-frame camera-facing billboards -- this scene's
// camera never moves, so each card's orientation is just baked in once
// (radially outward from the trunk axis, with a bit of individual tilt)
// with DoubleSide rendering as a cheap substitute, rather than paying for
// billboard matrix math in the vertex shader for no real benefit here.
const TREE_COUNT = 360;

// Radius only (not TRUNK_H) increased for bark visibility -- height feeds
// CANOPY_Y_BOTTOM/TIER1_BASE_Y below, so changing it would shift canopy
// positioning and risk reopening the base-band gap work from earlier in
// this project; radius alone doesn't touch any of that.
const TRUNK_H = 1.6, TRUNK_R_TOP = 0.22, TRUNK_R_BOTTOM = 0.32;
const trunkGeo = new THREE.CylinderGeometry(TRUNK_R_TOP, TRUNK_R_BOTTOM, TRUNK_H, 6, 1);
trunkGeo.translate(0, TRUNK_H / 2, 0); // base sits at local y=0 so it starts right at the ground

const CANOPY_GREEN = new THREE.Color(0x6a8560); // lightened from 0x44543f -- same hue/ratio (G>R>B), just brighter, so bare-tree texture/shape reads clearly at zero snow coverage instead of going dark and hard to make out
const CANOPY_SNOW  = new THREE.Color(0xeef3f2); // pale snow-dusted tips

// Same overall canopy envelope the earlier two-tier cones used, kept only
// as reference dimensions for scattering card slots through -- there's no
// cone geometry being built from these any more.
const TIER1_R = 0.85, TIER1_H = 1.7, TIER1_BASE_Y = TRUNK_H * 0.5;
const TIER2_R = 0.55, TIER2_H = 1.5, TIER2_BASE_Y = TIER1_BASE_Y + TIER1_H * 0.55;
const CANOPY_Y_BOTTOM = TIER1_BASE_Y;
const CANOPY_Y_TOP = TIER2_BASE_Y + TIER2_H;
const CANOPY_Y_SPAN = CANOPY_Y_TOP - CANOPY_Y_BOTTOM;

// Applied as an instance-transform stretch (Y only, not X/Z) rather than a
// geometry change -- taller trunk+canopy together, without proportionally
// widening the canopy too, which reads as more looming/immersive rather
// than just "the same tree but bigger". Needed here (not just at the tree-
// placement loop below) because it also has to be baked into each card
// slot's own local Y values -- see the shear note on CARD_SLOT_MATRICES.
const HEIGHT_MULT = 1.65;

// Card "slots": one shared layout reused by every tree (like the old cone
// geometry was identical for every tree) -- randomized once at load via the
// same seeded rng as everything else, not per-tree, so this stays a single
// small array rather than 360 separate layouts.
// Reverted the continuous "bulge" distribution (sixth pass) back to this
// discrete-band structure -- the bulge narrowed the radius at BOTH ends
// including the bottom, which made the actual reported problem (bare gap
// near the trunk) worse, not better: the old bottom band was deliberately
// the WIDEST (0.95), and shrinking it toward a point was exactly backwards.
// Trees also read as tall/thin/feathery rather than conifer-shaped, since
// spreading the same 130-card budget across a continuous range put fewer
// cards at any given height than concentrating them into bands did. Two
// small, targeted changes from the original band values (not a shape
// redesign) address the two real complaints instead:
// - First band's yFrac 0.06 -> 0.0: reaches all the way down to
//   CANOPY_Y_BOTTOM instead of stopping short of it, closing the gap
//   before the bare-trunk transition. Still the widest band (0.95), so
//   width there is untouched.
// - Per-card Y jitter +-0.05 -> +-0.16: was tiny relative to the ~0.4
//   unit gap between band centers, so bands rendered as visually distinct
//   rings once cards got this large. Wider jitter lets adjacent bands'
//   cards interleave vertically and break up the tiered look, without
//   touching the proven per-band radius taper.
// sizeMult (default 1.0) scales w/h for just one band at a time -- a
// targeted fix for lingering bare-trunk gaps at specific heights, without
// touching the size/density of every other band. First applied to the
// base band (fixed a gap right at ground level); the SECOND band (0.22)
// gets the same treatment here, for a distinct gap reported partway up
// the trunk, below the main canopy mass -- a different zone than the
// base band already fixed.
// band0's sizeMult raised again here (1.35->1.9) -- widening
// TRUNK_R_TOP/BOTTOM elsewhere in this file made the trunk's existing
// (unchanged) band0 angular gaps show noticeably more bare trunk through
// them than before, since the same gap now has more trunk width behind it.
// Confirmed via the same angular-gap analysis used for the tree-9
// investigation earlier in this project, run across all 360 trees: ~22
// trees have the camera bearing landing inside band0's ~30-degree
// worst-case gap, closely matching a reported gap on a tree left of the
// frame's center. Deliberately NOT touching band0's `count` here (unlike
// earlier band-boost fixes in this project) -- CARD_SLOTS is built from
// the same shared seeded RNG stream that scatterTrees/treePlacements draws
// from immediately afterward, and changing a loop's ITERATION COUNT (not
// just the multiplier applied to each already-drawn value) would shift
// every subsequent draw, silently reshuffling tree placement again --
// exactly the class of bug just found and fixed for the bark texture
// above. sizeMult alone doesn't change how many range() calls this loop
// makes, only what they're multiplied by, so it's free of that risk.
const CARD_BANDS = [
  { yFrac: 0.00, radius: TIER1_R * 0.95, count: 42, sizeMult: 1.9 },
  { yFrac: 0.22, radius: TIER1_R * 0.80, count: 36, sizeMult: 1.3 },
  { yFrac: 0.38, radius: TIER1_R * 0.60, count: 24 },
  { yFrac: 0.55, radius: TIER2_R * 0.90, count: 20 },
  { yFrac: 0.72, radius: TIER2_R * 0.60, count: 16 },
  { yFrac: 0.90, radius: TIER2_R * 0.25, count: 11 },
];
const CARD_SLOTS = [];
for (const band of CARD_BANDS) {
  const sizeMult = band.sizeMult || 1.0;
  for (let k = 0; k < band.count; k++) {
    const angle = (k / band.count) * Math.PI * 2 + range(-0.3, 0.3);
    const y = CANOPY_Y_BOTTOM + band.yFrac * CANOPY_Y_SPAN + range(-0.16, 0.16);
    const r = band.radius * range(0.85, 1.15);
    // Sized against the vertical gap between bands (not the whole canopy
    // radius) -- modest, roughly clump-sized absolute dimensions, small and
    // numerous enough to overlap into continuous-looking foliage. Base
    // range nudged up slightly (was 0.52-0.80 / 0.48-0.70) -- with the
    // per-tree yaw fix, coverage now varies naturally tree to tree instead
    // of every tree sharing the same weak point, but that means the worst-
    // case low end of that natural variance can still show a thin tree
    // here and there. Raising the floor a bit (not a targeted band
    // override this time) tightens that low end across the board.
    const w = range(0.58, 0.86) * sizeMult;
    const h = range(0.53, 0.76) * sizeMult;
    // Small random lean/roll per card (not just the shared yaw below) --
    // uniform flat cards all tilted identically within a band read as
    // repeated stickers; a bit of individual tilt variety breaks that up.
    const tiltX = range(-0.3, 0.3);
    const tiltZ = range(-0.25, 0.25);
    // Drives the snow-coverage gradient (see cardMat.onBeforeCompile),
    // computed from THIS card's own actual (jittered) Y position -- not
    // the band's nominal yFrac, which used to be used directly and broke
    // once the base band's yFrac became 0.0. pow(aHeightT, exponent) is
    // mathematically exactly 0 at aHeightT=0 for any exponent (any
    // buildup level) -- that's the intentional "base ring stays pure
    // green" trick from the original cone geometry, but it's wrong here:
    // cards whose nominal yFrac lands exactly on that singularity get
    // permanently locked at 0% coverage. Flooring at 0.05 (and computing
    // per-card rather than per-band, so it also reflects each card's own
    // jitter) keeps every card able to build up snow like the rest of the
    // canopy, while the lowest cards still correctly read as "least
    // covered" relative to the top.
    const heightT = Math.min(1, Math.max(0.05, (y - CANOPY_Y_BOTTOM) / CANOPY_Y_SPAN));
    CARD_SLOTS.push({ y, angle, r, w, h, tiltX, tiltZ, heightT });
  }
}
// Tree 9 brute-force base-band fix: the cardYaw nudge above closed most of
// this one tree's persistent base-band gap but not all of it, and rather
// than keep chasing incremental angular adjustments, add a dedicated ring
// of extra, oversized base-band cards -- evenly spaced with NO angular
// jitter (gap-free by construction, unlike the jittered main bands) --
// appended to every tree's slot layout. They're only given nonzero size
// for tree 9 (see the extraFor9 handling in the tree loop below); every
// other tree renders/raycasts these as zero-size, effectively free,
// invisible instances, so this is a true single-tree override, not a
// global density change. Uses its own separate seeded RNG (range9), not
// the shared rng/range stream, so appending these slots here -- before the
// per-tree loop -- doesn't shift any tree's scale, rotY, cardYaw, or tint,
// all of which are drawn later from the untouched shared stream.
const rng9 = mulberry32(0x5f10009);
const range9 = (a, b) => a + rng9() * (b - a);
const EXTRA_BASE9_COUNT = 40;
{
  const band = CARD_BANDS[0];
  for (let k = 0; k < EXTRA_BASE9_COUNT; k++) {
    const angle = (k / EXTRA_BASE9_COUNT) * Math.PI * 2; // no jitter -- evenly spaced, gap-free by construction
    const y = CANOPY_Y_BOTTOM + band.yFrac * CANOPY_Y_SPAN + range9(-0.16, 0.16);
    const r = band.radius * range9(0.85, 1.15);
    const w = range9(1.0, 1.3);  // deliberately overkill -- brute-force closure, not a subtle tweak
    const h = range9(0.9, 1.15);
    const tiltX = range9(-0.3, 0.3);
    const tiltZ = range9(-0.25, 0.25);
    const heightT = Math.min(1, Math.max(0.05, (y - CANOPY_Y_BOTTOM) / CANOPY_Y_SPAN));
    CARD_SLOTS.push({ y, angle, r, w, h, tiltX, tiltZ, heightT, extraFor9: true });
  }
}
const CARDS_PER_TREE = CARD_SLOTS.length; // 189 (149 + 40 tree-9-only extras, zero-size for every other tree)

// Local (tree-space) transform for each slot, shared across every tree --
// composed with each tree's own placement matrix at instance-build time.
// HEIGHT_MULT is baked in HERE (position.y and scale.y), not into the
// tree-level matrix this gets composed with, and that placement matters:
// three's Object3D.updateMatrix() always builds T*R*S with scale applied
// innermost (to the raw local vertices, before rotation touches them),
// which is shear-free by construction regardless of whether the scale is
// uniform. The earlier version instead baked HEIGHT_MULT into the TREE's
// own matrix (as a non-uniform scale on scale.y) and then multiplied that
// by this slot matrix afterward -- multiplying a non-uniformly-scaled
// matrix by a SEPARATE matrix that has its own independent rotation
// applies that scale to an already-rotated frame, which genuinely shears
// the result (confirmed by checking the composed matrix's basis columns
// for orthogonality -- they weren't orthogonal). That shear left the
// translation (anchor point) reading as correct on inspection while the
// card's actual rendered shape/extent flew off away from it -- exactly
// the "canopy floating disconnected from its trunk" bug. Keeping the only
// non-uniform scale in the whole tree+card composition chain at this one
// innermost T*R*S spot avoids it everywhere downstream (including the
// dusting-shake matrices in updateShakes, which compose on top of this).
const slotDummy = new THREE.Object3D();
const CARD_SLOT_MATRICES = CARD_SLOTS.map(s => {
  slotDummy.position.set(Math.cos(s.angle) * s.r, s.y * HEIGHT_MULT, Math.sin(s.angle) * s.r);
  slotDummy.rotation.set(s.tiltX, s.angle, s.tiltZ); // radially outward (yaw) plus a small individual lean/roll
  slotDummy.scale.set(s.w, s.h * HEIGHT_MULT, 1);
  slotDummy.updateMatrix();
  return slotDummy.matrix.clone();
});

// Needle-clump silhouette: soft radial-gradient blobs (fade to zero alpha
// at the edge, rather than a hard-edged fill) so real alpha blending can
// genuinely feather each card into whatever's behind it, plus needle
// strokes poking past the blob extent for a spiky rather than smooth edge,
// and a few soft holes punched through so the interior isn't one solid
// mass. Blobs/strokes are painted in varying gray levels (not flat white)
// -- the shader multiplies the snow-coverage color by this grayscale value
// (see the fragment patch below) instead of replacing it outright, so each
// card gets real internal tonal variation instead of one flat color.
function makeNeedleClusterTexture(size){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;

// directly (not re-running scatterTrees or consuming any extra range()
// draws) so no other tree's placement is affected.
treePlacements[9] = { x: -12.58454581272635, z: -39.86683323009889 };
// Tree 346: after moving tree 9 back, the frame's left side still looked
// dominated by one oversized-looking tree -- confirmed (by isolating a
// same-camera before/after crop) that a separate, ordinary neighboring
// tree (346, 149 cards, nothing anomalous) sits almost exactly where tree
// 9 used to be and was the actual remaining cause. Same treatment: pushed
// back along its own existing bearing to ~50 units, re-validated against
// MIN_SPACING for every other tree (now including tree 9's new position).
treePlacements[346] = { x: -8.890171657648896, z: -39.79963279848468 };
// Moving 9 and 346 alone didn't fix the visible dominance either -- a
// screen-region scan turned up a whole cluster of even-closer, otherwise
// ordinary trees blended into the same patch of frame: 350 (13.2 units)
// and 281 (8.4 units, essentially right in front of the camera), plus 169
// (25.1, noticeably under the ~29-unit local median). Same treatment for
// all three, applied in sequence so each later placement is validated
// against the earlier ones too.
treePlacements[281] = { x: -2.7999361512911047, z: -38.18645063716067 };
treePlacements[350] = { x: -15.576773008980547, z: -40.07428469916258 };
treePlacements[169] = { x: 0.4231123875699341, z: -38.67492343526442 };

// Bring the whole forest closer to the camera, uniformly -- a plain
// translation applied to every tree's z AFTER scatterTrees() and all the
// per-tree overrides above have finished, so relative spacing/arrangement
// between every tree is untouched (this is pure post-hoc geometry, not a
// re-scatter, and consumes no RNG draws, so it can't reintroduce the
// draw-order fragility found and fixed earlier in this project). Capped at
// 2.0: the closest a tree is allowed to spawn is z=6 (FIELD_Z_NEAR above),
// only 3 units of z clearance from the camera at z=9 -- a bigger shift
// risks pushing the nearest possible tree past the camera's z-plane
// entirely (behind it, since the camera looks toward -z), so 2.0 leaves a
// safe ~1.3-unit margin while still bringing every tree meaningfully
// closer (proportionally more so for the near trees that matter most).
const FOREST_Z_SHIFT = 2.0;
for (const p of treePlacements) p.z += FOREST_Z_SHIFT;

// Card instances are grouped into one fixed-size block per tree, but the
// BLOCK ORDER is sorted back-to-front by distance from the camera --
// not tree placement order. This is what makes cross-tree occlusion
// correct: cards use depthWrite:false (needed so their soft alpha-blended
// edges actually fade instead of punching a hard silhouette), so
// overlapping transparent fragments from DIFFERENT trees blend in
// whatever order they're drawn in, not by true depth -- without this fix,
// a farther tree's cards could paint over a nearer tree's cards whenever
// it happened to land at a later instance index than the nearer tree.
// Since this scene's camera never moves, a single back-to-front sort
// computed once at load stays correct for the entire session -- a real
// painter's algorithm, exact (not an approximation) specifically because
// the viewpoint is fixed.
const treeRenderOrder = treePlacements
  .map((p, i) => ({ i, distSq: (p.x - camera.position.x) ** 2 + (p.z - camera.position.z) ** 2 }))
  .sort((a, b) => b.distSq - a.distSq)
  .map(e => e.i);
// blockPosOfTree[treeIndex] -> where that tree's card block sits in the
// instance buffer. treeRenderOrder[blockPos] -> treeIndex is the inverse,
// used by handleTap's raycast-hit-to-tree lookup below.
const blockPosOfTree = new Array(treePlacements.length);
treeRenderOrder.forEach((treeIdx, blockPos) => { blockPosOfTree[treeIdx] = blockPos; });

// Per-tree transform WITHOUT rotationY, used only for card instancing --
// cards ignore the trunk's own random yaw (their local slot angles are
// already randomized in CARD_SLOTS, and un-rotating them here avoids
// needing to account for tree rotation in the billboard-substitute facing
// math). Trunk keeps its own randomized rotation via `dummy` below, since
// that doesn't affect a plain cylinder's silhouette anyway. Also reused by
// the dusting-shake effect (see updateShakes below) as the resting pose to
// rotate away from.
const cardTreeMatrices = new Array(treePlacements.length);

const dummy = new THREE.Object3D();
const tint = new THREE.Color();
const _finalMat = new THREE.Matrix4();
for (let i = 0; i < treePlacements.length; i++) {
  const { x, z } = treePlacements[i];
  // Size varies independently of distance (real forests mix tree sizes at
  // any given depth) -- perspective projection alone already makes farther
  // trees read as smaller, so this is on top of that, not instead of it.
  const scale = range(0.8, 1.35);
  const rotY = range(0, Math.PI * 2);

  dummy.position.set(x, 0, z);
  dummy.rotation.set(0, rotY, 0);
  dummy.scale.set(scale, scale * HEIGHT_MULT, scale);
  dummy.updateMatrix();
  trunkMesh.setMatrixAt(i, dummy.matrix);

  // Cards get their OWN random yaw (cardYaw), independent of the trunk's
  // rotY -- NOT identity as before. The shared CARD_SLOTS layout has real
  // angular gaps within a band (verified: up to ~30-36 degrees in one
  // stretch, an artifact of random per-slot angle jitter around evenly-
  // spaced base angles), and since every tree previously used those exact
  // same ABSOLUTE angles with no rotation, every tree's gap pointed the
  // same world direction -- some trees happened to face that gap toward
  // the fixed camera (looked sparse/gappy), others happened to face their
  // densest cluster toward it (looked overly solid), a systematic
  // per-tree inconsistency rather than random noise. Rotating each tree's
  // whole card layout by its own random cardYaw decorrelates which
  // direction each tree's weak/strong point faces, without changing any
  // band's actual size or count. Still uniform scale + pure rotation here
  // (no shear risk, per the earlier fix -- shear only comes from
  // composing non-uniform scale with an independently-rotated child).
  let cardYaw = range(0, Math.PI * 2);
  // Tree-specific override, not a global change: tree 9's random cardYaw
  // happened to align its BASE band's real angular gap almost exactly
  // with the camera's viewing direction from that tree -- measured
  // directly (not assumed): camera bearing 77.8 degrees from this tree,
  // base-band gap spanning 52.7-82.6 degrees, bearing only 4.8 degrees
  // from the nearest edge, deep inside it. Confirmed NOT a shake artifact
  // (already tested and ruled out separately) and not a systemic band
  // issue (every other tested tree's alignment differs) -- a genuine,
  // unlucky coincidence for this one tree specifically. Still calling
  // range() unconditionally above (not skipping it) so every OTHER tree's
  // RNG-derived values (scale, rotY, cardYaw, tint) are completely
  // unaffected by this override -- only tree 9's own already-drawn value
  // gets nudged afterward, well clear of its camera-facing direction.
  if (i === 9) cardYaw += Math.PI * (120 / 180);
  dummy.rotation.set(0, cardYaw, 0);
  dummy.scale.set(scale, scale, scale);
  dummy.updateMatrix();
  cardTreeMatrices[i] = dummy.matrix.clone();

  // Subtle per-tree color jitter (multiplies with each card's own
  // snow-coverage color) so the forest isn't visibly stamped from one
  // identical tree.
  tint.setHSL(0.32 + range(-0.03, 0.03), 0.18 + range(-0.06, 0.06), 0.92 + range(-0.06, 0.04));

  for (let j = 0; j < CARDS_PER_TREE; j++) {
    // Block position (blockPosOfTree[i]), not tree placement index i --
    // see the back-to-front sort comment above.
    const instIdx = blockPosOfTree[i] * CARDS_PER_TREE + j;
    // Raw placement data the vertex shader actually renders from.
    const slot = CARD_SLOTS[j];
    // extraFor9 slots (see CARD_SLOTS build above) only get real size for
    // tree 9 -- every other tree gets w=h=0 here AND in the raycasting
    // matrix below, so the extras are truly invisible and untappable
    // everywhere except the one tree they were added to fix.
    const isExtraHidden = slot.extraFor9 && i !== 9;
    const renderW = isExtraHidden ? 0 : slot.w;
    const renderH = isExtraHidden ? 0 : slot.h;

    // instanceMatrix: kept correct (raycasting only -- see the shader
    // patch above for why rendering no longer reads this). extraFor9
    // slots can't reuse the shared CARD_SLOT_MATRICES here since that
    // array bakes one fixed w/h shared by every tree -- this per-instance
    // rebuild is what lets the hitbox actually go to zero for non-9 trees.
    if (slot.extraFor9) {
      dummy.position.set(Math.cos(slot.angle) * slot.r, slot.y * HEIGHT_MULT, Math.sin(slot.angle) * slot.r);
      dummy.rotation.set(slot.tiltX, slot.angle, slot.tiltZ);
      dummy.scale.set(renderW, renderH * HEIGHT_MULT, 1);
      dummy.updateMatrix();
      _finalMat.multiplyMatrices(cardTreeMatrices[i], dummy.matrix);
    } else {
      _finalMat.multiplyMatrices(cardTreeMatrices[i], CARD_SLOT_MATRICES[j]);
    }
    cardMesh.setMatrixAt(instIdx, _finalMat);
    cardMesh.setColorAt(instIdx, tint);
    cardHeightTArr[instIdx] = CARD_SLOTS[j].heightT;
    cardTintArr[instIdx] = range(0.78, 1.18);

    cardPlaceAArr[instIdx*4]   = x;
    cardPlaceAArr[instIdx*4+1] = z;
    cardPlaceAArr[instIdx*4+2] = scale;
    // cardYaw baked in directly (not a separate shader uniform/attribute)
    // -- keeps this consistent with cardTreeMatrices[i] above, which now
    // also carries cardYaw, so raycasting (matrix-based) and rendering
    // (this value, read by the matrix-free vertex shader) agree on where
    // each card actually is.
    cardPlaceAArr[instIdx*4+3] = slot.angle + cardYaw;
    cardPlaceBArr[instIdx*4]   = slot.r;
    cardPlaceBArr[instIdx*4+1] = slot.y;
    cardPlaceBArr[instIdx*4+2] = slot.tiltX;
    cardPlaceBArr[instIdx*4+3] = slot.tiltZ;
    cardSlotSizeArr[instIdx*2] = renderW;
    cardSlotSizeArr[instIdx*2+1] = renderH;
  }
}
// Placements can land short of TREE_COUNT if the field fills up before
// maxAttempts runs out; only the instances actually written above should
// draw, so the instanced mesh count is trimmed to what was really placed.
trunkMesh.count = treePlacements.length;
cardMesh.count = treePlacements.length * CARDS_PER_TREE;
trunkMesh.instanceMatrix.needsUpdate = true;
cardMesh.instanceMatrix.needsUpdate = true;
cardMesh.instanceColor.needsUpdate = true;
cardHeightTAttr.needsUpdate = true;
cardTintAttr.needsUpdate = true;
cardPlaceAAttr.needsUpdate = true;
cardPlaceBAttr.needsUpdate = true;
cardSlotSizeAttr.needsUpdate = true;
// cardGeo's own raw bounding sphere (a small 1x1 plane near the origin)
// doesn't reflect where the 15k+ instances actually sit once scattered
// across the whole forest -- same reasoning as `snow`/`dust` elsewhere in
// this file. Not the cause of the shear bug (that was matrix composition,
// fixed above), but worth being explicit rather than relying on the
// default culling behavior being harmless here.
cardMesh.frustumCulled = false;

scene.add(trunkMesh, cardMesh);

// ── Lanterns (Stage 2: model + placement only, no glow/light yet) ───────────────
// One per tree, instanced the same way the trunk/cards are -- geometry stays
// tiny and low-poly (a single revolved silhouette for the whole metal frame,
// plus a separate cylinder for the glass and a small arc for the handle) so
// 360 more instances cost almost nothing next to the canopy's ~60k cards.
// Split into 3 InstancedMeshes purely by MATERIAL (opaque dark metal vs
// translucent glass) -- draw-call count barely matters at this scale, but
// material count does, and InstancedMesh only supports one material each.
//
// Frame profile (r, y) revolved around Y with THREE.LatheGeometry: a squat
// foot, a thin bottom lip, a narrow waist (deliberately thinner than the
// glass cylinder below, so the glass -- not bare metal -- reads as the
// visible body there, matching the reference photos), a thin top lip, a
// tapered cap, and a small chimney knob.
const LANTERN_FRAME_PROFILE = [
  [0.001, 0.000], [0.062, 0.005], [0.062, 0.030], [0.048, 0.035],
  [0.048, 0.045], [0.025, 0.050], [0.025, 0.140], [0.048, 0.145],
  [0.048, 0.155], [0.060, 0.160], [0.060, 0.170], [0.035, 0.200],
  [0.012, 0.205], [0.012, 0.225], [0.001, 0.230],
].map(([r, y]) => new THREE.Vector2(r, y));
const lanternFrameGeo = new THREE.LatheGeometry(LANTERN_FRAME_PROFILE, 8);
// Sits in the gap between the frame's narrow waist (r=0.025) and its lip
// rings (r=0.048) -- a plain cylinder is enough, real refraction isn't
// needed per the brief.
const lanternGlassGeo = new THREE.CylinderGeometry(0.044, 0.044, 0.10, 8);
lanternGlassGeo.translate(0, 0.095, 0); // spans y 0.045-0.145, matching the frame's lip-to-lip gap
// A half-circle arc (arc=PI) starting at +X and ending at -X, sweeping
// through +Y in between -- exactly a bucket-handle shape with no rotation
// needed. radialSegments=4 gives a faceted (not round) wire, which is fine
// at this size and matches the "keep it low-poly" brief. Radius 0.085 (not
// a smaller value closer to the cap's own 0.06 width) so the arc peaks
// above the chimney knob (y=0.225) rather than under it -- an earlier,
// smaller radius left the handle shorter than the knob, backwards from the
// reference photos where the handle is clearly the tallest feature.
const lanternHandleGeo = new THREE.TorusGeometry(0.085, 0.007, 4, 8, Math.PI);
lanternHandleGeo.translate(0, 0.165, 0); // feet planted at the cap's base width

// Lightened from an initial 0x2b2a2e -- verified via gl.readPixels at
// night that the darker tone crushed to literal (0,0,0), the same
// low-poly-facet-vs-directional-light issue found and fixed for the
// trunk earlier. Same standard applied here: this is a modest, good-faith
// brighten (not chasing a some-facet-is-always-near-zero guarantee that
// the trunk fix didn't achieve either), enough to read as dark metal in
// daylight while staying distinguishable, not pure black, at night.
const lanternMetalMat = new THREE.MeshStandardMaterial({ color: 0x4a4850, roughness: 0.55, metalness: 0.4 });
// Deliberately NOT part of the day/night lerp system above -- Stage 2 asks
// for the lantern to just be visible, unlit, in both states; the shared
// scene lights (hemiLight/sky) already dim it appropriately at night the
// same way they do the trunk, with no extra wiring needed here.
const lanternGlassMat = new THREE.MeshStandardMaterial({
  color: 0xd9a86c, roughness: 0.25, metalness: 0.0,
  transparent: true, opacity: 0.6, side: THREE.DoubleSide,
});

const lanternFrameMesh = new THREE.InstancedMesh(lanternFrameGeo, lanternMetalMat, TREE_COUNT);
const lanternGlassMesh = new THREE.InstancedMesh(lanternGlassGeo, lanternGlassMat, TREE_COUNT);
const lanternHandleMesh = new THREE.InstancedMesh(lanternHandleGeo, lanternMetalMat, TREE_COUNT);
// Lanterns don't move in this stage either -- same StaticDrawUsage hint
// already used for trunkMesh above.
lanternFrameMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
lanternGlassMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
lanternHandleMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

// Own seeded RNG, isolated from the shared rng()/range() stream -- this
// runs AFTER treePlacements/scatterTrees/the tree-placement loop are fully
// finished, but keeping every new randomness source on its own stream
// (same pattern as rng9/rngBark above) means future edits here can never
// accidentally reshuffle tree placement again, regardless of where in the
// file this code ends up.
const rngLantern = mulberry32(0x5f1000d);
const rangeLantern = (a, b) => a + rngLantern() * (b - a);

const lanternDummy = new THREE.Object3D();
for (let i = 0; i < treePlacements.length; i++) {
  const { x, z } = treePlacements[i];
  // Offset from the trunk center, not centered/floating on it -- far enough
  // to clear the trunk's own radius (max 0.32) with margin, close enough to
  // still read as "resting at the base of this tree".
  const dist = rangeLantern(0.38, 0.62);
  const angle = rangeLantern(0, Math.PI * 2);
  const lx = x + Math.cos(angle) * dist;
  const lz = z + Math.sin(angle) * dist;
  // Range shifted up (was 0.85-1.2) for a modest overall size increase --
  // same width, same rng() draw position in the sequence, so dist/angle/yaw
  // for every tree are completely unaffected.
  const lanternScale = rangeLantern(1.0, 1.45);
  const lanternYaw = rangeLantern(0, Math.PI * 2);
  // Unlike the trunk (placed flat at y=0 regardless of undulation -- fine
  // for something 1.6+ units tall), the lantern is only ~0.2 units tall,
  // small enough that the ground's own +-1.5 unit undulation would bury or
  // float it entirely if not accounted for.
  const ly = groundHeightAt(lx, lz);

  lanternDummy.position.set(lx, ly, lz);
  lanternDummy.rotation.set(0, lanternYaw, 0);
  lanternDummy.scale.setScalar(lanternScale);
  lanternDummy.updateMatrix();
  lanternFrameMesh.setMatrixAt(i, lanternDummy.matrix);
  lanternGlassMesh.setMatrixAt(i, lanternDummy.matrix);
  lanternHandleMesh.setMatrixAt(i, lanternDummy.matrix);
}
lanternFrameMesh.count = treePlacements.length;
lanternGlassMesh.count = treePlacements.length;
lanternHandleMesh.count = treePlacements.length;
lanternFrameMesh.instanceMatrix.needsUpdate = true;
lanternGlassMesh.instanceMatrix.needsUpdate = true;
lanternHandleMesh.instanceMatrix.needsUpdate = true;
scene.add(lanternFrameMesh, lanternGlassMesh, lanternHandleMesh);

// ── Falling snow ──────────────────────────────────────────────────────────────
// Every particle's position is a closed-form function of uTime (straight
// fall + wraparound loop + a per-particle sine-based horizontal drift/
// tumble), computed entirely in the vertex shader -- the CPU only ever
// updates one uniform per frame, regardless of particle count. That's the
// point of doing it this way rather than updating a position array in JS
// each frame: a JS-side loop over thousands of particles every frame would
// scale badly toward "blizzard" counts, while GPU-side per-vertex math for
// even tens of thousands of points is trivial. One THREE.Points object, one
// draw call for the entire snowfall regardless of density -- no per-pixel
// search of any kind, unlike rain.html's droplets (which need the
// occupancy-gate machinery specifically because they sample/bend the
// background; these don't).
const SNOW_COUNT = 3000; // <- the single density dial: light flurries to blizzard-thick, just change this
// Sized to the camera's actual view cone, not just copied from the tree
// field's width -- measured directly (via the real projection matrix)
// that with the old values only ~13% of particles were ever inside the
// frustum at a given moment: SNOW_Z_NEAR=20 put ~9% of particles behind
// the camera entirely (it sits at z=9), and SNOW_X_HALF=95 was far wider
// than the frustum ever needs even at the farthest used depth (measured
// half-width there: ~28 in portrait). Narrowed to comfortably cover a
// landscape-oriented view too (a wider aspect ratio needs a wider spread
// than portrait does), rather than shrinking all the way to the
// portrait-only minimum -- this is about not wasting most of the density
// budget off-frustum, not about trimming as far as possible.
const SNOW_X_HALF = 70;
const SNOW_Z_NEAR = 8, SNOW_Z_FAR = -100; // near bound just in front of the camera (was 20, behind it) -- some snow still drifts close to the lens, none wasted spawning where it can never be seen
// -2 (was -3) is just a loop floor for the time-wraparound math below, not
// where flakes actually vanish any more -- see uGroundHeight in the vertex
// shader, which fades each flake out right at the REAL (undulating)
// ground surface instead. Tightened slightly since flakes now go invisible
// well before reaching this floor anyway (the ground's lowest point is
// ~-1.18); a much deeper floor would just mean more of each particle's
// cycle spent invisible underground before it loops back to the top.
const SNOW_Y_TOP = 34, SNOW_Y_BOTTOM = -2;

const snowGeo = new THREE.BufferGeometry();
// "position" here is a fixed per-particle ANCHOR (x/z spawn column, y
// unused/zeroed), not the live falling position -- the actual Y each frame
// is computed in the shader from uTime, never written back to this array.
const anchors  = new Float32Array(SNOW_COUNT * 3);
const fallInfo = new Float32Array(SNOW_COUNT * 2); // x: fall speed, y: time-phase offset (desyncs particles so they don't all fall in lockstep)
const drift    = new Float32Array(SNOW_COUNT * 4); // x: drift amp (X axis), y: drift freq, z: drift phase, w: drift amp (Z axis)
const sizes    = new Float32Array(SNOW_COUNT);

for (let i = 0; i < SNOW_COUNT; i++) {
  anchors[i*3+0] = range(-SNOW_X_HALF, SNOW_X_HALF);
  anchors[i*3+1] = 0;
  anchors[i*3+2] = range(SNOW_Z_FAR, SNOW_Z_NEAR);

  fallInfo[i*2+0] = range(2.2, 4.2);
  fallInfo[i*2+1] = range(0, 1000);

  drift[i*4+0] = range(0.3, 1.1);
  drift[i*4+1] = range(0.15, 0.45);
  drift[i*4+2] = range(0, Math.PI * 2);
  drift[i*4+3] = range(0.2, 0.7);

  sizes[i] = range(2.0, 5.0);
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(anchors, 3));
snowGeo.setAttribute('aFall', new THREE.BufferAttribute(fallInfo, 2));
snowGeo.setAttribute('aDrift', new THREE.BufferAttribute(drift, 4));
snowGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

const snowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uYTop: { value: SNOW_Y_TOP },
    uYBottom: { value: SNOW_Y_BOTTOM },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uFogColor: { value: new THREE.Color(SKY_COLOR) },
    uFogNear: { value: scene.fog.near },
    uFogFar: { value: scene.fog.far },
  },
  transparent: true,
  depthWrite: false, // standard for soft transparent sprites -- avoids z-fighting/sorting artifacts between overlapping flakes, while depthTest (left on, default) still lets trees correctly occlude snow behind them
  vertexShader: `
    attribute vec2 aFall;
    attribute vec4 aDrift;
    attribute float aSize;
    uniform float uTime, uYTop, uYBottom, uPixelRatio;
    varying float vFogDepth;
    varying float vAlpha;

    // Exactly mirrors the ground plane's own displacement formula (see the
    // JS that builds groundGeo) -- so "the ground surface at this x/z" is
    // known here in closed form too, without needing to read back the
    // actual mesh. Keeping the two in sync is why this is a literal copy
    // rather than an approximation.
    float groundHeight(vec2 xz){
      float x = xz.x, z = xz.y;
      return sin(x*0.035 + 1.0) * 0.35
           + sin(z*0.045 + 2.4) * 0.40
           + sin((x+z)*0.021 + 0.7) * 0.50
           + sin((x-z)*0.013 + 3.1) * 0.30;
    }

    void main(){
      float span = uYTop - uYBottom;
      float fallT = mod(uTime * aFall.x + aFall.y, span);
      float y = uYTop - fallT;

      // Gentle wind-blown wander rather than a straight drop -- two offset
      // sine waves (X and Z, different frequency/phase) trace a slow
      // lissajous-style curve as the flake falls, read as "tumbling"
      // rather than sliding on rails.
      float driftX = sin(uTime * aDrift.y + aDrift.z) * aDrift.x;
      float driftZ = cos(uTime * aDrift.y * 0.8 + aDrift.z * 1.3) * aDrift.w;
      float worldX = position.x + driftX, worldZ = position.z + driftZ;

      // How far this flake sits above the REAL (undulating) ground surface
      // directly below its current (drifted) x/z -- not the fixed loop
      // floor. Fades out smoothly over the last little bit of the approach
      // rather than popping, and reaches exactly 0 once it reaches the
      // surface, so it visibly settles onto the ground instead of phasing
      // through it. No accumulation/depth change -- the ground itself
      // never moves, this only ever hides the flake; the same particle
      // budget just keeps recycling from the top once fallT wraps.
      float groundY = groundHeight(vec2(worldX, worldZ));
      float aboveGround = y - groundY;
      float landFade = smoothstep(0.0, 0.6, aboveGround);
      // Once landed, keep the point pinned right at the surface rather
      // than letting it keep sinking (invisibly) toward uYBottom -- purely
      // cosmetic since alpha is already 0 there, just avoids rendering a
      // fully-transparent point far below the ground for no reason.
      y = max(y, groundY);

      vec3 pos = vec3(worldX, y, worldZ);
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;

      float dist = -mvPosition.z;
      gl_PointSize = clamp(aSize * uPixelRatio * (50.0 / max(dist, 3.0)), 1.0, 40.0);
      vFogDepth = dist;

      // Fade in at the top of the fall span so a particle never visibly
      // pops into existence mid-air right after respawning.
      float fadeIn = smoothstep(0.0, span * 0.06, fallT);
      vAlpha = fadeIn * landFade;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor; uniform float uFogNear, uFogFar;
    varying float vFogDepth; varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.35, d); // soft round sprite, no texture needed
      if (shape < 0.01) discard;
      float fog = smoothstep(uFogNear, uFogFar, vFogDepth);
      vec3 col = mix(vec3(1.0), uFogColor, fog * 0.7); // distant flakes cool/pale toward the fog color, same cue the trees get
      float alpha = shape * vAlpha * (1.0 - fog * 0.85);
      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const snow = new THREE.Points(snowGeo, snowMat);
// The geometry's own bounding sphere is computed from the static anchor
// positions (y=0 for all of them), which doesn't reflect the actual
// y:[uYBottom,uYTop] range the shader moves particles through -- automatic
// frustum culling would use that stale bounding sphere and could cull the
// whole snowfall incorrectly. Positions are cheap to compute either way, so
// just render it unconditionally rather than trying to keep a manual
// bounding volume in sync.
snow.frustumCulled = false;
scene.add(snow);

// ── Tap-to-dust-off ───────────────────────────────────────────────────────────
// Tapping a tree resets its aResetTime (see cardMat.onBeforeCompile above)
// so its own coverage curve restarts, independently of every other tree,
// plus a brief particle burst -- spread across the whole canopy (see
// treeCardOrigin/spawnDustBurst below), not just the exact tap point, so it
// reads as the whole tree shedding snow rather than one poked spot -- to
// sell "snow flicking off branches". The burst is a small fixed pool of
// points recycled round-robin across taps -- taps are rare, human-paced
// events, so there's no need for the "thousands of particles" GPU-only
// discipline the falling snow needed; a tiny CPU write of a few dozen
// values per tap is negligible.
// Particle count AND per-particle size/speed scale with the tree's snow
// coverage at the moment of tapping, using the same tier boundaries as the
// tap-count system (applyTap): 66-100% biggest, 33-66% medium, 15-33%
// smallest, 0-15% no burst at all (handleTap simply skips spawning below
// that threshold, same as it already skips triggering anything else).
// Counts raised and size multipliers cut again, well beyond the previous
// pass (which wasn't nearly enough per explicit feedback) -- particle
// counts roughly 3x higher again, size multipliers roughly 2.5x smaller
// again, so bursts read as fine/powdery rather than "more dots". Speed
// multipliers below are untouched, not part of this request.
const DUST_TIER_PARTICLES  = { 1: 120, 2: 260, 3: 450 };
const DUST_TIER_SIZE_MULT  = { 1: 0.12, 2: 0.16, 3: 0.2 };
const DUST_TIER_SPEED_MULT = { 1: 0.8, 2: 1.0, 3: 1.25 };
const DUST_MAX_TIER_PARTICLES = 450;
const DUST_MAX_CONCURRENT = 4; // a handful of taps in quick succession can be in flight at once without visibly stealing each other's particles
const DUST_COUNT = DUST_MAX_TIER_PARTICLES * DUST_MAX_CONCURRENT;
const DUST_DURATION = 0.9; // seconds -- brief, per the brief's "keep it brief"

const dustOrigins = new Float32Array(DUST_COUNT * 3);
const dustVel = new Float32Array(DUST_COUNT * 3);
const dustSize = new Float32Array(DUST_COUNT);
// Very negative, not 0 -- with aStartTime=0, a fresh page load (uTime≈0)
// would read as "mid-burst at t≈0" and every dust slot would flash visible
// at the origin the instant the scene loads. This keeps every slot's
// elapsed time (uTime - aStartTime) enormous, and therefore invisible
// (past uDustDuration), until an actual tap writes a real start time.
const DUST_INACTIVE_START = -1e6;
const dustStart = new Float32Array(DUST_COUNT).fill(DUST_INACTIVE_START);
// position/vel/size are no longer randomized once per pool slot at load --
// spawnDustBurst now writes fresh values (origin spread across the canopy,
// tier-scaled speed/size) every time a slot is recycled, so their initial
// contents here never actually get rendered (dustStart keeps them invisible
// until a real spawn writes all four together).
const dustGeo = new THREE.BufferGeometry();
const dustPosAttr = new THREE.BufferAttribute(dustOrigins, 3);
const dustStartAttr = new THREE.BufferAttribute(dustStart, 1);
const dustVelAttr = new THREE.BufferAttribute(dustVel, 3);
const dustSizeAttr = new THREE.BufferAttribute(dustSize, 1);
dustPosAttr.setUsage(THREE.DynamicDrawUsage);
dustStartAttr.setUsage(THREE.DynamicDrawUsage);
dustVelAttr.setUsage(THREE.DynamicDrawUsage); // now rewritten per spawn (tier-scaled speed), unlike the old fixed-per-slot version
dustSizeAttr.setUsage(THREE.DynamicDrawUsage); // now rewritten per spawn (tier-scaled size), unlike the old fixed-per-slot version
dustGeo.setAttribute('position', dustPosAttr);
dustGeo.setAttribute('aVel', dustVelAttr);
dustGeo.setAttribute('aStartTime', dustStartAttr);
dustGeo.setAttribute('aSize', dustSizeAttr);

const dustMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uDuration: { value: DUST_DURATION },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec3 aVel;
    attribute float aStartTime;
    attribute float aSize;
    uniform float uTime, uDuration, uPixelRatio;
    varying float vAlpha;
    void main(){
      float t = uTime - aStartTime;
      vec3 pos = position;
      float alpha = 0.0;
      if (t >= 0.0 && t < uDuration) {
        vec3 gravity = vec3(0.0, -9.0, 0.0);
        pos = position + aVel * t + 0.5 * gravity * t * t;
        float fadeIn = smoothstep(0.0, uDuration * 0.08, t);
        float fadeOut = 1.0 - smoothstep(uDuration * 0.45, uDuration, t);
        alpha = fadeIn * fadeOut;
      }
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      float dist = -mvPosition.z;
      gl_PointSize = clamp(aSize * uPixelRatio * (50.0 / max(dist, 3.0)), 1.0, 30.0);
      vAlpha = alpha;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.35, d);
      if (shape < 0.01) discard;
      gl_FragColor = vec4(1.0, 1.0, 1.0, shape * vAlpha * 0.9);
    }
  `,
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled = false; // same reasoning as `snow` above -- shader-displaced positions aren't reflected in the geometry's static bounding sphere
scene.add(dust);

// Approximates a card slot's world position -- mirrors the vertex shader's
// own placement formula (cardMat.onBeforeCompile above) but evaluated once
// in plain JS at spawn time, using the card's mid-height point (position.y
// = 0.5 in shader terms) as a representative origin. Tilt/shake rotation is
// deliberately skipped: this only needs to land visually within the
// canopy's volume for a burst origin, not match a rendered card exactly.
function treeCardOrigin(treeIdx, slotJ){
  const idx = blockPosOfTree[treeIdx] * CARDS_PER_TREE + slotJ;
  const treeX = cardPlaceAArr[idx*4], treeZ = cardPlaceAArr[idx*4+1], treeScale = cardPlaceAArr[idx*4+2], slotAngle = cardPlaceAArr[idx*4+3];
  const slotRadius = cardPlaceBArr[idx*4], slotY = cardPlaceBArr[idx*4+1];
  const cardH = cardSlotSizeArr[idx*2+1];
  const midY = 0.5 * cardH * HEIGHT_MULT;
  return {
    x: Math.cos(slotAngle) * slotRadius * treeScale + treeX,
    y: (midY + slotY * HEIGHT_MULT) * treeScale,
    z: Math.sin(slotAngle) * slotRadius * treeScale + treeZ,
  };
}

let dustCursor = 0;
// tier: 1 (smallest) / 2 (medium) / 3 (biggest), from applyTap's per-tap
// coverage check -- see the tier table above. Each particle gets its own
// random canopy slot as its origin (not the tap point), so the burst reads
// as the whole tree shedding snow.
function spawnDustBurst(treeIdx, tier){
  const count = DUST_TIER_PARTICLES[tier];
  const sizeMult = DUST_TIER_SIZE_MULT[tier];
  const speedMult = DUST_TIER_SPEED_MULT[tier];
  for (let k = 0; k < count; k++){
    const j = dustCursor;
    dustCursor = (dustCursor + 1) % DUST_COUNT;
    const slotJ = Math.floor(rng() * CARDS_PER_TREE);
    const origin = treeCardOrigin(treeIdx, slotJ);
    dustPosAttr.setXYZ(j, origin.x, origin.y, origin.z);
    dustStartAttr.setX(j, simTime);
    const theta = rng() * Math.PI * 2;
    const speedXZ = range(0.6, 2.2) * speedMult;
    dustVelAttr.setXYZ(j, Math.cos(theta) * speedXZ, range(0.8, 2.6) * speedMult, Math.sin(theta) * speedXZ);
    dustSizeAttr.setX(j, range(2.0, 4.5) * sizeMult);
  }
  dustPosAttr.needsUpdate = true;
  dustStartAttr.needsUpdate = true;
  dustVelAttr.needsUpdate = true;
  dustSizeAttr.needsUpdate = true;
}

// ── Multi-tap dusting state machine ──────────────────────────────────────────
// Coverage is the sum of two things running concurrently: natural time-based
// buildup (still just the shader's existing `uBuildupMax * min(1, (uTime -
// aResetTime)/uBuildupSpan)` formula, completely unchanged) and cumulative
// removal from taps. Rather than track "removed" as a separate quantity fed
// into the shader, every tap RE-ANCHORS aResetTime to whatever value makes
// that same unchanged formula produce the desired reduced coverage right
// now -- the same trick the old single-tap reset already used (aResetTime =
// now, i.e. "make coverage 0 right now"), just solved for an arbitrary
// target level instead of only 0. The shader needs zero new code for this;
// only the JS deciding what number to write changes.
const TAP_COOLDOWN = 0.5; // seconds -- per tree (one tapState per tree index, since a tap on any of that tree's cards counts as tapping the whole tree)
const TAP_FADE_DURATION = 0.25; // seconds -- how long a single tap's removal takes to visibly settle, rather than snapping instantly
const tapState = new Array(treePlacements.length).fill(null); // lazily created per tree on first tap: { tapsRemaining, perTapRemoval, lastTapTime }

// Mirrors the shader's coverage formula exactly (see cardMat.onBeforeCompile)
// -- must stay in sync if that formula ever changes.
function coverageNow(i, now){
  const elapsed = Math.max(0, now - resetTimeAttr[i]);
  const elapsedNorm = Math.min(1, elapsed / SNOW_BUILDUP_SPAN);
  return SNOW_BUILDUP_MAX * elapsedNorm;
}

// Writes a tree's resetTime AND mirrors it into every one of that tree's
// card instances -- resetTimeAttr stays the single source of truth for JS-
// side coverage bookkeeping (coverageNow/applyTap), cardResetTimeAttr is
// purely the GPU-facing copy the shader actually reads.
function writeTreeResetTime(i, value){
  resetTimeAttr[i] = value;
  const base = blockPosOfTree[i] * CARDS_PER_TREE;
  for (let j = 0; j < CARDS_PER_TREE; j++) cardResetTimeArr[base + j] = value;
}

// In-progress per-tap fades: tree index -> { fadeStartTime, fadeStartCoverage,
// fadeTargetCoverage }. Driven from updateTapFades() every frame (see the
// render loop) rather than written once in applyTap -- same reverse-solved-
// aResetTime trick as the instant-jump version, just re-applied each frame
// for TAP_FADE_DURATION seconds so the displayed coverage eases smoothly
// from the pre-tap level to the post-tap level instead of snapping. No new
// shader code either way: the shader still only ever reads aResetTime.
const activeFades = new Map();

function updateTapFades(now){
  if (activeFades.size === 0) return;
  for (const [i, fade] of activeFades) {
    const elapsed = now - fade.fadeStartTime;
    let coverage;
    if (elapsed >= TAP_FADE_DURATION) {
      coverage = fade.fadeTargetCoverage;
      activeFades.delete(i);
    } else {
      const p = elapsed / TAP_FADE_DURATION;
      const eased = p * p * (3 - 2 * p); // smoothstep -- same easing idiom used for fades elsewhere in this scene
      coverage = fade.fadeStartCoverage + (fade.fadeTargetCoverage - fade.fadeStartCoverage) * eased;
    }
    writeTreeResetTime(i, now - SNOW_BUILDUP_SPAN * (coverage / SNOW_BUILDUP_MAX));
  }
  cardResetTimeAttr.needsUpdate = true;
}

// Applies one tap to tree `i`. Returns { registered, tier }: registered is
// false if the tap was ignored (still on cooldown, or the tree already
// bare); tier is the dust-burst intensity for THIS tap specifically (1
// smallest / 2 medium / 3 biggest / 0 no burst), from coverage at the
// moment of tapping -- separate from (though using the same boundaries as)
// the per-sequence tap-count tier fixed below, since a multi-tap sequence's
// later taps see progressively lower live coverage and should burst
// smaller accordingly, not all match the first tap's tier.
function applyTap(i, now){
  const state = tapState[i] || (tapState[i] = { tapsRemaining: 0, perTapRemoval: 0, lastTapTime: -Infinity });
  if (now - state.lastTapTime < TAP_COOLDOWN) return { registered: false, tier: 0 };

  const current = coverageNow(i, now);
  const frac = current / SNOW_BUILDUP_MAX;
  if (state.tapsRemaining <= 0) {
    if (frac <= 0.15) return { registered: false, tier: 0 }; // 0-15%: tapping does nothing, no cooldown consumed either
    // Tap tier + per-tap removal are fixed from coverage AT THIS FIRST TAP
    // of the sequence; later taps in the same sequence reuse this same
    // perTapRemoval even as natural buildup keeps nudging live coverage up.
    // 15-33%: 1 tap, 33-66%: 2 taps, 66-100%: 3 taps.
    const requiredTaps = frac > 2/3 ? 3 : frac > 1/3 ? 2 : 1;
    state.tapsRemaining = requiredTaps;
    state.perTapRemoval = current / requiredTaps;
  }

  // Dust-burst tier for this specific tap -- same 15/33/66% boundaries as
  // above, but evaluated fresh against live coverage rather than reusing
  // the frozen per-sequence tier.
  const tier = frac <= 0.15 ? 0 : frac > 2/3 ? 3 : frac > 1/3 ? 2 : 1;

  state.lastTapTime = now;
  state.tapsRemaining -= 1;
  const target = Math.max(0, current - state.perTapRemoval);
  // Starts (or replaces, in the unlikely event one is still running) a fade
  // from the current live level down to `target`, instead of writing
  // aResetTime immediately -- updateTapFades() carries it the rest of the
  // way each frame. TAP_COOLDOWN (0.8s) is comfortably longer than
  // TAP_FADE_DURATION (0.25s), so back-to-back taps in a sequence never
  // actually overlap in practice; this still resolves sanely if that ever
  // changes, by just restarting the fade from wherever it currently is.
  activeFades.set(i, { fadeStartTime: now, fadeStartCoverage: current, fadeTargetCoverage: target });
  return { registered: true, tier };
}

// ── Dusting shake ────────────────────────────────────────────────────────────
// A brief decaying wobble of the whole card cluster around the tree's own
// vertical axis when a tap registers -- cheap: only rewrites instance
// matrices for the (small, rare) set of trees actively shaking right now,
// same "touch only what's animating" discipline as updateTapFades. No new
// shader code; this is plain CPU-side matrix composition, same as the
// original per-tree placement pass.
const SHAKE_DURATION = 0.6; // seconds until the wobble has fully settled
const activeShakes = new Map(); // tree index -> { startTime }
const _shakeRot = new THREE.Matrix4();
const _shakeCombined = new THREE.Matrix4();

function triggerShake(i, now){
  activeShakes.set(i, { startTime: now });
}

function updateShakes(now){
  if (activeShakes.size === 0) return;
  for (const [i, shake] of activeShakes) {
    const elapsed = now - shake.startTime;
    let angleJitter = 0;
    if (elapsed >= SHAKE_DURATION) {
      activeShakes.delete(i); // settles back to the resting (unrotated) pose below
    } else {
      // Amplitude reduced (was 0.14/0.05) -- the wobble's peak swing could
      // approach the size of the angular gaps found in the card layout
      // (measured 30-36 degrees in one stretch), and on a tree whose
      // static gap sits close to the camera-facing edge already, that
      // swing risked briefly widening/exposing it further. Smaller
      // amplitude shrinks that risk globally rather than patching one
      // tree's layout.
      const envelope = Math.exp(-elapsed * 6.0);
      angleJitter = Math.sin(elapsed * 18.0) * 0.10 * envelope
                  + Math.sin(elapsed * 31.0 + 1.3) * 0.04 * envelope;
    }
    const base = blockPosOfTree[i] * CARDS_PER_TREE;
    // aShakeAngle is what actually drives the rendered wobble now (see the
    // vertex shader). The instanceMatrix rewrite below is kept purely so
    // raycasting stays roughly in sync with the visual during a shake --
    // matrices are fine for that CPU-side purpose, since raycasting was
    // never exposed to the GPU-side rendering bug.
    for (let j = 0; j < CARDS_PER_TREE; j++) cardShakeAngleArr[base + j] = angleJitter;

    _shakeRot.makeRotationY(angleJitter);
    _shakeCombined.multiplyMatrices(cardTreeMatrices[i], _shakeRot);
    for (let j = 0; j < CARDS_PER_TREE; j++) {
      _finalMat.multiplyMatrices(_shakeCombined, CARD_SLOT_MATRICES[j]);
      cardMesh.setMatrixAt(base + j, _finalMat);
    }
  }
  cardMesh.instanceMatrix.needsUpdate = true;
  cardShakeAngleAttr.needsUpdate = true;
}

// Raycast against the canopy InstancedMesh (three.js raycaster natively
// resolves instanceId on InstancedMesh hits) to find which tree, if any,
// was tapped -- a hit instance index is a card index; dividing out
// CARDS_PER_TREE gives the card's BLOCK position (see the back-to-front
// sort above), which treeRenderOrder maps back to the real tree index.
// pointerdown (not click) for lower touch latency and because it pairs
// naturally with the canvas's existing touch-action:none.
const tapRaycaster = new THREE.Raycaster();
const tapNDC = new THREE.Vector2();
function handleTap(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  tapNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  tapNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  tapRaycaster.setFromCamera(tapNDC, camera);
  const hits = tapRaycaster.intersectObject(cardMesh, false);
  if (!hits.length) return null;
  const hit = hits[0];
  const cardIdx = hit.instanceId;
  if (cardIdx == null) return null;
  const blockPos = Math.floor(cardIdx / CARDS_PER_TREE);
  if (blockPos >= treeRenderOrder.length) return null;
  const i = treeRenderOrder[blockPos];
  const { registered, tier } = applyTap(i, simTime);
  if (registered) {
    if (tier > 0) spawnDustBurst(i, tier);
    triggerShake(i, simTime);
  }
  return registered ? i : null;
}
canvas.addEventListener('pointerdown', (e) => { handleTap(e.clientX, e.clientY); });

// ── Day/night toggle ─────────────────────────────────────────────────────────
// Stage 1: just the toggle mechanism and lighting transition -- no lanterns
// yet (that's a later stage). Every day/night-affected color is driven from
// ONE shared mix value (nightMix, 0=day/1=night) via lerpColors on the
// SAME live objects the rest of the scene already reads every frame
// (scene.background, scene.fog.color, hemiLight/sky's own color+intensity,
// groundMat.color, trunkMat.color, and CANOPY_GREEN/CANOPY_SNOW -- the
// latter two are the literal objects cardMat's patched shader already reads
// as uCanopyGreen/uCanopySnow, see cardMat.onBeforeCompile above, so
// mutating them in place needs no separate uniform-sync step). Night
// values are dim and cool, not literal black, so trees/ground stay
// faintly visible in outline -- exactly what's needed before lanterns
// exist to light anything.
const DAY_SKY_COLOR      = new THREE.Color(SKY_COLOR);
const NIGHT_SKY_COLOR    = new THREE.Color(0x0d1826);
const DAY_HEMI_SKY       = new THREE.Color(0xdce8ee);
const NIGHT_HEMI_SKY     = new THREE.Color(0x1c2c40);
const DAY_HEMI_GROUND    = new THREE.Color(0xb7bfae);
const NIGHT_HEMI_GROUND  = new THREE.Color(0x3a4250);
const DAY_HEMI_INTENSITY = 1.15;
// Verified via live pixel A/B testing (gl.readPixels) that the initial,
// intuitively-"dim moonlit" guesses here (0.4 intensity, 0x11151c ground
// term, 0x4a5b74 ground tint) rendered as literal (0,0,0) on screen --
// ACESFilmicToneMapping's toe crushes very low linear values straight to
// black well before they'd look merely "dim". Pushed up further still
// after finding the low-poly hexagonal trunk's worst-lit facet (viewed
// close and near-edge-on, where it gets ~zero direct light and only a
// grazing hemisphere contribution) STILL crushed to black at the first,
// smaller bump -- these are the values where even that worst-case facet
// shows real, screenshot-confirmed groove detail, while the full default-
// camera scene still reads as genuine, convincingly dark nighttime.
const NIGHT_HEMI_INTENSITY = 0.75;
const DAY_SUN_COLOR      = new THREE.Color(0xf3f8fb);
const NIGHT_SUN_COLOR    = new THREE.Color(0xaac4e6); // same directional light doubles as pale moonlight at night
const DAY_SUN_INTENSITY  = 0.35;
const NIGHT_SUN_INTENSITY = 0.16;
const DAY_GROUND_TINT    = new THREE.Color(0xffffff); // groundMat.color defaults to white -- a no-op multiply against the existing vertex-color/grain-texture shading
const NIGHT_GROUND_TINT  = new THREE.Color(0xb5c2d2);
const DAY_TRUNK_COLOR    = trunkMat.color.clone();
const NIGHT_TRUNK_COLOR  = new THREE.Color(0xc8c0d0);
const DAY_CANOPY_GREEN   = CANOPY_GREEN.clone();
const NIGHT_CANOPY_GREEN = new THREE.Color(0x1c2a28);
const DAY_CANOPY_SNOW    = CANOPY_SNOW.clone();
const NIGHT_CANOPY_SNOW  = new THREE.Color(0xb9cbdc);

// #vignette's two gradient stops (see the CSS above) are plain [r,g,b,a]
// arrays, not THREE.Color, since CSS custom properties need a formatted
// rgba() string rather than a hex value, and alpha itself needs to lerp
// too. Fixes a real bug found after Stage 1 shipped: the vignette's fixed
// light-gray tint was tuned to read as a subtle darkening against the
// light day sky, but against the dark night sky it read as a distinct
// bright ring instead -- confirmed by A/B toggling the vignette element's
// visibility and comparing screenshots. Night values darken toward the
// night sky's own tone instead, so it functions as an actual vignette at
// night rather than an inverted one.
const DAY_VIGNETTE_C1   = [170, 190, 200, 0.22];
const NIGHT_VIGNETTE_C1 = [4, 8, 14, 0.30];
const DAY_VIGNETTE_C2   = [150, 172, 185, 0.38];
const NIGHT_VIGNETTE_C2 = [2, 4, 8, 0.50];
const vignetteEl = document.getElementById('vignette');
function lerpRgba(a, b, t){
  const r = Math.round(a[0] + (b[0] - a[0]) * t);
  const g = Math.round(a[1] + (b[1] - a[1]) * t);
  const bch = Math.round(a[2] + (b[2] - a[2]) * t);
  const al = a[3] + (b[3] - a[3]) * t;
  return `rgba(${r},${g},${bch},${al.toFixed(3)})`;
}

const NIGHT_TRANSITION_DURATION = 1.8; // seconds -- animated fade, not an instant snap
let nightMix = 0, nightMixTarget = 0, nightMixStart = 0, nightTransitionStartTime = 0;

function toggleDayNight(){
  nightMixTarget = nightMixTarget === 1 ? 0 : 1;
  nightMixStart = nightMix;
  nightTransitionStartTime = simTime;
}

function updateDayNight(now){
  if (nightMix === nightMixTarget) return; // settled -- nothing to animate, so idle cost is just this one check
  const elapsed = now - nightTransitionStartTime;
  const p = Math.min(1, elapsed / NIGHT_TRANSITION_DURATION);
  if (p >= 1) {
    nightMix = nightMixTarget; // snap exactly, not whatever floating-point the lerp below would leave it at, so the early-return check above is reliable
  } else {
    const eased = p * p * (3 - 2 * p); // smoothstep -- same easing idiom used for tap fades elsewhere in this scene
    nightMix = nightMixStart + (nightMixTarget - nightMixStart) * eased;
  }

  scene.background.lerpColors(DAY_SKY_COLOR, NIGHT_SKY_COLOR, nightMix);
  scene.fog.color.lerpColors(DAY_SKY_COLOR, NIGHT_SKY_COLOR, nightMix);
  snowMat.uniforms.uFogColor.value.lerpColors(DAY_SKY_COLOR, NIGHT_SKY_COLOR, nightMix);
  hemiLight.color.lerpColors(DAY_HEMI_SKY, NIGHT_HEMI_SKY, nightMix);
  hemiLight.groundColor.lerpColors(DAY_HEMI_GROUND, NIGHT_HEMI_GROUND, nightMix);
  hemiLight.intensity = THREE.MathUtils.lerp(DAY_HEMI_INTENSITY, NIGHT_HEMI_INTENSITY, nightMix);
  sky.color.lerpColors(DAY_SUN_COLOR, NIGHT_SUN_COLOR, nightMix);
  sky.intensity = THREE.MathUtils.lerp(DAY_SUN_INTENSITY, NIGHT_SUN_INTENSITY, nightMix);
  groundMat.color.lerpColors(DAY_GROUND_TINT, NIGHT_GROUND_TINT, nightMix);
  trunkMat.color.lerpColors(DAY_TRUNK_COLOR, NIGHT_TRUNK_COLOR, nightMix);
  CANOPY_GREEN.lerpColors(DAY_CANOPY_GREEN, NIGHT_CANOPY_GREEN, nightMix);
  CANOPY_SNOW.lerpColors(DAY_CANOPY_SNOW, NIGHT_CANOPY_SNOW, nightMix);
  vignetteEl.style.setProperty('--vig-c1', lerpRgba(DAY_VIGNETTE_C1, NIGHT_VIGNETTE_C1, nightMix));
  vignetteEl.style.setProperty('--vig-c2', lerpRgba(DAY_VIGNETTE_C2, NIGHT_VIGNETTE_C2, nightMix));
}

const daynightBtn = document.getElementById('daynight-btn');
daynightBtn.addEventListener('click', () => {
  toggleDayNight();
  daynightBtn.textContent = nightMixTarget === 1 ? '☀' : '☾';
});

// ── FPS readout ───────────────────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsAccum = 0;

// ── Render loop ───────────────────────────────────────────────────────────────
// simTime accumulates from the same clamped dt used for fps, matching the
// pattern in rain.html/lava.html -- drives the snow shader's uTime, the
// only thing in the scene that currently animates.
const clock = new THREE.Clock();
// Debug fast-forward: append ?ff=<seconds> to the URL to start simTime
// already advanced that far, so the snow-buildup coverage (and anything
// else driven by simTime) can be previewed at any point in its range
// immediately, without waiting through the real multi-minute ramp. Absent
// the param, behavior is unchanged (starts at 0 as before).
const ffParam = parseFloat(new URLSearchParams(location.search).get('ff'));
let simTime = Number.isFinite(ffParam) ? ffParam : 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  snowMat.uniforms.uTime.value = simTime;
  dustMat.uniforms.uTime.value = simTime;
  // cardMat's shader uniforms only exist once WebGL has actually compiled
  // the patched shader (onBeforeCompile runs on first use) -- guard for the
  // very first frame(s) before that's happened.
  if (cardMat.userData.shader) cardMat.userData.shader.uniforms.uTime.value = simTime;
  updateTapFades(simTime);
  updateShakes(simTime);
  updateDayNight(simTime);

  renderer.render(scene, camera);

  fpsFrames++; fpsAccum += dt;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = `${(fpsFrames/fpsAccum).toFixed(1)} fps`;
    fpsFrames = 0; fpsAccum = 0;
  }
});

// ── Console handle for future work ───────────────────────────────────────────
window.__snow = { THREE, scene, camera, renderer, ground, groundMat, trunkMesh, trunkMat, barkTex, cardMesh, treePlacements, CARDS_PER_TREE, CARD_TOTAL, snow, snowMat, SNOW_COUNT, cardMat, resetTimeAttr, cardResetTimeAttr, SNOW_BUILDUP_MAX, SNOW_BUILDUP_SPAN, dust, dustMat, handleTap, spawnDustBurst, treeCardOrigin, applyTap, coverageNow, tapState, TAP_COOLDOWN, TAP_FADE_DURATION, activeFades, updateTapFades, activeShakes, triggerShake, updateShakes, SHAKE_DURATION, HEIGHT_MULT, cardPlaceAAttr, cardPlaceBAttr, cardSlotSizeAttr, cardShakeAngleAttr, treeRenderOrder, blockPosOfTree, DUST_COUNT, DUST_TIER_PARTICLES, DUST_TIER_SIZE_MULT, dustPosAttr, dustSizeAttr, dustStartAttr, hemiLight, sky, CANOPY_GREEN, CANOPY_SNOW, toggleDayNight, updateDayNight, NIGHT_TRANSITION_DURATION, get nightMix(){ return nightMix; }, get nightMixTarget(){ return nightMixTarget; }, lanternFrameMesh, lanternGlassMesh, lanternHandleMesh, lanternMetalMat, lanternGlassMat, get simTime(){ return simTime; } };
