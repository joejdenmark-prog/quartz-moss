<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfdae0">
<title>Snowy Forest</title>
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#cfdae0;
    font-family:system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #canvas{
    display:block; width:100%; height:100%;
    touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  /* Cool, light edge darkening rather than a dark dramatic vignette -- the
     brief is "bright and calm, not dim or moody", so this only needs to
     softly draw the eye inward, not shade the scene down. */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse 100% 90% at 50% 45%,
      transparent 55%, rgba(170,190,200,0.22) 82%, rgba(150,172,185,0.38) 100%);
  }
  #fps{
    position:fixed; top:8px; left:8px; z-index:9999;
    font:12px/1.4 monospace; color:#eaf2f6;
    background:rgba(20,30,36,0.55); padding:4px 8px; border-radius:4px;
    pointer-events:none; white-space:pre;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>
<div id="fps">-- fps</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Seeded RNG ───────────────────────────────────────────────────────────────
// Same mulberry32 helper as the other scenes — deterministic across reloads,
// which makes the forest layout reproducible while tuning.
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng   = mulberry32(0x5f10001);
const range = (a,b) => a + rng() * (b - a);

// ── Renderer / scene / camera ────────────────────────────────────────────────
// visualViewport (not window.innerWidth/Height) avoids the iOS Safari
// address-bar-collapse mismatch — same reasoning as the other scenes.
function getViewportSize(){
  if (window.visualViewport) {
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}

let { w: W, h: H } = getViewportSize();
const canvas = document.getElementById('canvas');
const isMobile = window.matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
// No shadow maps at all, deliberately: overcast daylight scatters through a
// full cloud layer, so real shadows are extremely soft to the point of
// being nearly invisible anyway. Skipping shadow maps entirely both matches
// the "shadowless-feeling light" brief exactly and keeps this stage cheap —
// nothing here needs to pay for shadow-map render passes.
renderer.shadowMap.enabled = false;

// Sky/fog share one color so the horizon has no visible seam where the fog
// stops and open background starts — distant trees just fade smoothly away.
const SKY_COLOR = 0xcfdbe1;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);
// Light and airy per the brief, not a heavy near-in fog: starts well past
// the midground so close/mid trees stay crisp, and only softly dissolves
// the far edge of the forest into the sky color. Distances pulled in to
// match the tree field being pulled closer (was 70/205) -- otherwise the
// far edge of the now-nearer forest would sit well short of the old fog
// start and lose the "receding into haze" depth cue entirely.
scene.fog = new THREE.Fog(SKY_COLOR, 45, 125);

// Perspective, not orthographic — "viewed from a fixed camera angle" reads
// as standing at the edge of a clearing looking in, which needs a real
// vanishing point (matches rain.html's reasoning for the same choice).
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 260);
camera.position.set(0, 1.7, 9);
camera.lookAt(0, 1.3, -30);

let resizeTimer;
function handleViewportResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const size = getViewportSize();
    W = size.w; H = size.h;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }, 250);
}
window.addEventListener('resize', handleViewportResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewportResize);
}

// ── Lights ────────────────────────────────────────────────────────────────────
// Hemisphere light does almost all the work here — it's inherently a soft,
// directionless wash between a sky tone and a ground tone, which is exactly
// what light scattered through an overcast cloud layer looks like. Kept as
// the dominant source (well above the directional light's intensity below)
// so the scene reads as bright, even, ambient daylight rather than lit from
// one particular direction.
scene.add(new THREE.HemisphereLight(0xdce8ee, 0xb7bfae, 1.15));
// A very weak, low directional light — not to cast shadows (there are none),
// just to give the tree canopies and ground undulation a faint sense of
// form/gradient so they don't read as completely flat. Positioned high and
// almost overhead, like a bright patch in a cloud layer rather than a
// visible sun.
const sky = new THREE.DirectionalLight(0xf3f8fb, 0.35);
sky.position.set(-8, 20, 6);
scene.add(sky);

// ── Ground: snowy plane with gentle undulation ───────────────────────────────
// Displaced with a handful of summed sine waves rather than an imported
// noise library — cheap, deterministic, and consistent with how the other
// scenes build their own procedural variation from scratch. This only runs
// once at startup (the ground never animates in this stage), so cost here
// is a load-time cost, not a per-frame one.
const GROUND_W = 400, GROUND_D = 220, GROUND_SEGS_X = 80, GROUND_SEGS_Z = 50;
const groundGeo = new THREE.PlaneGeometry(GROUND_W, GROUND_D, GROUND_SEGS_X, GROUND_SEGS_Z);
groundGeo.rotateX(-Math.PI / 2);
// PlaneGeometry is centered on its own origin; shift it so it spans roughly
// z:[-190, 30] instead of z:[-110, 110] — covers the full tree field (below)
// plus some ground visible near/behind the camera itself.
groundGeo.translate(0, 0, -80);

const SNOW_BASE  = new THREE.Color(0xeef4f7);
const SNOW_SHADE = new THREE.Color(0xc7d6dc); // cooler/darker, pools in the undulation's low points
{
  const pos = groundGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = Math.sin(x * 0.035 + 1.0) * 0.35
            + Math.sin(z * 0.045 + 2.4) * 0.40
            + Math.sin((x + z) * 0.021 + 0.7) * 0.50
            + Math.sin((x - z) * 0.013 + 3.1) * 0.30;
    pos.setY(i, h);
    const t = THREE.MathUtils.clamp((h + 0.9) / 1.8, 0, 1);
    c.copy(SNOW_SHADE).lerp(SNOW_BASE, t);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals(); // required after manually displacing Y — lighting would otherwise use the flat pre-displacement normals
}

// Fine grain + sparkle, layered on top of the vertex-color undulation
// shading above via ordinary texture maps rather than a custom shader --
// standard MeshStandardMaterial multiplies vertexColors x map together
// automatically, so this composites correctly with the existing lighting/
// fog for free, no shader surgery needed. Both textures are generated once
// at load time onto an offscreen canvas (no external image assets, same
// "everything procedural, no build step" approach as the rest of the
// file) and tiled via RepeatWrapping, so texel detail doesn't depend on
// the ground mesh's own (fairly coarse) vertex density the way vertex
// colors did.
function clampByte(v){ return Math.max(0, Math.min(255, v | 0)); }

// Small, low-contrast per-pixel luminance jitter -- reads as grain/texture
// up close rather than the perfectly flat white the ground had before.
function makeSnowGrainTexture(size){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - 0.5) * 30; // +-15 luminance jitter, subtle
    d[i]   = clampByte(255 + n);
    d[i+1] = clampByte(255 + n);
    d[i+2] = clampByte(255 + n * 0.92); // fractionally cooler in the dark specks than the light ones
    d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Sparse bright dots on black, used as an emissive map -- a handful of
// "crystals" that stay bright regardless of the soft overcast lighting,
// standing in for snow catching the light. The camera never moves in this
// scene, so a fixed pattern reads the same as true view-dependent glinting
// would from this one fixed angle, without needing custom specular shader
// code to get there.
function makeSparkleTexture(size, dotCount){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = size;
  const ctx = cnv.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < dotCount; i++) {
    const x = rng() * size, y = rng() * size;
    const r = range(0.5, 1.3);
    ctx.globalAlpha = range(0.35, 1.0);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const grainTex = makeSnowGrainTexture(256);
grainTex.repeat.set(50, 28); // tiled fine enough to read as grain rather than visible large tiles, across the 400x220 ground
const sparkleTex = makeSparkleTexture(512, 260);
sparkleTex.repeat.set(16, 9); // coarser repeat than the grain -- keeps individual sparkle dots looking sparse/soft rather than a dense regular-looking speckle

const groundMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.92,
  metalness: 0.0,
  map: grainTex,
  emissive: 0xffffff,
  emissiveMap: sparkleTex,
  emissiveIntensity: 0.28, // soft -- individual glints, not a glowing surface
});
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

// ── Trees ─────────────────────────────────────────────────────────────────────
// One tree = one trunk (cylinder) + two stacked canopy cones (a wider, lower
// tier and a narrower, higher one) for a simple tapered-conifer silhouette.
// Each part is its own InstancedMesh shared across every tree in the forest,
// so the whole forest costs exactly 3 draw calls total regardless of tree
// count — the "instanced if placing many of the same tree" from the brief.
// Geometry itself is deliberately low-poly (6-7 radial segments): at the
// size these render on screen the facets aren't very visible, and it keeps
// the vertex count trivial for mobile.
const TREE_COUNT = 360;

const TRUNK_H = 1.6, TRUNK_R_TOP = 0.09, TRUNK_R_BOTTOM = 0.14;
const trunkGeo = new THREE.CylinderGeometry(TRUNK_R_TOP, TRUNK_R_BOTTOM, TRUNK_H, 6, 1);
trunkGeo.translate(0, TRUNK_H / 2, 0); // base sits at local y=0 so it starts right at the ground

const CANOPY_GREEN = new THREE.Color(0x44543f); // muted, cool-toned green -- overcast winter light, not a saturated summer green
const CANOPY_SNOW  = new THREE.Color(0xeef3f2); // pale snow-dusted tips

// Builds the cone's base-to-tip height fraction (0 at base, 1 at tip) per
// vertex as a real GPU attribute (aHeightT) -- the coverage blend now runs
// per-instance in the canopy shader (see canopyMat.onBeforeCompile below),
// since each tree needs to be able to diverge from the others once tap-to-
// dust-off exists, and a shared vertex-color buffer (the old approach)
// can't represent that. Computed BEFORE the cone is translated into its
// final stacked position, while its own local Y still spans
// -height/2..+height/2 -- simpler than working out the post-translate range.
function snowCappedCone(radius, height, radialSegs){
  // heightSegments=8 (not 1) is required, not cosmetic: with only one height
  // segment a cone has just two vertex rings (apex + base), so there's no
  // intermediate geometry for a coverage gradient to ever move across --
  // the "snow line" would only ever be the single apex vertex, regardless
  // of coverage. More rings along the slant give the shader an actual
  // gradient to push up/down. Still a handful of vertices per tree (shared
  // across all instances, not duplicated), so this stays cheap.
  const geo = new THREE.ConeGeometry(radius, height, radialSegs, 8);
  const pos = geo.attributes.position;
  const heightT = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    heightT[i] = THREE.MathUtils.clamp(pos.getY(i) / height + 0.5, 0, 1);
  }
  geo.setAttribute('aHeightT', new THREE.BufferAttribute(heightT, 1));
  return geo;
}

const TIER1_R = 0.85, TIER1_H = 1.7, TIER1_BASE_Y = TRUNK_H * 0.5;
const tier1Geo = snowCappedCone(TIER1_R, TIER1_H, 7);
tier1Geo.translate(0, TIER1_BASE_Y + TIER1_H / 2, 0);

// Tiers overlap a bit (0.55 instead of 1.0) so the canopy reads as one
// continuous tapered shape rather than two separate cones with a visible gap.
const TIER2_R = 0.55, TIER2_H = 1.5, TIER2_BASE_Y = TIER1_BASE_Y + TIER1_H * 0.55;
const tier2Geo = snowCappedCone(TIER2_R, TIER2_H, 7);
tier2Geo.translate(0, TIER2_BASE_Y + TIER2_H / 2, 0);

// Snow buildup: starts bare, gradually covers more of each canopy over
// SNOW_BUILDUP_SPAN seconds, capped at SNOW_BUILDUP_MAX so trees settle
// into "convincingly snow-laden" rather than becoming solid white blobs.
// Values fed to the shader as uniforms below, not duplicated as GLSL
// literals, so there's nothing to keep in sync by hand.
// Safe to push much higher than it looks, since the cone's base ring is
// pinned to pure green by construction (pow(0, x) = 0, see the exponent
// comment in the shader patch below) regardless of how high this goes.
const SNOW_BUILDUP_MAX   = 0.92;
const SNOW_BUILDUP_SPAN  = 15; // seconds to go from start to max coverage

// Per-instance "last dusted" timestamp (simTime at last tap, 0 = never
// tapped). This is the one piece of real per-tree state the tap-to-reset
// feature needs -- everything else about a tree's snow look is still
// computed live from this single float plus the shared uTime/geometry, so
// adding independent per-tree timing costs one instanced float attribute,
// not a duplicated geometry per tree. Shared between both canopy tiers (one
// attribute object, one needsUpdate flag covers both) since a tap should
// reset a tree's whole canopy, not just one tier.
const resetTimeAttr = new THREE.InstancedBufferAttribute(new Float32Array(TREE_COUNT), 1);
resetTimeAttr.setUsage(THREE.DynamicDrawUsage); // unlike instanceMatrix, this DOES get rewritten post-load, on every tap
tier1Geo.setAttribute('aResetTime', resetTimeAttr);
tier2Geo.setAttribute('aResetTime', resetTimeAttr);

const trunkMat  = new THREE.MeshStandardMaterial({ color: 0x3b2e26, roughness: 0.95 });
const canopyMat = new THREE.MeshStandardMaterial({ roughness: 0.88 });
// Patches the compiled shader to compute each tree's snow coverage live
// from its own aResetTime, instead of reading a precomputed vertex color.
// Deliberately minimal: only appends code at two standard, stable #include
// hook points (doesn't rewrite any of three's own chunk internals), and
// fully owns the final color via its own vSnowColor varying rather than
// fighting with the built-in vertexColors/instanceColor pipeline.
canopyMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uCanopyGreen = { value: CANOPY_GREEN };
  shader.uniforms.uCanopySnow = { value: CANOPY_SNOW };
  shader.uniforms.uBuildupMax = { value: SNOW_BUILDUP_MAX };
  shader.uniforms.uBuildupSpan = { value: SNOW_BUILDUP_SPAN };

  shader.vertexShader = `
    attribute float aHeightT;
    attribute float aResetTime;
    uniform float uTime, uBuildupMax, uBuildupSpan;
    uniform vec3 uCanopyGreen, uCanopySnow;
    varying vec3 vSnowColor;
  ` + shader.vertexShader.replace('#include <color_vertex>', `
    #include <color_vertex>
    {
      float elapsed = max(uTime - aResetTime, 0.0);
      // 0 at reset/spawn, 1 once fully built up -- a real zero, not a
      // floored one, so a freshly-reset tree can actually reach "no snow".
      float elapsedNorm = min(1.0, elapsed / uBuildupSpan);
      float coverage = uBuildupMax * elapsedNorm;
      // Lower exponent = the pow(t, exponent) curve stays high (near 1, i.e.
      // snowy) further down the cone -- more of the tree reads as covered.
      float exponent = mix(1.6, 0.15, coverage);
      // pow(aHeightT, exponent) alone can't reach zero at the apex (t=1):
      // pow(1, x) == 1 for every exponent, so the tip was always rendered
      // as 100% snow color regardless of coverage -- that's what was
      // showing as a white tint even at minimum coverage. Multiplying by
      // elapsedNorm scales the whole blend down to true zero everywhere
      // (apex included) when coverage is zero, while still reproducing
      // the exact previously-tuned look once elapsedNorm reaches 1.
      float blend = pow(aHeightT, exponent) * elapsedNorm;
      vec3 snowColor = mix(uCanopyGreen, uCanopySnow, blend);
      #ifdef USE_INSTANCING_COLOR
        snowColor *= instanceColor.rgb;
      #endif
      vSnowColor = snowColor;
    }
  `);
  shader.fragmentShader = `varying vec3 vSnowColor;\n` +
    shader.fragmentShader.replace('#include <color_fragment>', `
    #include <color_fragment>
    diffuseColor.rgb = vSnowColor;
  `);
  canopyMat.userData.shader = shader;
};

const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
const tier1Mesh = new THREE.InstancedMesh(tier1Geo, canopyMat, TREE_COUNT);
const tier2Mesh = new THREE.InstancedMesh(tier2Geo, canopyMat, TREE_COUNT);
// Trees never move in this stage (no wind/interaction yet), so StaticDrawUsage
// is the correct hint — lets the driver put the instance buffers somewhere
// it wouldn't bother to for data it expects to be rewritten every frame.
[trunkMesh, tier1Mesh, tier2Mesh].forEach(m => m.instanceMatrix.setUsage(THREE.StaticDrawUsage));

// Scattered with simple rejection sampling (reject a candidate if it lands
// too close to an already-placed tree) for a natural, non-overlapping
// layout rather than a grid. A few hundred trees keeps this one-time
// O(n^2)-ish placement pass well under a millisecond, so no need for a
// spatial index here.
const FIELD_HALF_X = 90;
// Both bounds pulled in noticeably (was 3 / -175) so the same tree count
// packs into a smaller volume -- brings the nearest trees close enough to
// feel present/immersive rather than sitting in the mid-distance, and
// raises overall density (not just the boundary) since the same 360 trees
// now fill less depth.
const FIELD_Z_NEAR = 6;    // closest a tree may spawn to the camera
const FIELD_Z_FAR  = -100; // furthest into the fog
const MIN_SPACING  = 2.6;
function scatterTrees(count){
  const placements = [];
  let attempts = 0;
  const maxAttempts = count * 60;
  while (placements.length < count && attempts < maxAttempts) {
    attempts++;
    const x = range(-FIELD_HALF_X, FIELD_HALF_X);
    const z = range(FIELD_Z_FAR, FIELD_Z_NEAR);
    // Keep a small gap directly ahead of the camera so the view isn't
    // immediately blocked by a trunk right at the lens. Narrowed along
    // with the closer near bound (was 2.5/7) so this doesn't end up
    // excluding most of the newly-close range -- just enough to keep the
    // lens itself clear.
    if (Math.abs(x) < 1.6 && z > FIELD_Z_NEAR - 3.5) continue;
    let ok = true;
    for (let i = 0; i < placements.length; i++) {
      const dx = placements[i].x - x, dz = placements[i].z - z;
      if (dx*dx + dz*dz < MIN_SPACING*MIN_SPACING) { ok = false; break; }
    }
    if (ok) placements.push({ x, z });
  }
  return placements;
}
const treePlacements = scatterTrees(TREE_COUNT);

// Applied as an instance-transform stretch (Y only, not X/Z) rather than a
// geometry change -- taller trunk+canopy together, without proportionally
// widening the canopy too, which reads as more looming/immersive rather
// than just "the same tree but bigger".
const HEIGHT_MULT = 1.65;

const dummy = new THREE.Object3D();
const tint = new THREE.Color();
for (let i = 0; i < treePlacements.length; i++) {
  const { x, z } = treePlacements[i];
  // Size varies independently of distance (real forests mix tree sizes at
  // any given depth) -- perspective projection alone already makes farther
  // trees read as smaller, so this is on top of that, not instead of it.
  const scale = range(0.8, 1.35);
  const rotY = range(0, Math.PI * 2);

  dummy.position.set(x, 0, z);
  dummy.rotation.set(0, rotY, 0);
  dummy.scale.set(scale, scale * HEIGHT_MULT, scale);
  dummy.updateMatrix();

  // Trunk and both canopy tiers share this exact matrix -- their relative
  // heights are already baked into each geometry (see the translate() calls
  // above), so one shared transform keeps all three parts of a tree
  // perfectly aligned without extra per-part math.
  trunkMesh.setMatrixAt(i, dummy.matrix);
  tier1Mesh.setMatrixAt(i, dummy.matrix);
  tier2Mesh.setMatrixAt(i, dummy.matrix);

  // Subtle per-tree color jitter (multiplies with each cone's own
  // base-to-tip vertex color) so the forest isn't visibly stamped from one
  // identical tree.
  tint.setHSL(0.32 + range(-0.03, 0.03), 0.18 + range(-0.06, 0.06), 0.92 + range(-0.06, 0.04));
  tier1Mesh.setColorAt(i, tint);
  tier2Mesh.setColorAt(i, tint);
}
// Placements can land short of TREE_COUNT if the field fills up before
// maxAttempts runs out; only the instances actually written above should
// draw, so the instanced mesh count is trimmed to what was really placed.
[trunkMesh, tier1Mesh, tier2Mesh].forEach(m => { m.count = treePlacements.length; });
trunkMesh.instanceMatrix.needsUpdate = true;
tier1Mesh.instanceMatrix.needsUpdate = true;
tier2Mesh.instanceMatrix.needsUpdate = true;
tier1Mesh.instanceColor.needsUpdate = true;
tier2Mesh.instanceColor.needsUpdate = true;

scene.add(trunkMesh, tier1Mesh, tier2Mesh);

// ── Falling snow ──────────────────────────────────────────────────────────────
// Every particle's position is a closed-form function of uTime (straight
// fall + wraparound loop + a per-particle sine-based horizontal drift/
// tumble), computed entirely in the vertex shader -- the CPU only ever
// updates one uniform per frame, regardless of particle count. That's the
// point of doing it this way rather than updating a position array in JS
// each frame: a JS-side loop over thousands of particles every frame would
// scale badly toward "blizzard" counts, while GPU-side per-vertex math for
// even tens of thousands of points is trivial. One THREE.Points object, one
// draw call for the entire snowfall regardless of density -- no per-pixel
// search of any kind, unlike rain.html's droplets (which need the
// occupancy-gate machinery specifically because they sample/bend the
// background; these don't).
const SNOW_COUNT = 3000; // <- the single density dial: light flurries to blizzard-thick, just change this
// Sized to the camera's actual view cone, not just copied from the tree
// field's width -- measured directly (via the real projection matrix)
// that with the old values only ~13% of particles were ever inside the
// frustum at a given moment: SNOW_Z_NEAR=20 put ~9% of particles behind
// the camera entirely (it sits at z=9), and SNOW_X_HALF=95 was far wider
// than the frustum ever needs even at the farthest used depth (measured
// half-width there: ~28 in portrait). Narrowed to comfortably cover a
// landscape-oriented view too (a wider aspect ratio needs a wider spread
// than portrait does), rather than shrinking all the way to the
// portrait-only minimum -- this is about not wasting most of the density
// budget off-frustum, not about trimming as far as possible.
const SNOW_X_HALF = 70;
const SNOW_Z_NEAR = 8, SNOW_Z_FAR = -100; // near bound just in front of the camera (was 20, behind it) -- some snow still drifts close to the lens, none wasted spawning where it can never be seen
// -2 (was -3) is just a loop floor for the time-wraparound math below, not
// where flakes actually vanish any more -- see uGroundHeight in the vertex
// shader, which fades each flake out right at the REAL (undulating)
// ground surface instead. Tightened slightly since flakes now go invisible
// well before reaching this floor anyway (the ground's lowest point is
// ~-1.18); a much deeper floor would just mean more of each particle's
// cycle spent invisible underground before it loops back to the top.
const SNOW_Y_TOP = 34, SNOW_Y_BOTTOM = -2;

const snowGeo = new THREE.BufferGeometry();
// "position" here is a fixed per-particle ANCHOR (x/z spawn column, y
// unused/zeroed), not the live falling position -- the actual Y each frame
// is computed in the shader from uTime, never written back to this array.
const anchors  = new Float32Array(SNOW_COUNT * 3);
const fallInfo = new Float32Array(SNOW_COUNT * 2); // x: fall speed, y: time-phase offset (desyncs particles so they don't all fall in lockstep)
const drift    = new Float32Array(SNOW_COUNT * 4); // x: drift amp (X axis), y: drift freq, z: drift phase, w: drift amp (Z axis)
const sizes    = new Float32Array(SNOW_COUNT);

for (let i = 0; i < SNOW_COUNT; i++) {
  anchors[i*3+0] = range(-SNOW_X_HALF, SNOW_X_HALF);
  anchors[i*3+1] = 0;
  anchors[i*3+2] = range(SNOW_Z_FAR, SNOW_Z_NEAR);

  fallInfo[i*2+0] = range(2.2, 4.2);
  fallInfo[i*2+1] = range(0, 1000);

  drift[i*4+0] = range(0.3, 1.1);
  drift[i*4+1] = range(0.15, 0.45);
  drift[i*4+2] = range(0, Math.PI * 2);
  drift[i*4+3] = range(0.2, 0.7);

  sizes[i] = range(2.0, 5.0);
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(anchors, 3));
snowGeo.setAttribute('aFall', new THREE.BufferAttribute(fallInfo, 2));
snowGeo.setAttribute('aDrift', new THREE.BufferAttribute(drift, 4));
snowGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

const snowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uYTop: { value: SNOW_Y_TOP },
    uYBottom: { value: SNOW_Y_BOTTOM },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uFogColor: { value: new THREE.Color(SKY_COLOR) },
    uFogNear: { value: scene.fog.near },
    uFogFar: { value: scene.fog.far },
  },
  transparent: true,
  depthWrite: false, // standard for soft transparent sprites -- avoids z-fighting/sorting artifacts between overlapping flakes, while depthTest (left on, default) still lets trees correctly occlude snow behind them
  vertexShader: `
    attribute vec2 aFall;
    attribute vec4 aDrift;
    attribute float aSize;
    uniform float uTime, uYTop, uYBottom, uPixelRatio;
    varying float vFogDepth;
    varying float vAlpha;

    // Exactly mirrors the ground plane's own displacement formula (see the
    // JS that builds groundGeo) -- so "the ground surface at this x/z" is
    // known here in closed form too, without needing to read back the
    // actual mesh. Keeping the two in sync is why this is a literal copy
    // rather than an approximation.
    float groundHeight(vec2 xz){
      float x = xz.x, z = xz.y;
      return sin(x*0.035 + 1.0) * 0.35
           + sin(z*0.045 + 2.4) * 0.40
           + sin((x+z)*0.021 + 0.7) * 0.50
           + sin((x-z)*0.013 + 3.1) * 0.30;
    }

    void main(){
      float span = uYTop - uYBottom;
      float fallT = mod(uTime * aFall.x + aFall.y, span);
      float y = uYTop - fallT;

      // Gentle wind-blown wander rather than a straight drop -- two offset
      // sine waves (X and Z, different frequency/phase) trace a slow
      // lissajous-style curve as the flake falls, read as "tumbling"
      // rather than sliding on rails.
      float driftX = sin(uTime * aDrift.y + aDrift.z) * aDrift.x;
      float driftZ = cos(uTime * aDrift.y * 0.8 + aDrift.z * 1.3) * aDrift.w;
      float worldX = position.x + driftX, worldZ = position.z + driftZ;

      // How far this flake sits above the REAL (undulating) ground surface
      // directly below its current (drifted) x/z -- not the fixed loop
      // floor. Fades out smoothly over the last little bit of the approach
      // rather than popping, and reaches exactly 0 once it reaches the
      // surface, so it visibly settles onto the ground instead of phasing
      // through it. No accumulation/depth change -- the ground itself
      // never moves, this only ever hides the flake; the same particle
      // budget just keeps recycling from the top once fallT wraps.
      float groundY = groundHeight(vec2(worldX, worldZ));
      float aboveGround = y - groundY;
      float landFade = smoothstep(0.0, 0.6, aboveGround);
      // Once landed, keep the point pinned right at the surface rather
      // than letting it keep sinking (invisibly) toward uYBottom -- purely
      // cosmetic since alpha is already 0 there, just avoids rendering a
      // fully-transparent point far below the ground for no reason.
      y = max(y, groundY);

      vec3 pos = vec3(worldX, y, worldZ);
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;

      float dist = -mvPosition.z;
      gl_PointSize = clamp(aSize * uPixelRatio * (50.0 / max(dist, 3.0)), 1.0, 40.0);
      vFogDepth = dist;

      // Fade in at the top of the fall span so a particle never visibly
      // pops into existence mid-air right after respawning.
      float fadeIn = smoothstep(0.0, span * 0.06, fallT);
      vAlpha = fadeIn * landFade;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor; uniform float uFogNear, uFogFar;
    varying float vFogDepth; varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.35, d); // soft round sprite, no texture needed
      if (shape < 0.01) discard;
      float fog = smoothstep(uFogNear, uFogFar, vFogDepth);
      vec3 col = mix(vec3(1.0), uFogColor, fog * 0.7); // distant flakes cool/pale toward the fog color, same cue the trees get
      float alpha = shape * vAlpha * (1.0 - fog * 0.85);
      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const snow = new THREE.Points(snowGeo, snowMat);
// The geometry's own bounding sphere is computed from the static anchor
// positions (y=0 for all of them), which doesn't reflect the actual
// y:[uYBottom,uYTop] range the shader moves particles through -- automatic
// frustum culling would use that stale bounding sphere and could cull the
// whole snowfall incorrectly. Positions are cheap to compute either way, so
// just render it unconditionally rather than trying to keep a manual
// bounding volume in sync.
snow.frustumCulled = false;
scene.add(snow);

// ── Tap-to-dust-off ───────────────────────────────────────────────────────────
// Tapping a tree resets its aResetTime (see canopyMat.onBeforeCompile above)
// so its own coverage curve restarts, independently of every other tree,
// plus a brief particle burst at the tap point to sell "snow flicking off
// branches". The burst is a small fixed pool of points recycled round-robin
// across taps -- taps are rare, human-paced events, so there's no need for
// the "thousands of particles" GPU-only discipline the falling snow needed;
// a tiny CPU write of a few dozen values per tap is negligible.
const DUST_PER_TAP = 36;
const DUST_MAX_CONCURRENT = 4; // a handful of taps in quick succession can be in flight at once without visibly stealing each other's particles
const DUST_COUNT = DUST_PER_TAP * DUST_MAX_CONCURRENT;
const DUST_DURATION = 0.9; // seconds -- brief, per the brief's "keep it brief"

const dustOrigins = new Float32Array(DUST_COUNT * 3);
const dustVel = new Float32Array(DUST_COUNT * 3);
const dustSize = new Float32Array(DUST_COUNT);
// Very negative, not 0 -- with aStartTime=0, a fresh page load (uTime≈0)
// would read as "mid-burst at t≈0" and every dust slot would flash visible
// at the origin the instant the scene loads. This keeps every slot's
// elapsed time (uTime - aStartTime) enormous, and therefore invisible
// (past uDustDuration), until an actual tap writes a real start time.
const DUST_INACTIVE_START = -1e6;
const dustStart = new Float32Array(DUST_COUNT).fill(DUST_INACTIVE_START);
for (let i = 0; i < DUST_COUNT; i++) {
  // Rough upward+outward pop, like snow flicking off a tapped branch --
  // randomized once per pool slot; reused each time that slot is recycled,
  // which reads as fine natural variation given taps are infrequent.
  const theta = rng() * Math.PI * 2;
  const speedXZ = range(0.6, 2.2);
  dustVel[i*3+0] = Math.cos(theta) * speedXZ;
  dustVel[i*3+1] = range(0.8, 2.6);
  dustVel[i*3+2] = Math.sin(theta) * speedXZ;
  dustSize[i] = range(2.0, 4.5);
}
const dustGeo = new THREE.BufferGeometry();
const dustPosAttr = new THREE.BufferAttribute(dustOrigins, 3);
const dustStartAttr = new THREE.BufferAttribute(dustStart, 1);
dustPosAttr.setUsage(THREE.DynamicDrawUsage);
dustStartAttr.setUsage(THREE.DynamicDrawUsage);
dustGeo.setAttribute('position', dustPosAttr);
dustGeo.setAttribute('aVel', new THREE.BufferAttribute(dustVel, 3));
dustGeo.setAttribute('aStartTime', dustStartAttr);
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSize, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uDuration: { value: DUST_DURATION },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec3 aVel;
    attribute float aStartTime;
    attribute float aSize;
    uniform float uTime, uDuration, uPixelRatio;
    varying float vAlpha;
    void main(){
      float t = uTime - aStartTime;
      vec3 pos = position;
      float alpha = 0.0;
      if (t >= 0.0 && t < uDuration) {
        vec3 gravity = vec3(0.0, -9.0, 0.0);
        pos = position + aVel * t + 0.5 * gravity * t * t;
        float fadeIn = smoothstep(0.0, uDuration * 0.08, t);
        float fadeOut = 1.0 - smoothstep(uDuration * 0.45, uDuration, t);
        alpha = fadeIn * fadeOut;
      }
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      float dist = -mvPosition.z;
      gl_PointSize = clamp(aSize * uPixelRatio * (50.0 / max(dist, 3.0)), 1.0, 30.0);
      vAlpha = alpha;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.35, d);
      if (shape < 0.01) discard;
      gl_FragColor = vec4(1.0, 1.0, 1.0, shape * vAlpha * 0.9);
    }
  `,
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled = false; // same reasoning as `snow` above -- shader-displaced positions aren't reflected in the geometry's static bounding sphere
scene.add(dust);

let dustCursor = 0;
function spawnDustBurst(originPoint){
  for (let k = 0; k < DUST_PER_TAP; k++){
    const j = dustCursor;
    dustCursor = (dustCursor + 1) % DUST_COUNT;
    dustPosAttr.setXYZ(j, originPoint.x, originPoint.y, originPoint.z);
    dustStartAttr.setX(j, simTime);
  }
  dustPosAttr.needsUpdate = true;
  dustStartAttr.needsUpdate = true;
}

// ── Multi-tap dusting state machine ──────────────────────────────────────────
// Coverage is the sum of two things running concurrently: natural time-based
// buildup (still just the shader's existing `uBuildupMax * min(1, (uTime -
// aResetTime)/uBuildupSpan)` formula, completely unchanged) and cumulative
// removal from taps. Rather than track "removed" as a separate quantity fed
// into the shader, every tap RE-ANCHORS aResetTime to whatever value makes
// that same unchanged formula produce the desired reduced coverage right
// now -- the same trick the old single-tap reset already used (aResetTime =
// now, i.e. "make coverage 0 right now"), just solved for an arbitrary
// target level instead of only 0. The shader needs zero new code for this;
// only the JS deciding what number to write changes.
const TAP_COOLDOWN = 0.8; // seconds -- per tree, shared across both canopy tiers (one tapState per tree index, since a tap on either tier counts as tapping the whole tree)
const TAP_FADE_DURATION = 0.25; // seconds -- how long a single tap's removal takes to visibly settle, rather than snapping instantly
const tapState = new Array(treePlacements.length).fill(null); // lazily created per tree on first tap: { tapsRemaining, perTapRemoval, lastTapTime }

// Mirrors the shader's coverage formula exactly (see canopyMat.onBeforeCompile)
// -- must stay in sync if that formula ever changes.
function coverageNow(i, now){
  const elapsed = Math.max(0, now - resetTimeAttr.array[i]);
  const elapsedNorm = Math.min(1, elapsed / SNOW_BUILDUP_SPAN);
  return SNOW_BUILDUP_MAX * elapsedNorm;
}

// In-progress per-tap fades: tree index -> { fadeStartTime, fadeStartCoverage,
// fadeTargetCoverage }. Driven from updateTapFades() every frame (see the
// render loop) rather than written once in applyTap -- same reverse-solved-
// aResetTime trick as the instant-jump version, just re-applied each frame
// for TAP_FADE_DURATION seconds so the displayed coverage eases smoothly
// from the pre-tap level to the post-tap level instead of snapping. No new
// shader code either way: the shader still only ever reads aResetTime.
const activeFades = new Map();

function updateTapFades(now){
  if (activeFades.size === 0) return;
  for (const [i, fade] of activeFades) {
    const elapsed = now - fade.fadeStartTime;
    let coverage;
    if (elapsed >= TAP_FADE_DURATION) {
      coverage = fade.fadeTargetCoverage;
      activeFades.delete(i);
    } else {
      const p = elapsed / TAP_FADE_DURATION;
      const eased = p * p * (3 - 2 * p); // smoothstep -- same easing idiom used for fades elsewhere in this scene
      coverage = fade.fadeStartCoverage + (fade.fadeTargetCoverage - fade.fadeStartCoverage) * eased;
    }
    resetTimeAttr.array[i] = now - SNOW_BUILDUP_SPAN * (coverage / SNOW_BUILDUP_MAX);
  }
  resetTimeAttr.needsUpdate = true;
}

// Applies one tap to tree `i`. Returns true if it actually registered
// (false if it was ignored: still on cooldown, or the tree is already bare).
function applyTap(i, now){
  const state = tapState[i] || (tapState[i] = { tapsRemaining: 0, perTapRemoval: 0, lastTapTime: -Infinity });
  if (now - state.lastTapTime < TAP_COOLDOWN) return false;

  const current = coverageNow(i, now);
  if (state.tapsRemaining <= 0) {
    if (current <= 0) return false; // bare tree -- tapping does nothing, no cooldown consumed either
    // Tap tier + per-tap removal are fixed from coverage AT THIS FIRST TAP
    // of the sequence; later taps in the same sequence reuse this same
    // perTapRemoval even as natural buildup keeps nudging live coverage up.
    const frac = current / SNOW_BUILDUP_MAX;
    const requiredTaps = frac > 2/3 ? 3 : frac > 1/3 ? 2 : 1;
    state.tapsRemaining = requiredTaps;
    state.perTapRemoval = current / requiredTaps;
  }

  state.lastTapTime = now;
  state.tapsRemaining -= 1;
  const target = Math.max(0, current - state.perTapRemoval);
  // Starts (or replaces, in the unlikely event one is still running) a fade
  // from the current live level down to `target`, instead of writing
  // aResetTime immediately -- updateTapFades() carries it the rest of the
  // way each frame. TAP_COOLDOWN (0.8s) is comfortably longer than
  // TAP_FADE_DURATION (0.25s), so back-to-back taps in a sequence never
  // actually overlap in practice; this still resolves sanely if that ever
  // changes, by just restarting the fade from wherever it currently is.
  activeFades.set(i, { fadeStartTime: now, fadeStartCoverage: current, fadeTargetCoverage: target });
  return true;
}

// Raycast against the two canopy InstancedMeshes (three.js raycaster
// natively resolves instanceId on InstancedMesh hits) to find which tree,
// if any, was tapped. pointerdown (not click) for lower touch latency and
// because it pairs naturally with the canvas's existing touch-action:none.
const tapRaycaster = new THREE.Raycaster();
const tapNDC = new THREE.Vector2();
function handleTap(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  tapNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  tapNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  tapRaycaster.setFromCamera(tapNDC, camera);
  const hits = tapRaycaster.intersectObjects([tier1Mesh, tier2Mesh], false);
  if (!hits.length) return null;
  const hit = hits[0];
  const i = hit.instanceId;
  if (i == null || i >= treePlacements.length) return null;
  const registered = applyTap(i, simTime);
  if (registered) spawnDustBurst(hit.point);
  return registered ? i : null;
}
canvas.addEventListener('pointerdown', (e) => { handleTap(e.clientX, e.clientY); });

// ── FPS readout ───────────────────────────────────────────────────────────────
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsAccum = 0;

// ── Render loop ───────────────────────────────────────────────────────────────
// simTime accumulates from the same clamped dt used for fps, matching the
// pattern in rain.html/lava.html -- drives the snow shader's uTime, the
// only thing in the scene that currently animates.
const clock = new THREE.Clock();
// Debug fast-forward: append ?ff=<seconds> to the URL to start simTime
// already advanced that far, so the snow-buildup coverage (and anything
// else driven by simTime) can be previewed at any point in its range
// immediately, without waiting through the real multi-minute ramp. Absent
// the param, behavior is unchanged (starts at 0 as before).
const ffParam = parseFloat(new URLSearchParams(location.search).get('ff'));
let simTime = Number.isFinite(ffParam) ? ffParam : 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  snowMat.uniforms.uTime.value = simTime;
  dustMat.uniforms.uTime.value = simTime;
  // canopyMat's shader uniforms only exist once WebGL has actually compiled
  // the patched shader (onBeforeCompile runs on first use) -- guard for the
  // very first frame(s) before that's happened.
  if (canopyMat.userData.shader) canopyMat.userData.shader.uniforms.uTime.value = simTime;
  updateTapFades(simTime);

  renderer.render(scene, camera);

  fpsFrames++; fpsAccum += dt;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = `${(fpsFrames/fpsAccum).toFixed(1)} fps`;
    fpsFrames = 0; fpsAccum = 0;
  }
});

// ── Console handle for future work ───────────────────────────────────────────
window.__snow = { THREE, scene, camera, renderer, ground, trunkMesh, tier1Mesh, tier2Mesh, treePlacements, snow, snowMat, SNOW_COUNT, tier1Geo, tier2Geo, canopyMat, resetTimeAttr, SNOW_BUILDUP_MAX, SNOW_BUILDUP_SPAN, dust, dustMat, handleTap, spawnDustBurst, applyTap, coverageNow, tapState, TAP_COOLDOWN, TAP_FADE_DURATION, activeFades, updateTapFades, get simTime(){ return simTime; } };
</script>
</body>
</html>
